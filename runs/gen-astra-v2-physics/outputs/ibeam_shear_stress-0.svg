<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#263746"/>
    </marker>
    <marker id="forceArrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#b4472c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="910" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263746">
    <text x="60" y="43" font-size="27" font-weight="700">W250×33 — transverse shear stress</text>
    <text x="60" y="73" font-size="16">V = 100 kN   •   Dimensions in mm   •   Rectangular flange/web idealization; root fillets neglected</text>

    <!-- Applied vertical shear -->
    <line x1="300" y1="99" x2="300" y2="155" stroke="#b4472c" stroke-width="3" marker-end="url(#forceArrow)"/>
    <text x="322" y="126" font-size="18" fill="#b4472c">V = 100 kN</text>

    <!-- Section: scale 1.65 drawing units per mm -->
    <path d="M 179.55 170
             H 420.45 V 185.015 H 305.0325
             V 580.685 H 420.45 V 595.7
             H 179.55 V 580.685 H 294.9675
             V 185.015 H 179.55 Z"
          fill="#dbe2e8" stroke="#263746" stroke-width="2"/>

    <!-- Neutral axis and common depth reference lines -->
    <line x1="150" y1="382.85" x2="1075" y2="382.85" stroke="#83919d" stroke-width="1" stroke-dasharray="9 5 2 5"/>
    <text x="161" y="373" font-size="14">N.A.</text>
    <text x="521" y="373" font-size="14">y = 0</text>
    <line x1="500" y1="170" x2="1050" y2="170" stroke="#c6ced5" stroke-width="1" stroke-dasharray="5 5"/>
    <line x1="500" y1="185.015" x2="965" y2="185.015" stroke="#c6ced5" stroke-width="1" stroke-dasharray="5 5"/>
    <line x1="500" y1="580.685" x2="965" y2="580.685" stroke="#c6ced5" stroke-width="1" stroke-dasharray="5 5"/>
    <line x1="500" y1="595.7" x2="1050" y2="595.7" stroke="#c6ced5" stroke-width="1" stroke-dasharray="5 5"/>

    <!-- Overall depth dimension -->
    <line x1="95" y1="170" x2="169" y2="170" stroke="#637380" stroke-width="1"/>
    <line x1="95" y1="595.7" x2="169" y2="595.7" stroke="#637380" stroke-width="1"/>
    <line x1="108" y1="170" x2="108" y2="595.7" stroke="#263746" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="88" y="382.85" font-size="17" text-anchor="middle" transform="rotate(-90 88 382.85)">258 mm</text>

    <!-- Flange width dimension -->
    <line x1="179.55" y1="605" x2="179.55" y2="651" stroke="#637380" stroke-width="1"/>
    <line x1="420.45" y1="605" x2="420.45" y2="651" stroke="#637380" stroke-width="1"/>
    <line x1="179.55" y1="636" x2="420.45" y2="636" stroke="#263746" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="300" y="626" font-size="17" text-anchor="middle">146 mm</text>

    <!-- Part and thickness leaders -->
    <circle cx="395" cy="177.5" r="2.6" fill="#263746"/>
    <polyline points="395,177.5 457,226 492,226" fill="none" stroke="#263746" stroke-width="1.2"/>
    <text x="463" y="249" font-size="16">Flange</text>
    <text x="463" y="271" font-size="16">t<tspan></tspan> = 9.1 mm</text>

    <circle cx="300" cy="456" r="2.6" fill="#263746"/>
    <polyline points="300,456 414,493 480,493" fill="none" stroke="#263746" stroke-width="1.2"/>
    <text x="418" y="518" font-size="16">Web</text>
    <text x="418" y="540" font-size="16">t = 6.1 mm</text>

    <text x="300" y="685" font-size="18" text-anchor="middle" font-weight="700">Steel section</text>

    <!-- Shear stress diagram; horizontal scale 4 units per MPa -->
    <text x="720" y="121" font-size="19" font-weight="700">τ = VQ / (Iₓ t)</text>
    <text x="720" y="145" font-size="14">Stress magnitude, aligned with section depth</text>

    <path d="M 720 170
             Q 724.873 177.5075 729.402 185.015
             H 945.026
             Q 1004.6997 283.9325 1004.6997 382.85
             Q 1004.6997 481.7675 945.026 580.685
             H 729.402
             Q 724.873 588.1925 720 595.7 Z"
          fill="#dceef9" stroke="#1674aa" stroke-width="2.5"/>

    <line x1="720" y1="160" x2="720" y2="609" stroke="#263746" stroke-width="1.4"/>
    <text x="703" y="166" font-size="14" text-anchor="end">0</text>
    <text x="703" y="610" font-size="14" text-anchor="end">0</text>

    <!-- Junction and maximum annotations -->
    <circle cx="945.026" cy="185.015" r="3.5" fill="#1674aa"/>
    <polyline points="945.026,185.015 976,215 986,215" fill="none" stroke="#1674aa" stroke-width="1.3"/>
    <text x="990" y="218" font-size="16" fill="#12618e">τj,web = 56.26 MPa</text>
    <text x="990" y="240" font-size="14">At |y| = 119.9 mm</text>

    <circle cx="1004.6997" cy="382.85" r="3.5" fill="#1674aa"/>
    <polyline points="1004.6997,382.85 1026,356 1035,356" fill="none" stroke="#1674aa" stroke-width="1.3"/>
    <text x="1036" y="332" font-size="16" fill="#12618e">τmax = 71.17</text>
    <text x="1036" y="353" font-size="16" fill="#12618e">MPa</text>

    <text x="765" y="443" font-size="16" fill="#12618e">Parabolic in web</text>
    <text x="765" y="467" font-size="14">t = 6.1 mm</text>

    <polyline points="822,580.685 850,548 865,548" fill="none" stroke="#1674aa" stroke-width="1.2"/>
    <text x="755" y="526" font-size="14" fill="#12618e">Jump as t changes:</text>
    <text x="755" y="547" font-size="14" fill="#12618e">146 → 6.1 mm</text>

    <!-- Stress scale -->
    <line x1="720" y1="636" x2="1070" y2="636" stroke="#263746" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g stroke="#263746" stroke-width="1">
      <line x1="720" y1="630" x2="720" y2="642"/>
      <line x1="800" y1="630" x2="800" y2="642"/>
      <line x1="880" y1="630" x2="880" y2="642"/>
      <line x1="960" y1="630" x2="960" y2="642"/>
      <line x1="1040" y1="630" x2="1040" y2="642"/>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="720" y="660">0</text>
      <text x="800" y="660">20</text>
      <text x="880" y="660">40</text>
      <text x="960" y="660">60</text>
      <text x="1040" y="660">80</text>
    </g>
    <text x="1080" y="641" font-size="16">τ (MPa)</text>
    <text x="885" y="685" font-size="18" text-anchor="middle" font-weight="700">Transverse shear stress</text>

    <!-- Calculation summary -->
    <rect x="60" y="719" width="1080" height="157" fill="#f4f7f9" stroke="#c6ced5" stroke-width="1"/>
    <text x="80" y="746" font-size="17" font-weight="700">Section properties and calculated stresses</text>
    <text x="80" y="775" font-size="17">Iₓ = [146(258)³ − (146 − 6.1)(239.8)³] / 12 = 48,182,172 mm⁴</text>
    <text x="80" y="803" font-size="16">Qj = (146 × 9.1)(124.45) = 165,344.27 mm³</text>
    <text x="80" y="830" font-size="16">QNA = Qj + (6.1 / 2)(119.9)² = 209,191.10 mm³</text>
    <text x="80" y="857" font-size="14">V = 100,000 N; t = 6.1 mm in the web and 146 mm in the flanges. Flange-side junction stress = 2.35 MPa.</text>
  </g>
</svg>