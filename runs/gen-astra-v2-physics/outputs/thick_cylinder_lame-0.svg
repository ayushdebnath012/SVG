      C949.333 315.062 963.667 318.620 978 321.875
      C992.333 325.130 1006.667 328.082 1021 330.796
      C1035.333 333.510 1049.667 335.986 1064 338.272
      C1078.333 340.558 1092.667 342.654 1107 344.598
      C1121.333 346.542 1135.667 348.333 1150 350"
      fill="none" stroke="#b42335" stroke-width="3"/>

    <path d="M720 600
      C734.333 586.667 748.667 575.307 763 565.289
      C777.333 555.271 791.667 546.605 806 538.889
      C820.333 531.173 834.667 524.412 849 518.343
      C863.333 512.274 877.667 506.900 892 502.041
      C906.333 497.182 920.667 492.840 935 488.889
      C949.333 484.938 963.667 481.380 978 478.125
      C992.333 474.870 1006.667 471.918 1021 469.204
      C1035.333 466.490 1049.667 464.014 1064 461.728
