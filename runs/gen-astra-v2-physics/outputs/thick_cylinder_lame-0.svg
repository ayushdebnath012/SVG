<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800">
  <defs>
    <pattern id="wallHatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eef2f5"/>
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" fill="none" stroke="#c4cdd5" stroke-width="1"/>
    </pattern>
    <marker id="dimensionArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="pressureArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1240" height="800" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="45" y="44" fill="#142536" font-size="26" font-weight="bold">Thick-walled cylinder — Lamé stress distributions</text>
    <text x="45" y="75" fill="#475569" font-size="16">Inner radius 50 mm · Outer radius 100 mm · Internal pressure 50 MPa · External pressure 0 MPa</text>
    <line x1="45" y1="94" x2="1195" y2="94" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="605" y1="115" x2="605" y2="695" stroke="#dbe2e8" stroke-width="1"/>

    <text x="45" y="131" fill="#142536" font-size="19" font-weight="bold">Cross-section</text>
    <text x="45" y="155" fill="#64748b" font-size="14">Concentric bore and wall; radii drawn to scale</text>

    <circle cx="290" cy="355" r="180" fill="url(#wallHatch)" stroke="#243746" stroke-width="2.5"/>
    <circle cx="290" cy="355" r="90" fill="#ffffff" stroke="#243746" stroke-width="2.5"/>

    <line x1="90" y1="355" x2="490" y2="355" stroke="#94a3b8" stroke-width="1" stroke-dasharray="12 5 2 5"/>
    <line x1="290" y1="155" x2="290" y2="555" stroke="#94a3b8" stroke-width="1" stroke-dasharray="12 5 2 5"/>

    <g fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#pressureArrow)">
