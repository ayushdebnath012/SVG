    <g fill="#b42335" stroke="#ffffff" stroke-width="1.5">
      <circle cx="720" cy="200" r="5"/>
      <circle cx="1150" cy="350" r="5"/>
    </g>
    <g fill="#1769aa" stroke="#ffffff" stroke-width="1.5">
      <circle cx="720" cy="600" r="5"/>
      <circle cx="1150" cy="450" r="5"/>
    </g>

    <g font-size="16" font-weight="bold">
      <text x="737" y="190" fill="#b42335">σθ(rᵢ) = +83.33 MPa</text>
      <text x="1144" y="330" fill="#b42335" text-anchor="end">σθ(rₒ) = +33.33 MPa</text>
      <text x="757" y="590" fill="#1769aa">σr(rᵢ) = −50.00 MPa</text>
      <text x="1144" y="430" fill="#1769aa" text-anchor="end">σr(rₒ) = 0.00 MPa</text>
    </g>
    <text x="851" y="254" fill="#b42335" font-size="15">Tangential / hoop, σθ</text>
    <text x="922" y="541" fill="#1769aa" font-size="15">Radial, σr</text>

    <rect x="45" y="709" width="1150" height="69" rx="4" fill="#f1f5f9" stroke="#dbe2e8" stroke-width="1"/>
    <text x="62" y="737" fill="#243746" font-size="16" font-weight="bold">Lamé equations</text>
    <text x="240" y="737" fill="#243746" font-size="16">σr = A − B/r²</text>
    <text x="452" y="737" fill="#243746" font-size="16">σθ = A + B/r²</text>
    <text x="672" y="737" fill="#243746" font-size="15">A = 16.6667 MPa;  B = 166,666.6667 MPa·mm²</text>
    <text x="62" y="763" fill="#475569" font-size="14">For pₒ = 0:  A = pᵢrᵢ²/(rₒ² − rᵢ²),  B = pᵢrᵢ²rₒ²/(rₒ² − rᵢ²).  Use r in mm; plotted domain: 50 ≤ r ≤ 100 mm.</text>
  </g>
</svg>