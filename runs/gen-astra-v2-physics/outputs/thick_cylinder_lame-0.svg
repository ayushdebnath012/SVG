    <line x1="720" y1="150" x2="720" y2="620" stroke="#475569" stroke-width="1.5"/>
    <line x1="720" y1="620" x2="1150" y2="620" stroke="#475569" stroke-width="1.5"/>
    <line x1="720" y1="450" x2="1150" y2="450" stroke="#94a3b8" stroke-width="1.5"/>

    <g fill="#475569" font-size="14" text-anchor="end">
      <text x="707" y="155">100</text>
      <text x="707" y="230">75</text>
      <text x="707" y="305">50</text>
      <text x="707" y="380">25</text>
      <text x="707" y="455">0</text>
      <text x="707" y="530">−25</text>
      <text x="707" y="605">−50</text>
    </g>

    <g stroke="#475569" stroke-width="1.2">
      <line x1="720" y1="620" x2="720" y2="627"/>
      <line x1="806" y1="620" x2="806" y2="627"/>
      <line x1="892" y1="620" x2="892" y2="627"/>
      <line x1="978" y1="620" x2="978" y2="627"/>
      <line x1="1064" y1="620" x2="1064" y2="627"/>
      <line x1="1150" y1="620" x2="1150" y2="627"/>
    </g>
    <g fill="#475569" font-size="14" text-anchor="middle">
      <text x="720" y="649">50</text>
      <text x="806" y="649">60</text>
      <text x="892" y="649">70</text>
      <text x="978" y="649">80</text>
      <text x="1064" y="649">90</text>
      <text x="1150" y="649">100</text>
      <text x="935" y="677" font-size="16">Radius, r (mm)</text>
      <text x="720" y="678" font-size="12">Inner surface</text>
      <text x="1150" y="678" font-size="12">Outer surface</text>
    </g>

    <path d="M720 200
      C734.333 213.333 748.667 224.693 763 234.711
      C777.333 244.729 791.667 253.395 806 261.111
      C820.333 268.827 834.667 275.588 849 281.657
      C863.333 287.726 877.667 293.100 892 297.959
