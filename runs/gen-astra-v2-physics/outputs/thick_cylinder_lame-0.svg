    </g>

    <line x1="290" y1="355" x2="417.28" y2="227.72" stroke="#334155" stroke-width="1.6" marker-end="url(#dimensionArrow)"/>
    <text x="348" y="276" fill="#243746" font-size="16" transform="rotate(-45 348 276)">rₒ = 100 mm</text>

    <line x1="290" y1="355" x2="212.06" y2="310" stroke="#334155" stroke-width="1.6" marker-end="url(#dimensionArrow)"/>
    <path d="M212 310 L187 285 L109 285" fill="none" stroke="#334155" stroke-width="1.2"/>
    <text x="109" y="276" fill="#243746" font-size="16">rᵢ = 50 mm</text>
    <circle cx="290" cy="355" r="3" fill="#243746"/>

    <rect x="239" y="366" width="102" height="25" fill="#ffffff"/>
    <text x="290" y="384" fill="#b45309" font-size="15" text-anchor="middle" font-weight="bold">pᵢ = 50 MPa</text>

    <path d="M452 433 L493 453 L551 453" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="490" y="443" fill="#475569" font-size="15">Wall</text>
    <path d="M444 262 L488 228 L553 228" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="476" y="216" fill="#475569" font-size="15">pₒ = 0 MPa</text>

    <text x="290" y="584" fill="#243746" font-size="17" text-anchor="middle">Wall thickness: t = rₒ − rᵢ = 50 mm</text>
    <text x="290" y="612" fill="#b45309" font-size="14" text-anchor="middle">Pressure arrows act outward on the bore surface.</text>
    <text x="290" y="640" fill="#64748b" font-size="14" text-anchor="middle">Stress sign convention: tension +, compression −</text>

    <text x="680" y="131" fill="#142536" font-size="19" font-weight="bold">Stress through the wall</text>
    <text x="645" y="163" fill="#475569" font-size="14">MPa</text>

    <g fill="none" stroke="#e2e8f0" stroke-width="1">
      <line x1="720" y1="150" x2="1150" y2="150"/>
