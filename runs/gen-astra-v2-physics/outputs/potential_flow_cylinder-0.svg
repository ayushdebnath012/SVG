<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760">
  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#19758b"/>
    </marker>
    <marker id="dimensionArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#48545e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>

  <text x="55" y="49" font-family="sans-serif" font-size="27" font-weight="bold" fill="#182b38">Potential flow past a circular cylinder</text>
  <text x="55" y="79" font-family="sans-serif" font-size="16" fill="#48545e">Uniform stream · incompressible, inviscid, irrotational · no circulation</text>

  <line x1="90" y1="124" x2="240" y2="124" stroke="#19758b" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <text x="90" y="111" font-family="sans-serif" font-size="18" font-weight="bold" fill="#182b38">U = 1 m/s</text>
  <text x="990" y="124" text-anchor="end" font-family="sans-serif" font-size="15" fill="#48545e">Cylinder radius a = 0.5 m</text>

  <!-- Four positive-streamfunction streamlines, flowing left to right. -->
  <path d="M 110 354.83
           C 146.67 354.45 183.33 353.86 220 352.93
           C 256.67 352.00 293.33 350.85 330 346.54
           C 348.33 344.38 366.67 340.50 385 333.99
           C 403.33 327.48 421.67 317.58 440 304.49
           C 458.33 291.40 476.67 280.68 495 273.62
           C 513.33 266.56 531.67 262.27 550 262.27
           C 568.33 262.27 586.67 266.56 605 273.62
           C 623.33 280.68 641.67 291.40 660 304.49
           C 678.33 317.58 696.67 327.48 715 333.99
           C 733.33 340.50 751.67 344.38 770 346.54
           C 806.67 350.85 843.33 352.00 880 352.93
           C 916.67 353.86 953.33 354.45 990 354.83"
        fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>

  <path d="M 110 319.72
           C 146.67 319.00 183.33 317.95 220 316.19
           C 256.67 314.43 293.33 312.00 330 305.62
           C 366.67 299.24 403.33 281.26 440 266.05
           C 458.33 258.44 476.67 252.96 495 248.28
           C 513.33 243.60 531.67 242.15 550 242.15
           C 568.33 242.15 586.67 243.60 605 248.28
           C 623.33 252.96 641.67 258.44 660 266.05
           C 696.67 281.26 733.33 299.24 770 305.62
           C 806.67 312.00 843.33 314.43 880 316.19
           C 916.67 317.95 953.33 319.00 990 319.72"
        fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>

  <path d="M 110 273.18
           C 146.67 272.09 183.33 270.46 220 267.97
           C 256.67 265.48 293.33 260.62 330 254.17
           C 366.67 247.72 403.33 236.43 440 226.90
           C 476.67 217.37 513.33 212.02 550 212.02
           C 586.67 212.02 623.33 217.37 660 226.90
           C 696.67 236.43 733.33 247.72 770 254.17
           C 806.67 260.62 843.33 265.48 880 267.97
           C 916.67 270.46 953.33 272.09 990 273.18"
        fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>

  <path d="M 110 215.58
           C 146.67 214.22 183.33 211.88 220 209.57
           C 256.67 207.26 293.33 203.62 330 198.52
           C 366.67 193.42 403.33 185.88 440 179.83
           C 476.67 173.78 513.33 169.65 550 169.65
           C 586.67 169.65 623.33 173.78 660 179.83
           C 696.67 185.88 733.33 193.42 770 198.52
           C 806.67 203.62 843.33 207.26 880 209.57
           C 916.67 211.88 953.33 214.22 990 215.58"
        fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>

  <!-- Reflection supplies four negative-streamfunction streamlines. -->
  <g transform="translate(0 780) scale(1 -1)">
    <path d="M 110 354.83
             C 146.67 354.45 183.33 353.86 220 352.93
             C 256.67 352.00 293.33 350.85 330 346.54
             C 348.33 344.38 366.67 340.50 385 333.99
             C 403.33 327.48 421.67 317.58 440 304.49
             C 458.33 291.40 476.67 280.68 495 273.62
             C 513.33 266.56 531.67 262.27 550 262.27
             C 568.33 262.27 586.67 266.56 605 273.62
             C 623.33 280.68 641.67 291.40 660 304.49
             C 678.33 317.58 696.67 327.48 715 333.99
             C 733.33 340.50 751.67 344.38 770 346.54
             C 806.67 350.85 843.33 352.00 880 352.93
             C 916.67 353.86 953.33 354.45 990 354.83"
          fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>
    <path d="M 110 319.72
             C 146.67 319.00 183.33 317.95 220 316.19
             C 256.67 314.43 293.33 312.00 330 305.62
             C 366.67 299.24 403.33 281.26 440 266.05
             C 458.33 258.44 476.67 252.96 495 248.28
             C 513.33 243.60 531.67 242.15 550 242.15
             C 568.33 242.15 586.67 243.60 605 248.28
             C 623.33 252.96 641.67 258.44 660 266.05
             C 696.67 281.26 733.33 299.24 770 305.62
             C 806.67 312.00 843.33 314.43 880 316.19
             C 916.67 317.95 953.33 319.00 990 319.72"
          fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>
    <path d="M 110 273.18
             C 146.67 272.09 183.33 270.46 220 267.97
             C 256.67 265.48 293.33 260.62 330 254.17
             C 366.67 247.72 403.33 236.43 440 226.90
             C 476.67 217.37 513.33 212.02 550 212.02
             C 586.67 212.02 623.33 217.37 660 226.90
             C 696.67 236.43 733.33 247.72 770 254.17
             C 806.67 260.62 843.33 265.48 880 267.97
             C 916.67 270.46 953.33 272.09 990 273.18"
          fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>
    <path d="M 110 215.58
             C 146.67 214.22 183.33 211.88 220 209.57
             C 256.67 207.26 293.33 203.62 330 198.52
             C 366.67 193.42 403.33 185.88 440 179.83
             C 476.67 173.78 513.33 169.65 550 169.65
             C 586.67 169.65 623.33 173.78 660 179.83
             C 696.67 185.88 733.33 193.42 770 198.52
             C 806.67 203.62 843.33 207.26 880 209.57
             C 916.67 211.88 953.33 214.22 990 215.58"
          fill="none" stroke="#19758b" stroke-width="1.8" marker-end="url(#flowArrow)"/>
  </g>

  <!-- The zero-streamfunction separatrix meets both stagnation points
       and follows both semicircles of the impermeable surface. -->
  <line x1="110" y1="390" x2="440" y2="390" stroke="#19758b" stroke-width="2.5"/>
  <line x1="660" y1="390" x2="990" y2="390" stroke="#19758b" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <line x1="200" y1="390" x2="255" y2="390" stroke="#19758b" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <line x1="845" y1="390" x2="900" y2="390" stroke="#19758b" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <circle cx="550" cy="390" r="110" fill="#f4f7f8" stroke="#19758b" stroke-width="2.5"/>
  <path d="M 595 289.63 A 110 110 0 0 1 627.78 312.22" fill="none" stroke="#19758b" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <path d="M 595 490.37 A 110 110 0 0 0 627.78 467.78" fill="none" stroke="#19758b" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <text x="160" y="377" font-family="sans-serif" font-size="14" fill="#19758b">Dividing streamline: ψ = 0</text>
  <text x="815" y="377" font-family="sans-serif" font-size="14" fill="#19758b">ψ = 0</text>

  <text x="550" y="362" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#182b38">Circular cylinder</text>
  <text x="550" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#48545e">no flow inside</text>
  <circle cx="550" cy="390" r="2.5" fill="#48545e"/>
  <line x1="553" y1="390" x2="654" y2="390" stroke="#48545e" stroke-width="1.2" marker-end="url(#dimensionArrow)"/>
  <text x="585" y="413" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#182b38">a = 0.5 m</text>

  <!-- Maximum-speed / minimum-pressure locations. -->
  <circle cx="550" cy="280" r="4.5" fill="#182b38" stroke="#ffffff" stroke-width="1"/>
  <line x1="550" y1="285" x2="550" y2="296" stroke="#48545e" stroke-width="1"/>
  <text x="550" y="314" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#182b38">Vmax = 2 m/s</text>
  <text x="550" y="333" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#182b38">Cp,min = −3</text>

  <circle cx="550" cy="500" r="4.5" fill="#182b38" stroke="#ffffff" stroke-width="1"/>
  <line x1="550" y1="484" x2="550" y2="495" stroke="#48545e" stroke-width="1"/>
  <text x="550" y="458" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#182b38">Vmax = 2 m/s</text>
  <text x="550" y="477" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#182b38">Cp,min = −3</text>

  <!-- Surface stagnation points. -->
  <path d="M 440 390 L 420 416 L 400 416" fill="none" stroke="#ad4437" stroke-width="1.2"/>
  <path d="M 660 390 L 680 416 L 700 416" fill="none" stroke="#ad4437" stroke-width="1.2"/>
  <circle cx="440" cy="390" r="5" fill="#ad4437" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="660" cy="390" r="5" fill="#ad4437" stroke="#ffffff" stroke-width="1.2"/>

  <text x="394" y="418" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ad4437">Stagnation: θ = 180°</text>
  <text x="394" y="438" text-anchor="end" font-family="sans-serif" font-size="14" fill="#182b38">V = 0 m/s; Cp = 1</text>
  <text x="706" y="418" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ad4437">Stagnation: θ = 0°</text>
  <text x="706" y="438" font-family="sans-serif" font-size="14" fill="#182b38">V = 0 m/s; Cp = 1</text>

  <line x1="55" y1="650" x2="1045" y2="650" stroke="#cbd4da" stroke-width="1"/>
  <text x="55" y="680" font-family="sans-serif" font-size="16" font-weight="bold" fill="#182b38">Surface extrema: top and bottom, θ = 90° and 270°</text>
  <text x="55" y="705" font-family="sans-serif" font-size="15" fill="#48545e">Vsurface = 2U |sin θ|;   Cp = 1 − (V/U)² = 1 − 4 sin²θ.</text>
  <text x="55" y="731" font-family="sans-serif" font-size="14" fill="#48545e">θ measured counterclockwise from the downstream radius. Streamlines: ψ = U y (1 − a²/r²) = constant.</text>
</svg>