<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 910">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#263746" stroke="#263746"/>
    </marker>
    <marker id="convection" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#247a9b" stroke="#247a9b"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eef1f3" stroke="none"/>
      <path d="M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8" fill="none" stroke="#a4adb5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1120" height="910" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263746" stroke="none">
    <text x="40" y="43" font-size="25" font-weight="bold">ALUMINIUM PIN FIN</text>
    <text x="40" y="70" font-size="15">Longitudinal section • steady one-dimensional conduction • adiabatic tip</text>
    <text x="1080" y="43" font-size="15" text-anchor="end">k = 200 W/(m·K)</text>
  </g>
  <line x1="40" y1="84" x2="1080" y2="84" stroke="#bcc5cc" stroke-width="1"/>

  <!-- Length dimension -->
  <g fill="none" stroke="#263746" stroke-width="1">
    <line x1="230" y1="135" x2="230" y2="206"/>
    <line x1="910" y1="135" x2="910" y2="206"/>
    <line x1="230" y1="145" x2="910" y2="145" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="570" y="132" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#263746" stroke="none">L = 50 mm</text>
  <text x="570" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#247a9b" stroke="none">Ambient: T∞ = 20 °C   |   h = 50 W/(m²·K)</text>

  <!-- Isothermal support and axial section -->
  <rect x="174" y="184" width="56" height="141" fill="url(#hatch)" stroke="#263746" stroke-width="1.5"/>
  <rect x="230" y="215" width="680" height="68" fill="#dce3e8" stroke="#263746" stroke-width="2"/>
  <line x1="230" y1="184" x2="230" y2="325" stroke="#263746" stroke-width="3"/>
  <line x1="214" y1="249" x2="928" y2="249" stroke="#87939e" stroke-width="1" stroke-dasharray="12 4 2 4"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263746" stroke="none">
    <text x="42" y="223" font-size="16" font-weight="bold">Base</text>
    <text x="42" y="247" font-size="16">Tb = 100 °C</text>
    <text x="570" y="239" font-size="16" text-anchor="middle">Aluminium • circular pin</text>
    <text x="230" y="355" font-size="14" text-anchor="middle">x = 0</text>
  </g>
  <line x1="137" y1="242" x2="174" y2="242" stroke="#263746" stroke-width="1"/>

  <!-- Convection from the lateral surface only -->
  <g fill="none" stroke="#247a9b" stroke-width="2" marker-end="url(#convection)">
    <path d="M 340 207 L 340 164"/>
    <path d="M 470 207 L 470 164"/>
    <path d="M 600 207 L 600 164"/>
    <path d="M 730 207 L 730 164"/>
    <path d="M 860 207 L 860 164"/>
    <path d="M 340 291 L 340 334"/>
    <path d="M 470 291 L 470 334"/>
    <path d="M 600 291 L 600 334"/>
    <path d="M 730 291 L 730 334"/>
    <path d="M 860 291 L 860 334"/>
  </g>
  <text x="570" y="357" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#247a9b" stroke="none">Convection to ambient along the lateral surface</text>

  <!-- Diameter and insulated-tip callout -->
  <g fill="none" stroke="#263746" stroke-width="1">
    <line x1="919" y1="215" x2="978" y2="215"/>
    <line x1="919" y1="283" x2="978" y2="283"/>
    <line x1="964" y1="215" x2="964" y2="283" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 910 266 L 931 307 L 1028 307"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263746" stroke="none">
    <text x="987" y="254" font-size="16">⌀ 5 mm</text>
    <text x="943" y="329" font-size="15" font-weight="bold">Adiabatic tip</text>
    <text x="943" y="351" font-size="14">dT/dx at L = 0</text>
  </g>

  <!-- Aligned temperature plot -->
  <text x="40" y="403" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#263746" stroke="none">TEMPERATURE DISTRIBUTION</text>

  <g fill="none" stroke="#dce2e7" stroke-width="1">
    <line x1="230" y1="445" x2="910" y2="445"/>
    <line x1="230" y1="505" x2="910" y2="505"/>
    <line x1="230" y1="565" x2="910" y2="565"/>
    <line x1="230" y1="625" x2="910" y2="625"/>
    <line x1="366" y1="445" x2="366" y2="685"/>
    <line x1="502" y1="445" x2="502" y2="685"/>
    <line x1="638" y1="445" x2="638" y2="685"/>
    <line x1="774" y1="445" x2="774" y2="685"/>
  </g>
  <g fill="none" stroke="#a6b1ba" stroke-width="1" stroke-dasharray="5 5">
    <line x1="230" y1="368" x2="230" y2="425"/>
    <line x1="910" y1="368" x2="910" y2="685"/>
  </g>
  <line x1="230" y1="685" x2="910" y2="685" stroke="#247a9b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <g fill="none" stroke="#263746" stroke-width="1.4">
    <line x1="230" y1="699" x2="230" y2="426" marker-end="url(#arrow)"/>
    <line x1="230" y1="697" x2="932" y2="697" marker-end="url(#arrow)"/>
    <path d="M 224 445 H 230 M 224 505 H 230 M 224 565 H 230 M 224 625 H 230 M 224 685 H 230"/>
    <path d="M 230 697 V 703 M 366 697 V 703 M 502 697 V 703 M 638 697 V 703 M 774 697 V 703 M 910 697 V 703"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#263746" stroke="none">
    <text x="179" y="431" font-size="16">T (°C)</text>
    <text x="213" y="450" text-anchor="end">100</text>
    <text x="213" y="510" text-anchor="end">80</text>
    <text x="213" y="570" text-anchor="end">60</text>
    <text x="213" y="630" text-anchor="end">40</text>
    <text x="213" y="690" text-anchor="end">20</text>
    <text x="230" y="723" text-anchor="middle">0</text>
    <text x="366" y="723" text-anchor="middle">10</text>
    <text x="502" y="723" text-anchor="middle">20</text>
    <text x="638" y="723" text-anchor="middle">30</text>
    <text x="774" y="723" text-anchor="middle">40</text>
    <text x="910" y="723" text-anchor="middle">50</text>
    <text x="950" y="703" font-size="16">x (mm)</text>
    <text x="929" y="679" fill="#247a9b">T∞ = 20 °C</text>
  </g>

  <!-- Fin-equation curve: T = 20 + 80 cosh[m(L-x)] / cosh(mL) -->
  <path d="M 230 445
           C 343.333 462.221, 456.667 474.491, 570 482.590
           C 683.333 490.689, 796.667 494.613, 910 494.613"
        fill="none" stroke="#c14d24" stroke-width="3"/>
  <circle cx="230" cy="445" r="4" fill="#c14d24" stroke="#c14d24"/>
  <circle cx="910" cy="494.613" r="4" fill="#c14d24" stroke="#c14d24"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#c14d24" stroke="none">
    <text x="250" y="433" font-size="15">100 °C</text>
    <text x="932" y="482" font-size="16" font-weight="bold">83.46 °C</text>
    <text x="932" y="505" font-size="14">Tip temperature</text>
    <text x="590" y="548" font-size="16">T(x) — adiabatic-tip solution</text>
  </g>

  <text x="230" y="760" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#263746" stroke="none">T(x) = T∞ + (Tb − T∞) cosh[m(L − x)] / cosh(mL)</text>
  <text x="230" y="786" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#596975" stroke="none">Ac = πd²/4;  P = πd;  x and L in metres in the equation;  mL = 0.7071</text>

  <!-- Calculated engineering quantities -->
  <g fill="#f4f6f8" stroke="#ccd4db" stroke-width="1">
    <rect x="40" y="814" width="247" height="72"/>
    <rect x="304" y="814" width="247" height="72"/>
    <rect x="568" y="814" width="247" height="72"/>
    <rect x="832" y="814" width="248" height="72"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263746" stroke="none" text-anchor="middle">
    <text x="163.5" y="839" font-size="14">m = √[hP/(kAc)]</text>
    <text x="163.5" y="871" font-size="23" font-weight="bold">14.14 1/m</text>
    <text x="427.5" y="839" font-size="14">Tip temperature, T(L)</text>
    <text x="427.5" y="871" font-size="23" font-weight="bold">83.46 °C</text>
    <text x="691.5" y="839" font-size="14">ηf = tanh(mL)/(mL)</text>
    <text x="691.5" y="871" font-size="23" font-weight="bold">86.11%</text>
    <text x="956" y="839" font-size="14">Q = ηf hPL(Tb − T∞)</text>
    <text x="956" y="871" font-size="23" font-weight="bold">2.705 W</text>
  </g>
</svg>