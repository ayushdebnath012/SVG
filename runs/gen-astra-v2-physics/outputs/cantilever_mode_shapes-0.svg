<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#edf0f3"/>
      <path d="M-2 2 L2-2 M0 8 L8 0 M6 10 L10 6" fill="none" stroke="#87939e" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#465563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1030" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172b3a">
    <text x="50" y="48" font-size="27" font-weight="700">UNIFORM STEEL CANTILEVER</text>
    <text x="50" y="77" font-size="18">First three bending modes · Euler–Bernoulli beam</text>
    <text x="50" y="106" font-size="16">L = 1 m   |   Section: 10 × 10 mm   |   E = 200 GPa   |   ρ = 7850 kg/m³</text>
    <text x="1150" y="48" text-anchor="end" font-size="14" fill="#536575">CLAMPED–FREE</text>
    <text x="1150" y="77" text-anchor="end" font-size="14" fill="#536575">Tip-normalised: φₙ(1) = +1</text>
    <text x="1150" y="106" text-anchor="end" font-size="14" fill="#536575">Equal amplitude scale · displacement exaggerated</text>
  </g>

  <line x1="50" y1="125" x2="1150" y2="125" stroke="#a9b4bd" stroke-width="1"/>

  <!-- Common longitudinal alignment grid -->
  <g fill="none" stroke="#e1e6ea" stroke-width="1" stroke-dasharray="3 7">
    <line x1="210" y1="180" x2="210" y2="835"/>
    <line x1="420" y1="180" x2="420" y2="835"/>
    <line x1="630" y1="180" x2="630" y2="835"/>
    <line x1="840" y1="180" x2="840" y2="835"/>
    <line x1="1050" y1="180" x2="1050" y2="835"/>
  </g>

  <!-- Mode 1 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="163" fill="#172b3a" font-size="20" font-weight="700">MODE 1</text>
    <text x="260" y="163" fill="#172b3a" font-size="18">β₁L = 1.875104</text>
    <text x="630" y="163" fill="#172b3a" font-size="18" font-weight="700">f₁ = 8.154 Hz</text>

    <line x1="210" y1="275" x2="1050" y2="275" stroke="#8b99a5" stroke-width="1.2" stroke-dasharray="7 5"/>
    <rect x="185" y="237" width="25" height="76" fill="url(#hatch)" stroke="#465563" stroke-width="1"/>
    <line x1="210" y1="237" x2="210" y2="313" stroke="#263c4d" stroke-width="3"/>

    <path d="M210 275
      C245 275 280 274.286 315 272.980
      C350 271.675 385 269.778 420 267.412
      C455 265.045 490 262.210 525 259.023
      C560 255.835 595 252.297 630 248.517
      C665 244.737 700 240.716 735 236.550
      C770 232.383 805 228.073 840 223.695
      C875 219.317 910 214.872 945 210.411
      C980 205.949 1015 201.474 1050 197"
      fill="none" stroke="#126a94" stroke-width="3" stroke-linecap="round"/>

    <circle cx="210" cy="275" r="4" fill="#263c4d" stroke="#263c4d"/>
    <circle cx="1050" cy="197" r="4" fill="#126a94" stroke="#126a94"/>
    <text x="1070" y="202" fill="#126a94" font-size="14">φ = +1</text>
    <text x="1070" y="280" fill="#536575" font-size="14">0</text>
    <text x="630" y="342" text-anchor="middle" fill="#536575" font-size="15">No internal displacement nodes</text>
  </g>

  <line x1="50" y1="370" x2="1150" y2="370" stroke="#d9e0e5" stroke-width="1"/>

  <!-- Mode 2 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="408" fill="#172b3a" font-size="20" font-weight="700">MODE 2</text>
    <text x="260" y="408" fill="#172b3a" font-size="18">β₂L = 4.694091</text>
    <text x="630" y="408" fill="#172b3a" font-size="18" font-weight="700">f₂ = 51.099 Hz</text>

    <line x1="210" y1="520" x2="1050" y2="520" stroke="#8b99a5" stroke-width="1.2" stroke-dasharray="7 5"/>
    <rect x="185" y="482" width="25" height="76" fill="url(#hatch)" stroke="#465563" stroke-width="1"/>
    <line x1="210" y1="482" x2="210" y2="558" stroke="#263c4d" stroke-width="3"/>

    <path d="M210 520
      C245 520 280 524.472 315 530.757
      C350 537.042 385 545.115 420 552.546
      C455 559.977 490 566.737 525 571.031
      C560 575.326 595 577.139 630 575.666
      C665 574.193 700 569.442 735 561.680
      C770 553.919 805 543.180 840 530.532
      C875 517.884 910 503.377 945 488.277
      C980 473.177 1015 457.538 1050 442"
      fill="none" stroke="#126a94" stroke-width="3" stroke-linecap="round"/>

    <circle cx="210" cy="520" r="4" fill="#263c4d" stroke="#263c4d"/>
    <circle cx="1050" cy="442" r="4" fill="#126a94" stroke="#126a94"/>
    <text x="1070" y="447" fill="#126a94" font-size="14">φ = +1</text>
    <text x="1070" y="525" fill="#536575" font-size="14">0</text>

    <line x1="868.093" y1="527" x2="868.093" y2="573" stroke="#b15d23" stroke-width="1.2"/>
    <circle cx="868.093" cy="520" r="5" fill="#ffffff" stroke="#b15d23" stroke-width="2"/>
    <text x="868.093" y="593" text-anchor="middle" fill="#91491b" font-size="15">Node: x/L = 0.78344</text>
  </g>

  <line x1="50" y1="615" x2="1150" y2="615" stroke="#d9e0e5" stroke-width="1"/>

  <!-- Mode 3 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="653" fill="#172b3a" font-size="20" font-weight="700">MODE 3</text>
    <text x="260" y="653" fill="#172b3a" font-size="18">β₃L = 7.854757</text>
    <text x="630" y="653" fill="#172b3a" font-size="18" font-weight="700">f₃ = 143.078 Hz</text>

    <line x1="210" y1="765" x2="1050" y2="765" stroke="#8b99a5" stroke-width="1.2" stroke-dasharray="7 5"/>
    <rect x="185" y="727" width="25" height="76" fill="url(#hatch)" stroke="#465563" stroke-width="1"/>
    <line x1="210" y1="727" x2="210" y2="803" stroke="#263c4d" stroke-width="3"/>

    <path d="M210 765
      C245 765 280 752.547 315 739.615
      C350 726.683 385 713.642 420 708.489
      C455 703.336 490 706.218 525 716.819
      C560 727.419 595 745.421 630 763.464
      C665 781.508 700 799.061 735 808.508
      C770 817.954 805 819.018 840 810.355
      C875 801.692 910 783.562 945 761.098
      C980 738.634 1015 712.508 1050 687"
      fill="none" stroke="#126a94" stroke-width="3" stroke-linecap="round"/>

    <circle cx="210" cy="765" r="4" fill="#263c4d" stroke="#263c4d"/>
    <circle cx="1050" cy="687" r="4" fill="#126a94" stroke="#126a94"/>
    <text x="1070" y="692" fill="#126a94" font-size="14">φ = +1</text>
    <text x="1070" y="770" fill="#536575" font-size="14">0</text>

    <line x1="632.980" y1="772" x2="632.980" y2="826" stroke="#b15d23" stroke-width="1.2"/>
    <circle cx="632.980" cy="765" r="5" fill="#ffffff" stroke="#b15d23" stroke-width="2"/>
    <text x="632.980" y="847" text-anchor="middle" fill="#91491b" font-size="15">Node: x/L = 0.50355</text>

    <line x1="938.850" y1="772" x2="938.850" y2="826" stroke="#b15d23" stroke-width="1.2"/>
    <circle cx="938.850" cy="765" r="5" fill="#ffffff" stroke="#b15d23" stroke-width="2"/>
    <text x="938.850" y="847" text-anchor="middle" fill="#91491b" font-size="15">Node: x/L = 0.86768</text>
  </g>

  <!-- Shared beam dimension -->
  <g stroke="#465563" fill="none" stroke-width="1.1">
    <line x1="210" y1="835" x2="210" y2="905"/>
    <line x1="1050" y1="835" x2="1050" y2="905"/>
    <line x1="212" y1="895" x2="1048" y2="895" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b3a">
    <text x="630" y="883" text-anchor="middle" font-size="16">L = 1 000 mm</text>
    <text x="210" y="922" text-anchor="middle" font-size="14">Clamp · x/L = 0</text>
    <text x="1050" y="922" text-anchor="middle" font-size="14">Free tip · x/L = 1</text>
  </g>

  <line x1="50" y1="943" x2="1150" y2="943" stroke="#a9b4bd" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#536575" font-size="14">
    <text x="50" y="969">A = 1.000 × 10⁻⁴ m²   ·   I = 8.333 × 10⁻¹⁰ m⁴   ·   fₙ = (βₙL)² √[EI/(ρA)] / (2πL²)</text>
    <text x="50" y="997">Eigenvalues satisfy cosh(βₙL) cos(βₙL) = −1. Clamp: φₙ(0) = φ′ₙ(0) = 0.</text>
    <circle cx="925" cy="968" r="5" fill="#ffffff" stroke="#b15d23" stroke-width="2"/>
    <text x="940" y="973" fill="#91491b">Internal node: φₙ = 0</text>
    <text x="920" y="997">Node positions measured from clamp.</text>
  </g>
</svg>