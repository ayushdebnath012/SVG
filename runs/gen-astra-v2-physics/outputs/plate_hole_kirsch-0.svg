<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790">
  <defs>
    <marker id="loadArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#245c91"/>
    </marker>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#586675"/>
    </marker>
    <marker id="dimArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#354454"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="790" fill="#ffffff"/>
  <text x="48" y="49" font-family="sans-serif" font-size="27" font-weight="700" fill="#182b3b">Circular hole in a thin plate — Kirsch stress field</text>
  <text x="48" y="80" font-family="sans-serif" font-size="16" fill="#526170">Hole radius a = 10 mm  •  Remote uniaxial tension σ∞ = 100 MPa along x  •  Tensile stress positive</text>
  <line x1="48" y1="103" x2="1232" y2="103" stroke="#cbd3db" stroke-width="1"/>

  <text x="48" y="140" font-family="sans-serif" font-size="19" font-weight="700" fill="#182b3b">Loading and hole-edge stresses</text>
  <text x="708" y="140" font-family="sans-serif" font-size="19" font-weight="700" fill="#182b3b">Tangential stress on the positive y-axis</text>
  <text x="708" y="167" font-family="sans-serif" font-size="15" fill="#526170">θ = π/2; radial distance r measured from the hole center</text>

  <!-- Plate and traction-free circular hole -->
  <rect x="110" y="210" width="410" height="360" fill="#edf2f6" stroke="#354454" stroke-width="2"/>
  <circle cx="315" cy="390" r="38" fill="#ffffff" stroke="#182b3b" stroke-width="2.5"/>

  <!-- Remote tensile loading -->
  <text x="88" y="191" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#245c91">100 MPa</text>
  <text x="551" y="191" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#245c91">100 MPa</text>
  <line x1="110" y1="245" x2="48" y2="245" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="110" y1="310" x2="48" y2="310" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="110" y1="375" x2="48" y2="375" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="110" y1="440" x2="48" y2="440" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="110" y1="535" x2="48" y2="535" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="520" y1="245" x2="582" y2="245" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="520" y1="310" x2="582" y2="310" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="520" y1="375" x2="582" y2="375" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="520" y1="440" x2="582" y2="440" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>
  <line x1="520" y1="535" x2="582" y2="535" stroke="#245c91" stroke-width="2.2" marker-end="url(#loadArrow)"/>

  <!-- Coordinate axes and sampled radial line -->
  <line x1="88" y1="390" x2="609" y2="390" stroke="#8794a1" stroke-width="1" stroke-dasharray="9 4 2 4" marker-end="url(#axisArrow)"/>
  <line x1="315" y1="592" x2="315" y2="182" stroke="#8794a1" stroke-width="1" stroke-dasharray="9 4 2 4" marker-end="url(#axisArrow)"/>
  <text x="607" y="412" font-family="sans-serif" font-size="17" font-style="italic" fill="#354454">x</text>
  <text x="326" y="191" font-family="sans-serif" font-size="17" font-style="italic" fill="#354454">y</text>
  <text x="295" y="409" font-family="sans-serif" font-size="13" fill="#354454">O</text>
  <line x1="315" y1="352" x2="315" y2="238" stroke="#087f8c" stroke-width="3"/>
  <line x1="308" y1="238" x2="322" y2="238" stroke="#087f8c" stroke-width="2"/>
  <line x1="308" y1="314" x2="322" y2="314" stroke="#087f8c" stroke-width="2"/>
  <text x="328" y="243" font-family="sans-serif" font-size="14" fill="#087f8c">r = 4a</text>
  <text x="328" y="319" font-family="sans-serif" font-size="14" fill="#087f8c">2a</text>
  <text x="139" y="239" font-family="sans-serif" font-size="14" fill="#526170">Thin plate</text>

  <!-- Hole-edge stress callouts -->
  <circle cx="315" cy="352" r="4" fill="#087f8c"/>
  <polyline points="315,352 258,334 147,334" fill="none" stroke="#087f8c" stroke-width="1.3"/>
  <text x="140" y="295" font-family="sans-serif" font-size="17" font-weight="700" fill="#087f8c">σθ = 300 MPa</text>
  <text x="140" y="318" font-family="sans-serif" font-size="14" fill="#087f8c">r = a, θ = π/2</text>

  <circle cx="353" cy="390" r="4" fill="#a44837"/>
  <polyline points="353,390 397,365 486,365" fill="none" stroke="#a44837" stroke-width="1.3"/>
  <text x="390" y="337" font-family="sans-serif" font-size="17" font-weight="700" fill="#a44837">−100 MPa</text>
  <text x="399" y="356" font-family="sans-serif" font-size="13" fill="#a44837">σθ(a, 0)</text>

  <!-- Radius dimension -->
  <line x1="315" y1="390" x2="341.87" y2="416.87" stroke="#354454" stroke-width="1.2" marker-end="url(#dimArrow)"/>
  <polyline points="341.87,416.87 380,473 455,473" fill="none" stroke="#354454" stroke-width="1"/>
  <text x="381" y="495" font-family="sans-serif" font-size="16" fill="#182b3b">a = 10 mm</text>
  <text x="139" y="551" font-family="sans-serif" font-size="13" fill="#526170">Traction-free hole boundary</text>
  <text x="110" y="615" font-family="sans-serif" font-size="14" fill="#526170">Schematic: plate dimensions ≫ a; finite-edge effects neglected.</text>

  <!-- Plot grid: x = 770 + 140(r/a - 1); y = 550 - σθ [MPa] -->
  <text x="710" y="207" font-family="sans-serif" font-size="16" fill="#182b3b">σθ (MPa)</text>
  <line x1="770" y1="250" x2="1190" y2="250" stroke="#dce2e7" stroke-width="1"/>
  <line x1="770" y1="350" x2="1190" y2="350" stroke="#dce2e7" stroke-width="1"/>
  <line x1="770" y1="450" x2="1190" y2="450" stroke="#dce2e7" stroke-width="1"/>
  <line x1="910" y1="220" x2="910" y2="550" stroke="#e4e9ed" stroke-width="1"/>
  <line x1="1050" y1="220" x2="1050" y2="550" stroke="#e4e9ed" stroke-width="1"/>
  <line x1="1190" y1="220" x2="1190" y2="550" stroke="#e4e9ed" stroke-width="1"/>

  <line x1="770" y1="550" x2="770" y2="218" stroke="#586675" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <line x1="770" y1="550" x2="1212" y2="550" stroke="#586675" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <line x1="764" y1="550" x2="770" y2="550" stroke="#586675" stroke-width="1"/>
  <line x1="764" y1="450" x2="770" y2="450" stroke="#586675" stroke-width="1"/>
  <line x1="764" y1="350" x2="770" y2="350" stroke="#586675" stroke-width="1"/>
  <line x1="764" y1="250" x2="770" y2="250" stroke="#586675" stroke-width="1"/>
  <text x="755" y="555" text-anchor="end" font-family="sans-serif" font-size="14" fill="#354454">0</text>
  <text x="755" y="455" text-anchor="end" font-family="sans-serif" font-size="14" fill="#354454">100</text>
  <text x="755" y="355" text-anchor="end" font-family="sans-serif" font-size="14" fill="#354454">200</text>
  <text x="755" y="255" text-anchor="end" font-family="sans-serif" font-size="14" fill="#354454">300</text>

  <line x1="770" y1="550" x2="770" y2="557" stroke="#586675" stroke-width="1"/>
  <line x1="910" y1="550" x2="910" y2="557" stroke="#586675" stroke-width="1"/>
  <line x1="1050" y1="550" x2="1050" y2="557" stroke="#586675" stroke-width="1"/>
  <line x1="1190" y1="550" x2="1190" y2="557" stroke="#586675" stroke-width="1"/>
  <text x="770" y="578" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#354454">1</text>
  <text x="910" y="578" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#354454">2</text>
  <text x="1050" y="578" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#354454">3</text>
  <text x="1190" y="578" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#354454">4</text>
  <text x="1208" y="578" font-family="sans-serif" font-size="15" fill="#182b3b">r/a</text>
  <text x="770" y="601" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#526170">hole edge</text>
  <text x="980" y="625" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526170">Center distance r: 10 mm → 40 mm</text>

  <!-- Far-field asymptote -->
  <line x1="770" y1="450" x2="1195" y2="450" stroke="#8d99a4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="950" y="485" font-family="sans-serif" font-size="14" fill="#687583">σθ → σ∞ = 100 MPa as r → ∞</text>

  <!-- Kirsch curve, sampled with short straight segments -->
  <polyline points="770,250 777,281.318 784,306.225 791,326.396 798,342.940 805,356.560 812,367.893 819,377.411 826,385.444 833,392.289 840,398.148 854,407.580 875,417.680 896,424.622 910,428.125 927.5,431.558 945,434.271 962.5,436.428 980,438.160 997.5,439.585 1015,440.767 1032.5,441.758 1050,442.593 1085,443.924 1120,444.919 1155,445.684 1190,446.289" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="770" cy="250" r="5" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="788" y="240" font-family="sans-serif" font-size="16" font-weight="700" fill="#087f8c">300 MPa</text>
  <text x="788" y="261" font-family="sans-serif" font-size="13" fill="#087f8c">r = a = 10 mm</text>

  <line x1="910" y1="428.125" x2="910" y2="550" stroke="#087f8c" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="910" cy="428.125" r="5" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/>
  <polyline points="910,428.125 940,392 1002,392" fill="none" stroke="#087f8c" stroke-width="1"/>
  <text x="945" y="361" font-family="sans-serif" font-size="17" font-weight="700" fill="#087f8c">121.875 MPa</text>
  <text x="945" y="383" font-family="sans-serif" font-size="14" fill="#087f8c">r = 2a = 20 mm</text>

  <circle cx="1190" cy="446.289" r="4" fill="#087f8c"/>
  <text x="1188" y="424" text-anchor="end" font-family="sans-serif" font-size="13" fill="#087f8c">103.711 MPa at 4a</text>

  <!-- Governing relation and stress concentration -->
  <rect x="48" y="652" width="1184" height="104" rx="4" fill="#f5f8fa" stroke="#cbd3db" stroke-width="1"/>
  <text x="70" y="681" font-family="sans-serif" font-size="14" font-weight="700" fill="#526170">KIRSCH SOLUTION ON y-AXIS, r ≥ a</text>
  <text x="70" y="716" font-family="sans-serif" font-size="21" fill="#182b3b">σθ(r, π/2) = σ∞ [1 + ½(a/r)² + ³⁄₂(a/r)⁴]</text>
  <line x1="696" y1="671" x2="696" y2="738" stroke="#cbd3db" stroke-width="1"/>
  <text x="722" y="681" font-family="sans-serif" font-size="14" font-weight="700" fill="#526170">ELASTIC STRESS CONCENTRATION FACTOR</text>
  <text x="722" y="716" font-family="sans-serif" font-size="23" font-weight="700" fill="#087f8c">Kₜ = σθ,max / σ∞ = 300 / 100 = 3</text>
  <text x="722" y="739" font-family="sans-serif" font-size="13" fill="#526170">Maximum at r = a, θ = ±π/2; hole-edge x-axis stress is compressive.</text>
</svg>