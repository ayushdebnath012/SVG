<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#182b40"/>
    </marker>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M8 1 L0 4 L8 7" fill="none" stroke="#526274" stroke-width="1"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#edf1f5"/>
      <path d="M-2 10 L10 -2 M8 12 L12 8" fill="none" stroke="#a0adba" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1120" height="840" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="46" font-size="25" font-weight="700" fill="#182b40">L-shaped steel bracket — side elevation</text>
    <text x="48" y="75" font-size="15" fill="#526274">Illustrative von Mises stress contours · engineering estimate, not a solved FE model</text>
    <line x1="48" y1="94" x2="1072" y2="94" stroke="#cbd3dc" stroke-width="1"/>

    <!-- Dimension lines: geometry is drawn at 6 drawing units per mm. -->
    <g fill="none" stroke="#526274" stroke-width="1">
      <line x1="210" y1="190" x2="150" y2="190"/>
      <line x1="210" y1="550" x2="150" y2="550"/>
      <line x1="165" y1="190" x2="165" y2="550" marker-start="url(#dim)" marker-end="url(#dim)"/>
      <line x1="220" y1="182" x2="220" y2="130"/>
      <line x1="268" y1="182" x2="268" y2="130"/>
      <line x1="220" y1="143" x2="268" y2="143" marker-start="url(#dim)" marker-end="url(#dim)"/>
      <line x1="220" y1="580" x2="220" y2="620"/>
      <line x1="460" y1="558" x2="460" y2="620"/>
      <line x1="220" y1="603" x2="460" y2="603" marker-start="url(#dim)" marker-end="url(#dim)"/>
      <line x1="466" y1="502" x2="523" y2="502"/>
      <line x1="466" y1="550" x2="523" y2="550"/>
      <line x1="510" y1="502" x2="510" y2="550" marker-start="url(#dim)" marker-end="url(#dim)"/>
    </g>
    <text x="142" y="378" font-size="16" text-anchor="middle" transform="rotate(-90 142 378)" fill="#34465a">60 mm overall</text>
    <text x="244" y="126" text-anchor="middle" font-size="15" fill="#34465a">8 mm</text>
    <text x="340" y="627" text-anchor="middle" font-size="16" fill="#34465a">40 mm depth</text>
    <text x="529" y="532" font-size="15" fill="#34465a">8 mm</text>

    <!-- Rigid supporting surface. -->
    <rect x="197" y="551" width="287" height="27" fill="url(#hatch)" stroke="#8291a2" stroke-width="1"/>
    <line x1="197" y1="551" x2="484" y2="551" stroke="#34465a" stroke-width="2"/>

    <!-- Bracket silhouette and discrete, illustrative stress contours. -->
    <path d="M220 190 H268 V490 Q268 502 280 502 H460 V550 H220 Z" fill="#243b8e"/>

    <path d="M220 231 H268 V490 Q268 502 280 502 H449 V516 L414 535 H260 L220 550 Z" fill="#245fbd"/>
    <path d="M220 286 H268 V490 Q268 502 280 502 H425 L412 516 L370 532 H250 L220 550 Z" fill="#008bd0"/>
    <path d="M220 334 H268 V490 Q268 502 280 502 H391 L366 518 L311 533 L252 535 L220 550 Z" fill="#00b8ce"/>
    <path d="M220 384 H268 V490 Q268 502 280 502 H350 L324 519 L280 534 L243 539 L220 550 Z" fill="#36c891"/>
    <path d="M220 433 H268 V490 Q268 502 280 502 H319 L303 518 L270 531 L239 539 L220 550 Z" fill="#8ed34f"/>
    <path d="M220 477 L231 487 L238 520 L220 542 Z" fill="#d3dd35"/>
    <path d="M259 430 L268 442 V490 Q268 502 280 502 H308 L292 517 L277 523 L262 509 L253 477 Z" fill="#d3dd35"/>
    <path d="M263 455 L268 460 V490 Q268 502 280 502 H300 L286 515 L275 518 L262 503 L257 479 Z" fill="#f5ce32"/>
    <path d="M265 474 L268 476 V490 Q268 502 280 502 H292 L282 513 L274 511 L264 501 L261 487 Z" fill="#f6a52b"/>
    <path d="M266 484 L268 484 V490 Q268 502 280 502 H285 L280 509 L274 507 L267 502 L264 494 Z" fill="#ef7428"/>
    <path d="M267 490 H268 Q268 502 280 502 L279 506 L273 504 L267 499 Z" fill="#df422c"/>
    <path d="M268 495 Q270 501 277 502 L275 504 L271 502 L268 500 Z" fill="#bd202e"/>

    <!-- Low bending stress near the neutral axis of the upright. -->
    <path d="M224 231 H264 L258 286 L254 334 L252 384 L250 434 L249 477 L251 501 L257 518 L245 524 L239 509 L239 477 L238 434 L236 384 L234 334 L230 286 Z" fill="#245fbd"/>
    <path d="M235 231 H253 L249 300 L247 395 L247 475 L250 503 L245 511 L241 500 L241 475 L241 395 L239 300 Z" fill="#243b8e"/>
    <path d="M220 190 H268 V490 Q268 502 280 502 H460 V550 H220 Z" fill="none" stroke="#182b40" stroke-width="2.2"/>

    <!-- Representative hold-down bolt in side projection. -->
    <rect x="386" y="497" width="41" height="5" fill="#dbe2e9" stroke="#34465a" stroke-width="1.4"/>
    <path d="M391 497 V482 H422 V497 Z" fill="#eef2f6" stroke="#34465a" stroke-width="1.5"/>
    <line x1="399" y1="502" x2="399" y2="571" stroke="#34465a" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="414" y1="502" x2="414" y2="571" stroke="#34465a" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="406.5" y1="473" x2="406.5" y2="581" stroke="#8291a2" stroke-width="1" stroke-dasharray="9 3 2 3"/>

    <!-- Applied resultant. -->
    <line x1="268" y1="190" x2="453" y2="190" stroke="#182b40" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="342" y="173" text-anchor="middle" font-size="19" font-weight="700" fill="#182b40">F = 2 kN</text>
    <text x="319" y="216" font-size="13" fill="#526274">Horizontal top-edge resultant</text>

    <!-- Part labels and peak callout. -->
    <text x="90" y="267" font-size="15" fill="#34465a">Upright</text>
    <polyline points="145,273 190,273 220,295" fill="none" stroke="#526274" stroke-width="1.2"/>
    <text x="326" y="578" font-size="14" fill="#34465a">Base flange</text>
    <text x="455" y="451" font-size="14" fill="#34465a">Hold-down bolt</text>
    <polyline points="455,459 436,459 418,484" fill="none" stroke="#526274" stroke-width="1.2"/>
    <text x="331" y="286" font-size="14" fill="#34465a">Low stress at free top</text>
    <polyline points="332,294 302,294 261,216" fill="none" stroke="#526274" stroke-width="1.2"/>

    <circle cx="273" cy="500" r="4" fill="#ffffff" stroke="#8c1728" stroke-width="1.5"/>
    <polyline points="277,496 331,391 555,391" fill="none" stroke="#8c1728" stroke-width="1.5"/>
    <text x="334" y="350" font-size="19" font-weight="700" fill="#8c1728">Peak ≈ 220 MPa</text>
    <text x="334" y="372" font-size="14" fill="#34465a">Inner-corner concentration</text>
    <text x="334" y="410" font-size="13" fill="#526274">Assumed root fillet R = 2 mm</text>

    <text x="220" y="654" font-size="14" fill="#34465a">Width b = 80 mm, perpendicular to this view</text>

    <!-- Discrete legend with explicit MPa boundaries. -->
    <text x="650" y="144" font-size="19" font-weight="700" fill="#182b40">von Mises stress</text>
    <text x="650" y="169" font-size="15" fill="#526274">σᵥₘ [MPa] · contour bands</text>
    <g stroke="#ffffff" stroke-width="0.7">
      <rect x="650" y="195" width="45" height="25" fill="#bd202e"/>
      <rect x="650" y="220" width="45" height="25" fill="#df422c"/>
      <rect x="650" y="245" width="45" height="25" fill="#ef7428"/>
      <rect x="650" y="270" width="45" height="25" fill="#f6a52b"/>
      <rect x="650" y="295" width="45" height="25" fill="#f5ce32"/>
      <rect x="650" y="320" width="45" height="25" fill="#d3dd35"/>
      <rect x="650" y="345" width="45" height="25" fill="#8ed34f"/>
      <rect x="650" y="370" width="45" height="25" fill="#36c891"/>
      <rect x="650" y="395" width="45" height="25" fill="#00b8ce"/>
      <rect x="650" y="420" width="45" height="25" fill="#008bd0"/>
      <rect x="650" y="445" width="45" height="25" fill="#245fbd"/>
      <rect x="650" y="470" width="45" height="25" fill="#243b8e"/>
    </g>
    <rect x="650" y="195" width="45" height="300" fill="none" stroke="#526274" stroke-width="1"/>
    <g font-size="13" fill="#34465a">
      <text x="707" y="200">240</text>
      <text x="707" y="225">220</text>
      <text x="707" y="250">200</text>
      <text x="707" y="275">180</text>
      <text x="707" y="300">160</text>
      <text x="707" y="325">140</text>
      <text x="707" y="350">120</text>
      <text x="707" y="375">100</text>
      <text x="707" y="400">80</text>
      <text x="707" y="425">60</text>
      <text x="707" y="450">40</text>
      <text x="707" y="475">20</text>
      <text x="707" y="500">0</text>
    </g>

    <text x="780" y="214" font-size="16" font-weight="700" fill="#182b40">Model assumptions</text>
    <g font-size="14" fill="#526274">
      <text x="780" y="242">Linear-elastic steel.</text>
      <text x="780" y="267">Load distributed across width;</text>
      <text x="780" y="288">no point-load singularity shown.</text>
      <text x="780" y="321">Base restrained by bolts and</text>
      <text x="780" y="342">contact with a rigid support.</text>
      <text x="780" y="375">Bolt layout is schematic;</text>
      <text x="780" y="396">local hole stresses omitted.</text>
      <text x="780" y="429">Peak uses an illustrative</text>
      <text x="780" y="450">concentration factor K ≈ 1.8.</text>
    </g>
    <text x="650" y="538" font-size="14" font-weight="700" fill="#8c1728">Peak is geometry- and restraint-dependent.</text>
    <text x="650" y="561" font-size="14" fill="#526274">A perfectly sharp inner corner is singular:</text>
    <text x="650" y="582" font-size="14" fill="#526274">no finite, mesh-independent peak exists.</text>

    <!-- Hand calculation: root section is at the flange top. -->
    <rect x="48" y="685" width="1024" height="121" rx="4" fill="#f3f6f9" stroke="#cbd3dc" stroke-width="1"/>
    <text x="68" y="711" font-size="17" font-weight="700" fill="#182b40">Simple beam check — nominal bending at the upright root</text>
    <text x="68" y="736" font-size="15" fill="#34465a">Root at flange top: h = 60 − 8 = 52 mm; M = Fh = 2,000 × 52 = 104,000 N·mm.</text>
    <text x="68" y="761" font-size="15" fill="#34465a">Z = bt²/6 = 80 × 8²/6 = 853.3 mm³;  σᵦ = M/Z = 121.9 MPa ≈ 122 MPa.</text>
    <text x="68" y="786" font-size="14" fill="#526274">Outer-fibre nominal stress, excluding fillet concentration; estimated local peak ≈ 1.8 × 122 ≈ 220 MPa. Not a strength certification.</text>
  </g>
</svg>