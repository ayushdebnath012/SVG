<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790">
  <defs>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#334155"/>
    </marker>
    <marker id="stressArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0369a1"/>
    </marker>
    <marker id="angleArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="790" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="30" y="38" font-size="25" font-weight="700">Plane stress — Mohr’s circle and principal orientation</text>
    <text x="30" y="69" font-size="18">σₓ = 80 MPa     σᵧ = −20 MPa     τₓᵧ = +30 MPa</text>
    <text x="1170" y="69" font-size="14" text-anchor="end" fill="#475569">Tensile normal stress positive • All stresses in MPa</text>

    <rect x="30" y="94" width="650" height="580" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="710" y="94" width="460" height="580" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="48" y="122" font-size="18" font-weight="700">Mohr’s circle</text>
    <text x="728" y="122" font-size="18" font-weight="700">Principal stress element</text>

    <!-- Circle geometry: 3.4 drawing units per MPa on both axes. -->
    <line x1="340" y1="161.748" x2="340" y2="558.252" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
    <circle cx="340" cy="360" r="198.252365" fill="none" stroke="#0369a1" stroke-width="2.5"/>

    <!-- Stress axes: sigma = 0 at x = 238; tau = 0 at y = 360. -->
    <line x1="66" y1="360" x2="640" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#axisArrow)"/>
    <line x1="238" y1="615" x2="238" y2="132" stroke="#334155" stroke-width="1.5" marker-end="url(#axisArrow)"/>
    <text x="610" y="342" font-size="17">σ</text>
    <text x="249" y="148" font-size="17">τ</text>

    <g stroke="#64748b" stroke-width="1">
      <line x1="102" y1="356" x2="102" y2="364"/>
      <line x1="170" y1="356" x2="170" y2="364"/>
      <line x1="238" y1="356" x2="238" y2="364"/>
      <line x1="306" y1="356" x2="306" y2="364"/>
      <line x1="374" y1="356" x2="374" y2="364"/>
      <line x1="442" y1="356" x2="442" y2="364"/>
      <line x1="510" y1="356" x2="510" y2="364"/>
      <line x1="578" y1="356" x2="578" y2="364"/>
      <line x1="234" y1="224" x2="242" y2="224"/>
      <line x1="234" y1="292" x2="242" y2="292"/>
      <line x1="234" y1="428" x2="242" y2="428"/>
      <line x1="234" y1="496" x2="242" y2="496"/>
    </g>
    <g font-size="12" fill="#475569" text-anchor="middle">
      <text x="102" y="380">−40</text>
      <text x="170" y="380">−20</text>
      <text x="238" y="380">0</text>
      <text x="306" y="380">20</text>
      <text x="374" y="380">40</text>
      <text x="442" y="380">60</text>
      <text x="510" y="380">80</text>
      <text x="578" y="380">100</text>
    </g>
    <g font-size="12" fill="#475569" text-anchor="end">
      <text x="226" y="228">40</text>
      <text x="226" y="296">20</text>
      <text x="226" y="432">−20</text>
      <text x="226" y="500">−40</text>
    </g>

    <!-- Opposite face points form a diameter. -->
    <line x1="170" y1="462" x2="510" y2="258" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 4"/>
    <circle cx="510" cy="258" r="5" fill="#0369a1" stroke="#ffffff" stroke-width="1.3"/>
    <circle cx="170" cy="462" r="5" fill="#0369a1" stroke="#ffffff" stroke-width="1.3"/>
    <text x="518" y="235" font-size="16" font-weight="700" fill="#0369a1">X (80, +30)</text>
    <text x="518" y="254" font-size="13" fill="#475569">x face</text>
    <text x="77" y="491" font-size="16" font-weight="700" fill="#0369a1">Y (−20, −30)</text>
    <text x="77" y="510" font-size="13" fill="#475569">y face</text>

    <!-- Radius and centre. -->
    <line x1="340" y1="360" x2="480.185591" y2="500.185591" stroke="#0369a1" stroke-width="1.6"/>
    <text x="380" y="389" transform="rotate(45 380 389)" font-size="15" fill="#0369a1">R = 58.31 MPa</text>
    <circle cx="340" cy="360" r="4.5" fill="#172033"/>
    <line x1="337" y1="369" x2="324" y2="389" stroke="#64748b" stroke-width="1"/>
    <text x="332" y="409" text-anchor="end" font-size="15">C (30, 0)</text>

    <!-- Principal stresses and extreme in-plane shear. -->
    <circle cx="141.747635" cy="360" r="5" fill="#172033" stroke="#ffffff" stroke-width="1"/>
    <circle cx="538.252365" cy="360" r="5" fill="#172033" stroke="#ffffff" stroke-width="1"/>
    <line x1="141.748" y1="367" x2="141.748" y2="394" stroke="#64748b" stroke-width="1"/>
    <line x1="538.252" y1="367" x2="553" y2="394" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="415" font-size="16" font-weight="700">σ₂ = −28.31</text>
    <text x="549" y="415" font-size="16" font-weight="700">σ₁ = 88.31</text>

    <circle cx="340" cy="161.747635" r="4.5" fill="#7c3aed"/>
    <circle cx="340" cy="558.252365" r="4.5" fill="#7c3aed"/>
    <text x="355" y="151" font-size="16" font-weight="700" fill="#7c3aed">τmax,in-plane = 58.31</text>
    <text x="355" y="173" font-size="13" fill="#475569">at σ = 30</text>
    <text x="355" y="584" font-size="15" fill="#7c3aed">τmin,in-plane = −58.31</text>

    <!-- Clockwise Mohr rotation from the x-face point to sigma_1. -->
    <path d="M 412.029 316.783 A 84 84 0 0 1 424 360" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#angleArrow)"/>
    <text x="446" y="331" font-size="15" fill="#b45309">2θₚ = 30.96°</text>

    <text x="48" y="623" font-size="13" fill="#475569">Equal axis scale: 20 MPa per tick interval.</text>
    <text x="48" y="647" font-size="13" fill="#475569">τ plotted positive upward; X → σ₁ is clockwise on this circle.</text>

    <!-- Principal element, physically rotated 15.4819 degrees CCW. -->
    <g transform="translate(940 360) rotate(-15.481878)">
      <rect x="-72" y="-72" width="144" height="144" fill="#f0f9ff" stroke="#0369a1" stroke-width="2.2"/>
      <line x1="77" y1="0" x2="165" y2="0" stroke="#0369a1" stroke-width="2.5" marker-end="url(#stressArrow)"/>
      <line x1="-77" y1="0" x2="-165" y2="0" stroke="#0369a1" stroke-width="2.5" marker-end="url(#stressArrow)"/>
      <line x1="0" y1="-154" x2="0" y2="-78" stroke="#0369a1" stroke-width="2.5" marker-end="url(#stressArrow)"/>
      <line x1="0" y1="154" x2="0" y2="78" stroke="#0369a1" stroke-width="2.5" marker-end="url(#stressArrow)"/>
      <line x1="-34" y1="0" x2="55" y2="0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="0" y1="34" x2="0" y2="-55" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
    </g>

    <line x1="940" y1="360" x2="1130" y2="360" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#axisArrow)"/>
    <circle cx="940" cy="360" r="3" fill="#172033"/>
    <text x="1137" y="365" font-size="16">x</text>
    <text x="1110" y="315" font-size="16" fill="#0369a1">x′</text>
    <text x="877" y="225" font-size="16" fill="#0369a1">y′</text>

    <path d="M 1055 360 A 115 115 0 0 0 1050.827 329.304" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#angleArrow)"/>
    <text x="1048" y="390" font-size="15" fill="#b45309">θₚ = 15.48°</text>
    <text x="1048" y="410" font-size="13" fill="#b45309">CCW</text>

    <text x="1004" y="266" font-size="17" font-weight="700" fill="#0369a1">σ₁ = +88.31</text>
    <text x="1004" y="287" font-size="13" fill="#475569">tension</text>
    <text x="924" y="183" font-size="17" font-weight="700" fill="#0369a1">σ₂ = −28.31</text>
    <text x="924" y="204" font-size="13" fill="#475569">compression</text>

    <text x="940" y="560" text-anchor="middle" font-size="18" font-weight="700">θₚ = 15.48° CCW from x to x′</text>
    <text x="940" y="591" text-anchor="middle" font-size="17">σx′ = σ₁     σy′ = σ₂     τx′y′ = 0</text>
    <text x="940" y="625" text-anchor="middle" font-size="13" fill="#475569">Outward arrows: tension • Inward arrows: compression</text>
    <text x="940" y="647" text-anchor="middle" font-size="13" fill="#475569">Orientation to scale; stress-arrow lengths schematic.</text>

    <text x="30" y="713" font-size="17">C = (σₓ + σᵧ)/2 = 30 MPa;    R = √[((σₓ − σᵧ)/2)² + τₓᵧ²] = √3400 = 58.31 MPa</text>
    <text x="30" y="748" font-size="17">σ₁,₂ = C ± R;    τmax,in-plane = R;    θₚ = ½ atan2(2τₓᵧ, σₓ − σᵧ) = ½ atan2(60, 100) = 15.48°</text>
  </g>
</svg>