<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840">
  <defs>
    <marker id="velocityArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#1265a8"/>
    </marker>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#374151"/>
    </marker>
    <marker id="dimensionArrow" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="840" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="27" font-weight="bold" fill="#172635">Fully developed laminar oil flow</text>
    <text x="40" y="72" font-size="16" fill="#526171">Circular pipe • longitudinal diametral section • steady, Newtonian flow</text>

    <rect x="40" y="94" width="1120" height="54" rx="4" fill="#f2f5f8" stroke="#cbd5df"/>
    <text x="60" y="127" font-size="18" fill="#172635">μ = 0.1 Pa·s</text>
    <text x="270" y="127" font-size="18" fill="#172635">ρ = 900 kg/m³</text>
    <text x="510" y="127" font-size="18" fill="#172635">D = 20 mm; R = 0.010 m</text>
    <text x="835" y="127" font-size="18" fill="#172635">G = −dp/dx = 200 Pa/m</text>

    <text x="110" y="184" font-size="20" font-weight="bold" fill="#172635">Velocity distribution</text>
    <text x="810" y="184" font-size="20" font-weight="bold" fill="#172635">Shear-stress distribution</text>

    <!-- Pipe walls and fluid region -->
    <rect x="110" y="220" width="610" height="300" fill="#f7fbff"/>
    <rect x="110" y="204" width="610" height="16" fill="#d7dfe6" stroke="#657587" stroke-width="1"/>
    <rect x="110" y="520" width="610" height="16" fill="#d7dfe6" stroke="#657587" stroke-width="1"/>
    <line x1="110" y1="220" x2="720" y2="220" stroke="#172635" stroke-width="2.5"/>
    <line x1="110" y1="520" x2="720" y2="520" stroke="#172635" stroke-width="2.5"/>

    <!-- Diameter dimension -->
    <line x1="68" y1="220" x2="104" y2="220" stroke="#657587" stroke-width="1"/>
    <line x1="68" y1="520" x2="104" y2="520" stroke="#657587" stroke-width="1"/>
    <line x1="78" y1="220" x2="78" y2="520" stroke="#374151" stroke-width="1.2" marker-start="url(#dimensionArrow)" marker-end="url(#dimensionArrow)"/>
    <text x="54" y="370" transform="rotate(-90 54 370)" text-anchor="middle" font-size="17" fill="#172635">D = 20 mm</text>

    <!-- Centreline and velocity reference station -->
    <line x1="110" y1="370" x2="734" y2="370" stroke="#7c8b99" stroke-width="1" stroke-dasharray="10 5 2 5"/>
    <line x1="280" y1="220" x2="280" y2="520" stroke="#9baab8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="125" y="360" font-size="14" fill="#526171">Centreline</text>

    <!-- Arrow lengths are proportional to u(r) -->
    <g stroke="#1265a8" stroke-width="2" fill="none" marker-end="url(#velocityArrow)">
      <line x1="280" y1="250" x2="388" y2="250"/>
      <line x1="280" y1="280" x2="472" y2="280"/>
      <line x1="280" y1="310" x2="532" y2="310"/>
      <line x1="280" y1="340" x2="568" y2="340"/>
      <line x1="280" y1="370" x2="580" y2="370"/>
      <line x1="280" y1="400" x2="568" y2="400"/>
      <line x1="280" y1="430" x2="532" y2="430"/>
      <line x1="280" y1="460" x2="472" y2="460"/>
      <line x1="280" y1="490" x2="388" y2="490"/>
    </g>

    <!-- Exact quadratic envelope: x = 280 + 300[1 - ((y - 370)/150)^2] -->
    <path d="M 280 220 Q 880 370 280 520" fill="none" stroke="#1265a8" stroke-width="2.6"/>
    <circle cx="280" cy="220" r="3.5" fill="#1265a8"/>
    <circle cx="280" cy="520" r="3.5" fill="#1265a8"/>

    <text x="126" y="246" font-size="14" fill="#526171">No slip: u = 0</text>
    <text x="126" y="508" font-size="14" fill="#526171">No slip: u = 0</text>
    <text x="598" y="346" font-size="15" font-weight="bold" fill="#1265a8">u_max</text>
    <text x="598" y="365" font-size="15" fill="#1265a8">0.050 m/s</text>
    <text x="545" y="264" font-size="14" fill="#1265a8">Parabolic envelope</text>
    <path d="M 555 272 L 515 293" fill="none" stroke="#1265a8" stroke-width="1.1"/>
    <line x1="602" y1="470" x2="690" y2="470" stroke="#374151" stroke-width="1.5" marker-end="url(#axisArrow)"/>
    <text x="618" y="493" font-size="14" fill="#374151">Flow, +x</text>

    <!-- Signed shear stress, using a signed transverse coordinate r -->
    <line x1="825" y1="220" x2="1145" y2="220" stroke="#ccd5dd" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="825" y1="520" x2="1145" y2="520" stroke="#ccd5dd" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="980" y1="548" x2="980" y2="200" stroke="#374151" stroke-width="1.4" marker-end="url(#axisArrow)"/>
    <line x1="835" y1="370" x2="1135" y2="370" stroke="#374151" stroke-width="1.4" marker-end="url(#axisArrow)"/>
    <text x="995" y="209" font-size="16" fill="#374151">r</text>
    <text x="1135" y="353" text-anchor="end" font-size="16" fill="#374151">τ_rx (Pa)</text>

    <line x1="890" y1="220" x2="890" y2="376" stroke="#c38b7c" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1070" y1="364" x2="1070" y2="520" stroke="#c38b7c" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="890" y1="220" x2="1070" y2="520" stroke="#bd4b31" stroke-width="3"/>
    <circle cx="890" cy="220" r="4" fill="#bd4b31"/>
    <circle cx="1070" cy="520" r="4" fill="#bd4b31"/>
    <circle cx="980" cy="370" r="3" fill="#bd4b31"/>

    <text x="890" y="397" text-anchor="middle" font-size="15" fill="#374151">−1.0</text>
    <text x="993" y="397" font-size="15" fill="#374151">0</text>
    <text x="1070" y="397" text-anchor="middle" font-size="15" fill="#374151">+1.0</text>
    <text x="1136" y="243" text-anchor="end" font-size="14" fill="#526171">r = +R</text>
    <text x="1136" y="511" text-anchor="end" font-size="14" fill="#526171">r = −R</text>
    <text x="837" y="283" font-size="14" fill="#bd4b31">Linear</text>
    <text x="837" y="302" font-size="14" fill="#bd4b31">variation</text>

    <text x="110" y="571" font-size="18" fill="#1265a8">u(r) = G(R² − r²)/(4μ)</text>
    <text x="110" y="595" font-size="14" fill="#526171">Arrow length represents axial speed; the envelope is not a streamline.</text>
    <text x="810" y="571" font-size="17" fill="#bd4b31">τ_rx = μ du/dr = −Gr/2</text>
    <text x="810" y="595" font-size="14" fill="#526171">Signed transverse r; wall magnitude |τ_w| = 1.00 Pa</text>

    <!-- Computed quantities -->
    <g>
      <rect x="40" y="622" width="265" height="150" rx="4" fill="#f7f9fb" stroke="#cbd5df"/>
      <text x="58" y="651" font-size="16" font-weight="bold" fill="#172635">Centreline velocity</text>
      <text x="58" y="680" font-size="16" fill="#526171">u_max = GR²/(4μ)</text>
      <text x="58" y="724" font-size="29" font-weight="bold" fill="#1265a8">0.050 m/s</text>
      <text x="58" y="751" font-size="14" fill="#526171">Maximum at r = 0</text>

      <rect x="325" y="622" width="265" height="150" rx="4" fill="#f7f9fb" stroke="#cbd5df"/>
      <text x="343" y="651" font-size="16" font-weight="bold" fill="#172635">Mean velocity</text>
      <text x="343" y="680" font-size="16" fill="#526171">u_mean = u_max/2</text>
      <text x="343" y="724" font-size="29" font-weight="bold" fill="#1265a8">0.025 m/s</text>
      <text x="343" y="751" font-size="14" fill="#526171">Cross-sectional area average</text>

      <rect x="610" y="622" width="265" height="150" rx="4" fill="#f7f9fb" stroke="#cbd5df"/>
      <text x="628" y="651" font-size="16" font-weight="bold" fill="#172635">Volumetric flow rate</text>
      <text x="628" y="680" font-size="16" fill="#526171">Q = πR² u_mean</text>
      <text x="628" y="724" font-size="29" font-weight="bold" fill="#1265a8">0.471 L/min</text>
      <text x="628" y="751" font-size="14" fill="#526171">7.854 × 10⁻⁶ m³/s</text>

      <rect x="895" y="622" width="265" height="150" rx="4" fill="#f7f9fb" stroke="#cbd5df"/>
      <text x="913" y="651" font-size="16" font-weight="bold" fill="#172635">Reynolds number</text>
      <text x="913" y="680" font-size="16" fill="#526171">Re = ρ u_mean D/μ</text>
      <text x="913" y="724" font-size="29" font-weight="bold" fill="#1265a8">4.50</text>
      <text x="913" y="751" font-size="14" fill="#526171">Well within the laminar regime</text>
    </g>

    <text x="40" y="812" font-size="14" fill="#526171">Hagen–Poiseuille flow • pressure decreases in the +x direction • longitudinal length schematic</text>
  </g>
</svg>