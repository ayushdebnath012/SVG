<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#243746"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#126b9c"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#b44732"/>
    </marker>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 4 L8 0 L8 8 Z" fill="#526674"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="940" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="47" font-size="27" font-weight="700" fill="#182e3d">SOLID STEEL SHAFT — ELASTIC TORSION</text>
    <text x="40" y="79" font-size="17" fill="#526674">G = 80 GPa = 80,000 N/mm²    |    d = 50 mm    |    L = 1,000 mm    |    T = 2 kN·m = 2,000,000 N·mm</text>

    <rect x="35" y="105" width="1130" height="315" rx="5" fill="#ffffff" stroke="#c5d0d7" stroke-width="1.2"/>
    <text x="55" y="134" font-size="16" font-weight="700" fill="#182e3d">01  SHAFT AND END TORQUES</text>
    <text x="1145" y="134" text-anchor="end" font-size="13" fill="#526674">Schematic • not to scale</text>

    <!-- Shaft, shown in an oblique projection -->
    <path d="M240 182 L925 182 A29 68 0 0 1 925 318 L240 318 A29 68 0 0 1 240 182 Z"
          fill="#e8eef2" stroke="#243746" stroke-width="2"/>
    <path d="M240 182 A29 68 0 0 1 240 318" fill="none" stroke="#8b9ba6" stroke-width="1.3" stroke-dasharray="6 5"/>
    <ellipse cx="925" cy="250" rx="29" ry="68" fill="#d8e5ed" stroke="#243746" stroke-width="2"/>
    <line x1="120" y1="250" x2="1040" y2="250" stroke="#8b9ba6" stroke-width="1" stroke-dasharray="14 5 3 5"/>
    <text x="545" y="239" font-size="21" font-weight="700" fill="#243746">Solid steel</text>
    <text x="546" y="270" font-size="17" fill="#526674">Ø50 mm</text>

    <!-- Opposing end couples -->
    <path d="M205 178 A43 79 0 1 0 205 322" fill="none" stroke="#126b9c" stroke-width="3" marker-end="url(#blueArrow)"/>
    <path d="M975 322 A43 79 0 1 1 975 178" fill="none" stroke="#126b9c" stroke-width="3" marker-end="url(#blueArrow)"/>
    <text x="62" y="172" font-size="18" font-weight="700" fill="#126b9c">T = 2 kN·m</text>
    <text x="62" y="194" font-size="13" fill="#526674">Reaction couple</text>
    <text x="1027" y="172" font-size="18" font-weight="700" fill="#126b9c">T = 2 kN·m</text>
    <text x="1030" y="194" font-size="13" fill="#526674">Applied couple</text>

    <!-- Reference and twisted end radii -->
    <line x1="925" y1="250" x2="925" y2="182" stroke="#526674" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="925" y1="250" x2="936" y2="187" stroke="#b44732" stroke-width="2.5"/>
    <circle cx="925" cy="250" r="3" fill="#243746"/>
    <polyline points="939,202 1014,220 1078,220" fill="none" stroke="#b44732" stroke-width="1.2"/>
    <text x="1027" y="242" font-size="15" fill="#b44732">Relative twist φ</text>
    <text x="1027" y="263" font-size="13" fill="#526674">See end view below</text>

    <!-- End identification and length dimension -->
    <text x="240" y="345" text-anchor="middle" font-size="14" fill="#243746">End A: reference</text>
    <text x="925" y="345" text-anchor="middle" font-size="14" fill="#243746">End B: loaded</text>
    <line x1="240" y1="354" x2="240" y2="398" stroke="#526674" stroke-width="1"/>
    <line x1="925" y1="354" x2="925" y2="398" stroke="#526674" stroke-width="1"/>
    <line x1="240" y1="384" x2="925" y2="384" stroke="#526674" stroke-width="1.2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <rect x="497" y="371" width="171" height="25" fill="#ffffff"/>
    <text x="582.5" y="389" text-anchor="middle" font-size="17" fill="#243746">L = 1 m = 1,000 mm</text>

    <!-- Cross-section and linear stress law -->
    <rect x="35" y="440" width="550" height="330" rx="5" fill="#ffffff" stroke="#c5d0d7" stroke-width="1.2"/>
    <text x="55" y="470" font-size="16" font-weight="700" fill="#182e3d">02  CROSS-SECTION AND SHEAR STRESS</text>
    <text x="55" y="495" font-size="13" fill="#526674">Tangential shear on a transverse section; τ(r) = Tr/J</text>

    <circle cx="155" cy="606" r="72" fill="#eff5f8" stroke="#243746" stroke-width="2"/>
    <line x1="69" y1="606" x2="241" y2="606" stroke="#8b9ba6" stroke-width="1" stroke-dasharray="7 4"/>
    <line x1="155" y1="520" x2="155" y2="688" stroke="#8b9ba6" stroke-width="1" stroke-dasharray="7 4"/>
    <line x1="155" y1="606" x2="227" y2="606" stroke="#243746" stroke-width="1.6"/>
    <circle cx="155" cy="606" r="3" fill="#243746"/>
    <line x1="173" y1="606" x2="173" y2="589" stroke="#b44732" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="191" y1="606" x2="191" y2="572" stroke="#b44732" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="209" y1="606" x2="209" y2="555" stroke="#b44732" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="227" y1="606" x2="227" y2="538" stroke="#b44732" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="155" y1="606" x2="227" y2="538" stroke="#b44732" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="143" y="625" text-anchor="end" font-size="14" fill="#243746">τ = 0</text>
    <text x="181" y="628" font-size="14" fill="#243746">r →</text>
    <text x="202" y="525" font-size="14" font-weight="700" fill="#b44732">τmax</text>
    <line x1="83" y1="682" x2="83" y2="713" stroke="#526674" stroke-width="1"/>
    <line x1="227" y1="682" x2="227" y2="713" stroke="#526674" stroke-width="1"/>
    <line x1="83" y1="704" x2="227" y2="704" stroke="#526674" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <rect x="118" y="693" width="74" height="22" fill="#ffffff"/>
    <text x="155" y="709" text-anchor="middle" font-size="15" fill="#243746">Ø50 mm</text>
    <text x="155" y="742" text-anchor="middle" font-size="13" fill="#526674">Arrow length ∝ shear stress</text>

    <!-- Stress versus radius plot -->
    <line x1="343" y1="674" x2="552" y2="674" stroke="#243746" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="343" y1="674" x2="343" y2="524" stroke="#243746" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="341" y="516" font-size="14" fill="#243746">τ (MPa)</text>
    <line x1="343" y1="549" x2="525" y2="549" stroke="#a4b2bc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="525" y1="549" x2="525" y2="674" stroke="#a4b2bc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="343" y1="674" x2="525" y2="549" stroke="#b44732" stroke-width="3"/>
    <circle cx="525" cy="549" r="4" fill="#b44732"/>
    <text x="332" y="554" text-anchor="end" font-size="14" fill="#b44732">81.49</text>
    <text x="332" y="691" text-anchor="end" font-size="13" fill="#243746">0</text>
    <text x="525" y="696" text-anchor="middle" font-size="14" fill="#243746">25</text>
    <text x="439" y="720" text-anchor="middle" font-size="14" fill="#243746">Radius r (mm)</text>
    <text x="439" y="743" text-anchor="middle" font-size="13" fill="#526674">Linear: zero at centre, peak at surface</text>

    <!-- Twist diagram -->
    <rect x="605" y="440" width="560" height="330" rx="5" fill="#ffffff" stroke="#c5d0d7" stroke-width="1.2"/>
    <text x="625" y="470" font-size="16" font-weight="700" fill="#182e3d">03  RELATIVE ROTATION OF THE ENDS</text>
    <text x="625" y="495" font-size="13" fill="#526674">End radii superimposed, viewed along the shaft axis</text>

    <circle cx="740" cy="605" r="81" fill="#eff5f8" stroke="#243746" stroke-width="2"/>
    <line x1="646" y1="605" x2="834" y2="605" stroke="#8b9ba6" stroke-width="1" stroke-dasharray="7 4"/>
    <line x1="740" y1="699" x2="740" y2="512" stroke="#8b9ba6" stroke-width="1" stroke-dasharray="7 4"/>
    <line x1="740" y1="605" x2="740" y2="524" stroke="#526674" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="740" y1="605" x2="770.3" y2="529.9" stroke="#b44732" stroke-width="3"/>
    <circle cx="740" cy="605" r="3.5" fill="#243746"/>
    <path d="M740 553 A52 52 0 0 1 759.5 556.8" fill="none" stroke="#b44732" stroke-width="1.8" marker-end="url(#redArrow)"/>
    <text x="753" y="582" font-size="19" font-style="italic" fill="#b44732">φ</text>

    <polyline points="740,524 841,524 862,542" fill="none" stroke="#526674" stroke-width="1.1"/>
    <text x="875" y="547" font-size="15" fill="#526674">End A reference radius</text>
    <polyline points="770.3,529.9 846,570 862,570" fill="none" stroke="#b44732" stroke-width="1.1"/>
    <text x="875" y="575" font-size="15" fill="#b44732">End B rotated radius</text>
    <text x="875" y="617" font-size="22" font-weight="700" fill="#b44732">φ = 2.334°</text>
    <text x="875" y="644" font-size="14" fill="#526674">= 0.040744 rad</text>
    <text x="875" y="672" font-size="13" fill="#526674">Angle exaggerated for clarity</text>
    <text x="635" y="730" font-size="16" fill="#243746">φ = TL/(GJ) = (2,000,000 × 1,000)/(80,000 × J)</text>
    <text x="635" y="752" font-size="13" fill="#526674">Uniform circular shaft • linear elastic response • end effects neglected</text>

    <!-- Computed results, consistent N-mm units -->
    <rect x="35" y="790" width="1130" height="112" rx="5" fill="#f2f6f8" stroke="#c5d0d7" stroke-width="1.2"/>
    <line x1="410" y1="807" x2="410" y2="885" stroke="#c5d0d7" stroke-width="1"/>
    <line x1="787" y1="807" x2="787" y2="885" stroke="#c5d0d7" stroke-width="1"/>

    <text x="55" y="816" font-size="13" font-weight="700" fill="#526674">POLAR SECOND MOMENT OF AREA</text>
    <text x="55" y="846" font-size="22" font-weight="700" fill="#182e3d">J = 613,592 mm⁴</text>
    <text x="55" y="878" font-size="16" fill="#243746">J = πd⁴/32 = π(50)⁴/32</text>

    <text x="432" y="816" font-size="13" font-weight="700" fill="#526674">MAXIMUM SHEAR STRESS</text>
    <text x="432" y="846" font-size="22" font-weight="700" fill="#b44732">τmax = 81.49 MPa</text>
    <text x="432" y="878" font-size="16" fill="#243746">τmax = T(d/2)/J = 2,000,000 × 25/J</text>

    <text x="809" y="816" font-size="13" font-weight="700" fill="#526674">TOTAL ANGLE OF TWIST</text>
    <text x="809" y="846" font-size="22" font-weight="700" fill="#126b9c">φ = 2.334°</text>
    <text x="809" y="878" font-size="16" fill="#243746">φ = [TL/(GJ)] × 180/π</text>

    <text x="40" y="925" font-size="12" fill="#526674">Stress and twist values are magnitudes. Equal and opposite end torques maintain torsional equilibrium.</text>
  </g>
</svg>