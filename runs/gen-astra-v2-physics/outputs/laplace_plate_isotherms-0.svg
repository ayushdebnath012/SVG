<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 8,0 L 0,4 L 8,8" fill="none" stroke="#475569" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="850" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172b3a">
    <text x="460" y="35" text-anchor="middle" font-size="23" font-weight="bold">Steady heat conduction in a square plate</text>
    <text x="460" y="60" text-anchor="middle" font-size="15">Uniform isotropic material · No internal heat generation · ∇²T = 0</text>
  </g>

  <rect x="160" y="110" width="600" height="600" fill="#fafcfe"/>

  <!-- Contours approach the two upper corners, where the boundary data jump. -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#2563a6" d="
      M160,110
      C172.5,188.922 185,258.727 197.5,306.20
      C210,353.673 222.5,385.648 235,411.159
      C260,462.181 285,487.883 310,506.94
      C335,525.996 360,536.835 385,543.90
      C410,550.965 435,554.02 460,554.02
      C485,554.02 510,550.965 535,543.90
      C560,536.835 585,525.996 610,506.94
      C635,487.883 660,462.181 685,411.159
      C697.5,385.648 710,353.673 722.5,306.20
      C735,258.727 747.5,188.922 760,110"/>

    <path stroke="#087e8b" d="
      M160,110
      C185,186.942 210,254.889 235,299.66
      C260,344.431 285,372.86 310,393.83
      C335,414.80 360,427.997 385,436.60
      C410,445.203 435,449.10 460,449.10
      C485,449.10 510,445.203 535,436.60
      C560,427.997 585,414.80 610,393.83
      C635,372.86 660,344.431 685,299.66
      C710,254.889 735,186.942 760,110"/>

    <path stroke="#40813b" d="
      M160,110
      C185,144.410 210,178.279 235,206.16
      C260,234.041 285,256.296 310,273.27
      C335,290.244 360,302.134 385,309.93
      C410,317.726 435,321.45 460,321.45
      C485,321.45 510,317.726 535,309.93
      C560,302.134 585,290.244 610,273.27
      C635,256.296 660,234.041 685,206.16
      C710,178.279 735,144.410 760,110"/>

    <path stroke="#b66b08" d="
      M160,110
      C185,128.164 210,146.265 235,162.353
      C260,178.441 285,192.506 310,203.75
      C335,214.994 360,223.472 385,229.095
      C410,234.718 435,237.49 460,237.49
      C485,237.49 510,234.718 535,229.095
      C560,223.472 585,214.994 610,203.75
      C635,192.506 660,178.441 685,162.353
      C710,146.265 735,128.164 760,110"/>

    <path stroke="#bc4035" d="
      M160,110
      C185,118.123 210,126.24 235,133.66
      C260,141.08 285,147.80 310,153.33
      C335,158.86 360,163.20 385,166.12
      C410,169.04 435,170.53 460,170.53
      C485,170.53 510,169.04 535,166.12
      C560,163.20 585,158.86 610,153.33
      C635,147.80 660,141.08 685,133.66
      C710,126.24 735,118.123 760,110"/>
  </g>

  <!-- Plate boundary -->
  <path d="M160,110 V710 H760 V110" fill="none" stroke="#263746" stroke-width="3"/>
  <line x1="160" y1="110" x2="760" y2="110" stroke="#b42318" stroke-width="4"/>

  <!-- Isotherm labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" stroke="#fafcfe" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">
    <text x="460" y="176.5" fill="#bc4035">80 °C</text>
    <text x="460" y="243.5" fill="#b66b08">60 °C</text>
    <text x="460" y="327.5" fill="#40813b">40 °C</text>
    <text x="460" y="455.1" fill="#087e8b">20 °C</text>
    <text x="460" y="560" fill="#2563a6">10 °C</text>
  </g>

  <!-- Exact centre temperature -->
  <line x1="460" y1="394" x2="460" y2="405" stroke="#172b3a" stroke-width="1.2"/>
  <circle cx="460" cy="410" r="4" fill="#172b3a" stroke="#ffffff" stroke-width="1.2"/>
  <text x="460" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#172b3a">Centre: 25 °C (exact)</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">
    <text x="460" y="94" fill="#b42318" font-weight="bold">100 °C</text>
    <text x="124" y="410" transform="rotate(-90 124 410)" fill="#263746">0 °C</text>
    <text x="796" y="410" transform="rotate(90 796 410)" fill="#263746">0 °C</text>
    <text x="460" y="740" fill="#263746">0 °C</text>
  </g>

  <!-- Overall dimensions -->
  <g fill="none" stroke="#475569" stroke-width="1.1">
    <line x1="160" y1="722" x2="160" y2="798"/>
    <line x1="760" y1="722" x2="760" y2="798"/>
    <line x1="160" y1="782" x2="760" y2="782" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="772" y1="110" x2="866" y2="110"/>
    <line x1="772" y1="710" x2="866" y2="710"/>
    <line x1="850" y1="110" x2="850" y2="710" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <rect x="434" y="768" width="52" height="27" fill="#ffffff"/>
  <rect x="836" y="384" width="28" height="52" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#334155">
    <text x="460" y="789">1 m</text>
    <text x="857" y="410" transform="rotate(-90 857 410)">1 m</text>
  </g>

  <text x="460" y="829" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Isotherms meet the top only in the upper-corner limits, where the hot and cold boundary values jump.</text>
</svg>