<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900">
  <defs>
    <marker id="loadArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#172b40"/>
    </marker>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#526171"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>
  <text x="45" y="45" font-family="sans-serif" font-size="26" font-weight="bold" fill="#172b40">PINNED–PINNED STEEL COLUMN</text>
  <text x="45" y="75" font-family="sans-serif" font-size="17" fill="#526171">E = 200 GPa  •  Solid circular section, d = 40 mm  •  L = 3 m  •  Effective-length factor K = 1</text>
  <line x1="45" y1="94" x2="1055" y2="94" stroke="#bbc4cd" stroke-width="1"/>

  <text x="255" y="122" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#172b40">Straight column</text>
  <text x="760" y="122" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#172b40">First Euler buckling mode</text>

  <!-- Length dimension measured between pin centers -->
  <line x1="90" y1="200" x2="232" y2="200" stroke="#8793a0" stroke-width="1"/>
  <line x1="90" y1="600" x2="232" y2="600" stroke="#8793a0" stroke-width="1"/>
  <line x1="105" y1="204" x2="105" y2="596" stroke="#526171" stroke-width="1.4" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="82" y="400" transform="rotate(-90 82 400)" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b40">L = 3 m = 3000 mm</text>

  <!-- Straight member and centerline -->
  <rect x="245" y="200" width="20" height="400" fill="#e0e6ec" stroke="#172b40" stroke-width="2"/>
  <line x1="255" y1="188" x2="255" y2="612" stroke="#8793a0" stroke-width="1" stroke-dasharray="9 4 2 4"/>

  <!-- Top pin support -->
  <polygon points="255,200 234,170 276,170" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
  <line x1="224" y1="170" x2="286" y2="170" stroke="#172b40" stroke-width="2"/>
  <path d="M 226 170 l 8 -8 M 238 170 l 8 -8 M 250 170 l 8 -8 M 262 170 l 8 -8 M 274 170 l 8 -8" fill="none" stroke="#526171" stroke-width="1.2"/>
  <circle cx="255" cy="200" r="6" fill="#ffffff" stroke="#172b40" stroke-width="2"/>

  <!-- Bottom pin support -->
  <polygon points="255,600 234,630 276,630" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
  <line x1="224" y1="630" x2="286" y2="630" stroke="#172b40" stroke-width="2"/>
  <path d="M 234 630 l -8 8 M 246 630 l -8 8 M 258 630 l -8 8 M 270 630 l -8 8 M 282 630 l -8 8" fill="none" stroke="#526171" stroke-width="1.2"/>
  <circle cx="255" cy="600" r="6" fill="#ffffff" stroke="#172b40" stroke-width="2"/>

  <!-- Axial compression -->
  <line x1="255" y1="133" x2="255" y2="158" stroke="#172b40" stroke-width="2.5" marker-end="url(#loadArrow)"/>
  <text x="280" y="152" font-family="sans-serif" font-size="18" fill="#172b40">P</text>
  <line x1="255" y1="672" x2="255" y2="642" stroke="#172b40" stroke-width="2.5" marker-end="url(#loadArrow)"/>
  <text x="280" y="664" font-family="sans-serif" font-size="18" fill="#172b40">P</text>

  <!-- Part leaders -->
  <path d="M 265 200 L 316 223 L 383 223" fill="none" stroke="#526171" stroke-width="1.2"/>
  <text x="321" y="214" font-family="sans-serif" font-size="16" fill="#172b40">Pin joint</text>
  <path d="M 265 377 L 319 350 L 429 350" fill="none" stroke="#526171" stroke-width="1.2"/>
  <text x="323" y="320" font-family="sans-serif" font-size="16" fill="#172b40">Steel column</text>
  <text x="323" y="341" font-family="sans-serif" font-size="16" fill="#526171">Ø40 mm, solid</text>
  <path d="M 265 600 L 316 577 L 383 577" fill="none" stroke="#526171" stroke-width="1.2"/>
  <text x="321" y="568" font-family="sans-serif" font-size="16" fill="#172b40">Pin joint</text>

  <!-- Mode reference axis -->
  <line x1="730" y1="190" x2="730" y2="610" stroke="#8793a0" stroke-width="1.5" stroke-dasharray="8 6"/>
  <line x1="686" y1="400" x2="875" y2="400" stroke="#bbc4cd" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- Half-sine centerline, four cubic segments -->
  <path d="M 730 200
           C 758.798 233.333, 787.419 266.667, 807.782 300
           C 828.145 333.333, 840 366.667, 840 400
           C 840 433.333, 828.145 466.667, 807.782 500
           C 787.419 533.333, 758.798 566.667, 730 600"
        fill="none" stroke="#176ba0" stroke-width="4"/>

  <!-- Mode pin supports -->
  <polygon points="730,200 709,170 751,170" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
  <line x1="699" y1="170" x2="761" y2="170" stroke="#172b40" stroke-width="2"/>
  <path d="M 701 170 l 8 -8 M 713 170 l 8 -8 M 725 170 l 8 -8 M 737 170 l 8 -8 M 749 170 l 8 -8" fill="none" stroke="#526171" stroke-width="1.2"/>
  <circle cx="730" cy="200" r="6" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
  <polygon points="730,600 709,630 751,630" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
  <line x1="699" y1="630" x2="761" y2="630" stroke="#172b40" stroke-width="2"/>
  <path d="M 709 630 l -8 8 M 721 630 l -8 8 M 733 630 l -8 8 M 745 630 l -8 8 M 757 630 l -8 8" fill="none" stroke="#526171" stroke-width="1.2"/>
  <circle cx="730" cy="600" r="6" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
  <line x1="730" y1="133" x2="730" y2="158" stroke="#172b40" stroke-width="2.5" marker-end="url(#loadArrow)"/>
  <text x="756" y="152" font-family="sans-serif" font-size="17" fill="#172b40">P = Pcr</text>
  <line x1="730" y1="672" x2="730" y2="642" stroke="#172b40" stroke-width="2.5" marker-end="url(#loadArrow)"/>
  <text x="756" y="664" font-family="sans-serif" font-size="17" fill="#172b40">P = Pcr</text>

  <!-- Deflection annotations -->
  <line x1="734" y1="400" x2="836" y2="400" stroke="#526171" stroke-width="1.3" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="784" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#176ba0">δmax</text>
  <path d="M 821 330 L 874 290 L 1018 290" fill="none" stroke="#176ba0" stroke-width="1.2"/>
  <text x="871" y="257" font-family="sans-serif" font-size="16" fill="#176ba0">v(x) = δmax sin(πx/L)</text>
  <text x="871" y="280" font-family="sans-serif" font-size="14" fill="#526171">x measured from top pin</text>
  <path d="M 730 499 L 669 474 L 544 474" fill="none" stroke="#8793a0" stroke-width="1.2"/>
  <text x="544" y="462" font-family="sans-serif" font-size="15" fill="#526171">Undeformed axis</text>

  <text x="255" y="700" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526171">Pin-to-pin length; schematic member width</text>
  <text x="760" y="700" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526171">Half-sine mode • Lateral deflection exaggerated</text>
  <line x1="45" y1="721" x2="1055" y2="721" stroke="#bbc4cd" stroke-width="1"/>

  <!-- Circular section detail -->
  <text x="145" y="749" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172b40">SECTION</text>
  <circle cx="145" cy="789" r="27" fill="#e0e6ec" stroke="#172b40" stroke-width="2"/>
  <line x1="109" y1="789" x2="181" y2="789" stroke="#8793a0" stroke-width="1" stroke-dasharray="7 3 2 3"/>
  <line x1="145" y1="755" x2="145" y2="823" stroke="#8793a0" stroke-width="1" stroke-dasharray="7 3 2 3"/>
  <line x1="118" y1="792" x2="118" y2="843" stroke="#8793a0" stroke-width="1"/>
  <line x1="172" y1="792" x2="172" y2="843" stroke="#8793a0" stroke-width="1"/>
  <line x1="121" y1="838" x2="169" y2="838" stroke="#526171" stroke-width="1.2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="145" y="863" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172b40">Ø40 mm</text>

  <!-- Calculation summary -->
  <rect x="290" y="738" width="765" height="137" rx="4" fill="#f3f6f8" stroke="#bbc4cd" stroke-width="1"/>
  <text x="308" y="762" font-family="sans-serif" font-size="16" fill="#172b40">A = πd²/4 = 1256.64 mm²     I = πd⁴/64 = 125663.71 mm⁴     r = √(I/A) = 10 mm</text>
  <text x="308" y="792" font-family="sans-serif" font-size="18" fill="#172b40">Slenderness ratio:   λ = KL/r = 3000/10 = 300</text>
  <text x="308" y="823" font-family="sans-serif" font-size="18" font-weight="bold" fill="#176ba0">Critical load:   Pcr = π²EI/(KL)² = 27.56 kN</text>
  <text x="308" y="854" font-family="sans-serif" font-size="18" font-weight="bold" fill="#176ba0">Critical stress:   σcr = Pcr/A = π²E/λ² = 21.93 MPa</text>
  <text x="1055" y="893" text-anchor="end" font-family="sans-serif" font-size="12" fill="#526171">Ideal, initially straight column • Concentric compression • Elastic Euler buckling • Not to scale</text>
</svg>