<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920">
  <defs>
    <marker id="loadArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b63b32" stroke="none"/>
    </marker>
    <marker id="reactionArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#246a48" stroke="none"/>
    </marker>
    <marker id="dimensionArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10" fill="none" stroke="#4b5563" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="920" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, sans-serif" fill="#202b36" stroke="none">
    <text x="40" y="45" font-size="25" font-weight="bold">Simply supported beam</text>
    <text x="40" y="73" font-size="15">Full-span uniformly distributed load • Span L = 8 m</text>
    <text x="500" y="108" text-anchor="middle" font-size="20" fill="#b63b32">w = 10 kN/m</text>
  </g>

  <!-- Uniformly distributed load -->
  <g stroke="#b63b32" stroke-width="2" fill="none">
    <line x1="180" y1="125" x2="820" y2="125"/>
    <g marker-end="url(#loadArrow)">
      <line x1="180" y1="125" x2="180" y2="219"/>
      <line x1="220" y1="125" x2="220" y2="219"/>
      <line x1="260" y1="125" x2="260" y2="219"/>
      <line x1="300" y1="125" x2="300" y2="219"/>
      <line x1="340" y1="125" x2="340" y2="219"/>
      <line x1="380" y1="125" x2="380" y2="219"/>
      <line x1="420" y1="125" x2="420" y2="219"/>
      <line x1="460" y1="125" x2="460" y2="219"/>
      <line x1="500" y1="125" x2="500" y2="219"/>
      <line x1="540" y1="125" x2="540" y2="219"/>
      <line x1="580" y1="125" x2="580" y2="219"/>
      <line x1="620" y1="125" x2="620" y2="219"/>
      <line x1="660" y1="125" x2="660" y2="219"/>
      <line x1="700" y1="125" x2="700" y2="219"/>
      <line x1="740" y1="125" x2="740" y2="219"/>
      <line x1="780" y1="125" x2="780" y2="219"/>
      <line x1="820" y1="125" x2="820" y2="219"/>
    </g>
  </g>

  <!-- Beam and supports: pin at A, roller at B -->
  <line x1="180" y1="230" x2="820" y2="230" stroke="#202b36" stroke-width="7" fill="none"/>
  <g stroke="#202b36" stroke-width="2">
    <polygon points="180,235 160,261 200,261" fill="#ffffff"/>
    <line x1="152" y1="267" x2="208" y2="267" fill="none"/>
    <path d="M 158 267 l -7 8 M 170 267 l -7 8 M 182 267 l -7 8 M 194 267 l -7 8 M 206 267 l -7 8" fill="none"/>
    <polygon points="820,235 800,255 840,255" fill="#ffffff"/>
    <circle cx="808" cy="261" r="5" fill="#ffffff"/>
    <circle cx="832" cy="261" r="5" fill="#ffffff"/>
    <line x1="792" y1="269" x2="848" y2="269" fill="none"/>
    <path d="M 798 269 l -7 8 M 810 269 l -7 8 M 822 269 l -7 8 M 834 269 l -7 8 M 846 269 l -7 8" fill="none"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#202b36" stroke="none">
    <text x="139" y="251">A</text>
    <text x="852" y="251">B</text>
  </g>

  <!-- Vertical reactions -->
  <g stroke="#246a48" stroke-width="2.5" fill="none" marker-end="url(#reactionArrow)">
    <line x1="180" y1="328" x2="180" y2="280"/>
    <line x1="820" y1="328" x2="820" y2="282"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#246a48" stroke="none">
    <text x="195" y="314">R_A = 40 kN ↑</text>
    <text x="805" y="314" text-anchor="end">R_B = 40 kN ↑</text>
  </g>

  <!-- Span dimension -->
  <g stroke="#4b5563" stroke-width="1.2" fill="none">
    <line x1="180" y1="337" x2="180" y2="368"/>
    <line x1="820" y1="337" x2="820" y2="368"/>
    <line x1="180" y1="352" x2="468" y2="352" marker-start="url(#dimensionArrow)"/>
    <line x1="532" y1="352" x2="820" y2="352" marker-end="url(#dimensionArrow)"/>
  </g>
  <text x="500" y="358" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#202b36" stroke="none">8 m</text>

  <!-- Shared alignment guides -->
  <g stroke="#c4ccd3" stroke-width="1" stroke-dasharray="5 6" fill="none">
    <line x1="180" y1="413" x2="180" y2="858"/>
    <line x1="500" y1="413" x2="500" y2="858"/>
    <line x1="820" y1="413" x2="820" y2="858"/>
  </g>

  <!-- Shear force diagram: V(x) = 40 - 10x -->
  <g font-family="Arial, sans-serif" fill="#202b36" stroke="none">
    <text x="40" y="401" font-size="17" font-weight="bold">SHEAR FORCE DIAGRAM</text>
    <text x="820" y="401" font-size="15" text-anchor="end">Maximum |V| = 40 kN at the supports</text>
  </g>
  <polygon points="180,510 180,430 500,510" fill="#dcecf7" stroke="none"/>
  <polygon points="500,510 820,590 820,510" fill="#e8eef3" stroke="none"/>
  <line x1="160" y1="510" x2="850" y2="510" stroke="#596675" stroke-width="1.4" fill="none"/>
  <path d="M 180 510 L 180 430 L 820 590 L 820 510" fill="none" stroke="#21618c" stroke-width="3"/>
  <circle cx="500" cy="510" r="3.5" fill="#21618c" stroke="none"/>
  <g font-family="Arial, sans-serif" font-size="16" stroke="none">
    <text x="165" y="436" text-anchor="end" fill="#21618c">+40 kN</text>
    <text x="835" y="596" fill="#21618c">−40 kN</text>
    <text x="147" y="516" text-anchor="end" fill="#596675">0</text>
    <text x="852" y="501" fill="#596675">x</text>
    <text x="515" y="492" fill="#21618c">V = 0 at x = 4 m</text>
    <text x="280" y="490" font-size="22" fill="#21618c">+</text>
    <text x="695" y="551" font-size="22" fill="#21618c">−</text>
    <text x="500" y="622" text-anchor="middle" fill="#596675">V(x) = 40 − 10x  [kN]</text>
  </g>

  <!-- Bending moment diagram: M(x) = 40x - 5x² -->
  <text x="40" y="656" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#202b36" stroke="none">BENDING MOMENT DIAGRAM</text>
  <path d="M 180 830 Q 500 590 820 830 Z" fill="#e1efe8" stroke="none"/>
  <line x1="160" y1="830" x2="850" y2="830" stroke="#596675" stroke-width="1.4" fill="none"/>
  <path d="M 180 830 Q 500 590 820 830" fill="none" stroke="#246a48" stroke-width="3"/>
  <line x1="500" y1="710" x2="500" y2="830" stroke="#246a48" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <circle cx="500" cy="710" r="4" fill="#246a48" stroke="none"/>
  <g font-family="Arial, sans-serif" stroke="none">
    <text x="500" y="676" font-size="19" font-weight="bold" text-anchor="middle" fill="#246a48">M_max = +80 kN·m</text>
    <text x="500" y="698" font-size="16" text-anchor="middle" fill="#246a48">at x = 4 m (midspan)</text>
    <text x="530" y="783" font-size="17" fill="#246a48">+ sagging</text>
    <text x="165" y="822" font-size="15" text-anchor="end" fill="#246a48">0</text>
    <text x="834" y="822" font-size="15" fill="#246a48">0</text>
    <text x="852" y="847" font-size="16" fill="#596675">x</text>
    <text x="180" y="862" font-size="16" text-anchor="middle" fill="#596675">0 m</text>
    <text x="500" y="862" font-size="16" text-anchor="middle" fill="#596675">4 m</text>
    <text x="820" y="862" font-size="16" text-anchor="middle" fill="#596675">8 m</text>
    <text x="500" y="895" font-size="16" text-anchor="middle" fill="#596675">M(x) = 40x − 5x²  [kN·m]   •   x measured from A in metres</text>
  </g>
</svg>