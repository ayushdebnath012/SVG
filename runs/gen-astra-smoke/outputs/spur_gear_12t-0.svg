    fill="#f4f4f4" stroke="#111111" stroke-width="0.85" stroke-linejoin="round"/>

  <circle cx="0" cy="0" r="60" fill="none" stroke="#356078" stroke-width="0.5" stroke-dasharray="4 2"/>

  <!-- Bore and integral 6 mm-wide keyway. -->
  <path d="M -3 -9.539392 A 10 10 0 1 0 3 -9.539392 L 3 -13.3 L -3 -13.3 Z"
        fill="#ffffff" stroke="#111111" stroke-width="0.75"/>

  <g fill="none" stroke="#777777" stroke-width="0.3" stroke-dasharray="8 2 1 2">
    <line x1="-76" y1="0" x2="76" y2="0"/>
    <line x1="0" y1="-76" x2="0" y2="76"/>
  </g>

  <!-- Pitch diameter: extensions originate at pitch-circle extrema. -->
  <g fill="none" stroke="#333333" stroke-width="0.35">
    <line x1="-60" y1="0" x2="-60" y2="-87"/>
    <line x1="60" y1="0" x2="60" y2="-87"/>
    <line x1="-60" y1="-82" x2="60" y2="-82" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="0" y="-85" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#111111">Ø120 PITCH</text>

  <!-- Bore diameter, measured across the horizontal bore axis. -->
  <g fill="none" stroke="#333333" stroke-width="0.35">
    <line x1="-10" y1="3" x2="-10" y2="28"/>
    <line x1="10" y1="3" x2="10" y2="28"/>
    <line x1="-10" y1="24" x2="10" y2="24" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="0" y="33" text-anchor="middle" font-family="sans-serif" font-size="4.2" fill="#111111">Ø20 BORE</text>

  <polyline points="3,-12 19,-26 38,-26" fill="none" stroke="#333333" stroke-width="0.35" marker-start="url(#arrow)"/>
  <text x="19" y="-29" font-family="sans-serif" font-size="4" fill="#111111">6 KEYWAY</text>

  <text x="0" y="85" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#111111">12 EQUALLY SPACED TEETH · 30°</text>
  <text x="0" y="94" text-anchor="middle" font-family="sans-serif" font-size="3.8" fill="#444444">Simplified trapezoidal tooth profile · Module 10</text>
  <text x="0" y="103" text-anchor="middle" font-family="sans-serif" font-size="3.8" fill="#444444">All dimensions in mm · Dashed circle = pitch circle</text>
</svg>