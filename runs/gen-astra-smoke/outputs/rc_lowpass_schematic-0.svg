<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17212b">First-Order RC Low-Pass Filter</text>

  <g fill="none" stroke="#17212b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input source and series signal path -->
    <line x1="140" y1="202" x2="140" y2="150"/>
    <line x1="140" y1="150" x2="270" y2="150"/>
    <polyline points="270,150 280,150 290,135 310,165 330,135 350,165 370,135 390,165 400,150 410,150"/>
    <line x1="410" y1="150" x2="695" y2="150"/>

    <!-- Independent voltage source -->
    <circle cx="140" cy="240" r="38"/>
    <line x1="132" y1="223" x2="148" y2="223"/>
    <line x1="140" y1="215" x2="140" y2="231"/>
    <line x1="132" y1="256" x2="148" y2="256"/>
    <line x1="140" y1="278" x2="140" y2="340"/>

    <!-- Shunt capacitor -->
    <line x1="525" y1="150" x2="525" y2="227"/>
    <line x1="495" y1="227" x2="555" y2="227"/>
    <line x1="495" y1="245" x2="555" y2="245"/>
    <line x1="525" y1="245" x2="525" y2="340"/>

    <!-- Common return -->
    <line x1="140" y1="340" x2="525" y2="340"/>
    <line x1="525" y1="340" x2="525" y2="365"/>

    <!-- Ground symbol -->
    <line x1="504" y1="365" x2="546" y2="365"/>
    <line x1="511" y1="374" x2="539" y2="374"/>
    <line x1="518" y1="383" x2="532" y2="383"/>
  </g>

  <g fill="#17212b" stroke="#17212b" stroke-width="1">
    <circle cx="525" cy="150" r="4.5"/>
    <circle cx="525" cy="340" r="4.5"/>
    <circle cx="695" cy="150" r="4"/>
  </g>

  <g fill="#17212b" font-family="Arial, sans-serif" font-size="20">
    <text x="80" y="246" text-anchor="end">Vin</text>
    <text x="340" y="92" text-anchor="middle">R1</text>
    <text x="340" y="118" text-anchor="middle">10 kΩ</text>
    <text x="578" y="231">C1</text>
    <text x="578" y="258">100 nF</text>
    <text x="695" y="124" text-anchor="middle">Vout</text>
    <text x="525" y="411" text-anchor="middle" font-size="16">GND</text>
  </g>
</svg>