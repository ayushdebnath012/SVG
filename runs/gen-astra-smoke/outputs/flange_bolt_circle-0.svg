<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 670">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 10,4 L 0,8 Z" fill="#111111" stroke="#111111" stroke-width="0.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="670" fill="#ffffff"/>

  <text x="410" y="48" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#111111">CIRCULAR PIPE FLANGE — TOP VIEW</text>

  <!-- Geometry at 2 drawing units per millimetre. -->
  <g fill="none" stroke="#111111" stroke-width="2.2">
    <circle cx="350" cy="350" r="200"/>
    <circle cx="350" cy="350" r="100"/>

    <circle cx="510" cy="350" r="18"/>
    <circle cx="463.137" cy="236.863" r="18"/>
    <circle cx="350" cy="190" r="18"/>
    <circle cx="236.863" cy="236.863" r="18"/>
    <circle cx="190" cy="350" r="18"/>
    <circle cx="236.863" cy="463.137" r="18"/>
    <circle cx="350" cy="510" r="18"/>
    <circle cx="463.137" cy="463.137" r="18"/>
  </g>

  <!-- Pitch circle and orthogonal centerlines. -->
  <g fill="none" stroke="#536575" stroke-width="1" stroke-dasharray="18 5 3 5">
    <circle cx="350" cy="350" r="160"/>
    <line x1="120" y1="350" x2="580" y2="350"/>
    <line x1="350" y1="120" x2="350" y2="580"/>
  </g>

  <!-- Hole center marks on diagonal holes. -->
  <g fill="none" stroke="#536575" stroke-width="0.9">
    <path d="M 437.137,236.863 H 489.137 M 463.137,210.863 V 262.863"/>
    <path d="M 210.863,236.863 H 262.863 M 236.863,210.863 V 262.863"/>
    <path d="M 210.863,463.137 H 262.863 M 236.863,437.137 V 489.137"/>
    <path d="M 437.137,463.137 H 489.137 M 463.137,437.137 V 489.137"/>
  </g>

  <!-- Dimension leaders terminate on the specified circular features. -->
  <g fill="none" stroke="#111111" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#arrow)">
    <polyline points="65,140 155,140 208.579,208.579"/>
    <polyline points="65,535 160,535 279.289,420.711"/>
    <polyline points="735,125 560,125 430,211.436"/>
    <polyline points="755,205 605,205 475.865,224.135"/>
  </g>

  <g font-family="sans-serif" font-size="19" fill="#111111">
    <text x="65" y="130">⌀200 OD</text>
    <text x="65" y="525">⌀100 BORE</text>
    <text x="565" y="115">⌀160 PCD</text>
    <text x="605" y="195">8 × ⌀18 THRU</text>
    <text x="605" y="233" font-size="15">EQUALLY SPACED</text>
  </g>

  <text x="410" y="622" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111111">ALL DIMENSIONS IN mm</text>
</svg>