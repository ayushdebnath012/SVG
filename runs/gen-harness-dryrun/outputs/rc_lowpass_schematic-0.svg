<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>

  <text x="320" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#000000">First-Order RC Low-Pass Filter</text>

  <!-- Wires: input, resistor zigzag, output, capacitor branch, source return -->
  <g stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="114,160 152,160 160,142 176,178 192,142 208,178 224,142 240,178 248,160 340,160"/>
    <line x1="340" y1="160" x2="520" y2="160"/>
    <line x1="340" y1="160" x2="340" y2="228"/>
    <line x1="340" y1="240" x2="340" y2="268"/>
    <line x1="90" y1="184" x2="90" y2="268"/>
  </g>

  <!-- Capacitor plates -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round">
    <line x1="316" y1="228" x2="364" y2="228"/>
    <line x1="316" y1="240" x2="364" y2="240"/>
  </g>

  <!-- Ground symbols -->
  <g stroke="#000000" stroke-width="2" stroke-linecap="round">
    <line x1="72" y1="268" x2="108" y2="268"/>
    <line x1="78" y1="276" x2="102" y2="276"/>
    <line x1="84" y1="284" x2="96" y2="284"/>
    <line x1="322" y1="268" x2="358" y2="268"/>
    <line x1="328" y1="276" x2="352" y2="276"/>
    <line x1="334" y1="284" x2="346" y2="284"/>
  </g>

  <!-- Voltage source -->
  <circle cx="90" cy="160" r="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g stroke="#000000" stroke-width="2" stroke-linecap="round">
    <line x1="83" y1="150" x2="97" y2="150"/>
    <line x1="90" y1="143" x2="90" y2="157"/>
    <line x1="83" y1="172" x2="97" y2="172"/>
  </g>

  <!-- Junction dot at R1 / C1 / Vout node -->
  <circle cx="340" cy="160" r="4.5" fill="#000000"/>

  <!-- Output terminal -->
  <circle cx="520" cy="160" r="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#000000">
    <text x="58" y="166" text-anchor="end">Vin</text>
    <text x="200" y="116" text-anchor="middle">R1</text>
    <text x="200" y="134" text-anchor="middle">10 kΩ</text>
    <text x="378" y="230">C1</text>
    <text x="378" y="248">100 nF</text>
    <text x="520" y="138" text-anchor="middle">Vout</text>
  </g>
</svg>