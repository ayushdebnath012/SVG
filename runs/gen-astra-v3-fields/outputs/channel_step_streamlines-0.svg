  <!-- Impermeable walls and open inlet/outlet sections. -->
  <path d="M50 400 H950 M50 700 H500 V550 H950" fill="none" stroke="#25313c" stroke-width="3.5" stroke-linejoin="miter"/>
  <line x1="50" y1="400" x2="50" y2="700" stroke="#788793" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="950" y1="400" x2="950" y2="550" stroke="#788793" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="500" y="382" text-anchor="middle" fill="#25313c" font-family="sans-serif" font-size="18">Top wall: ψ = 1</text>
  <text x="90" y="725" fill="#25313c" font-family="sans-serif" font-size="17">Bottom wall: ψ = 0</text>

  <text x="725" y="615" text-anchor="middle" fill="#25313c" font-family="sans-serif" font-size="23" font-weight="600">SOLID BLOCK</text>
  <text x="725" y="646" text-anchor="middle" fill="#25313c" font-family="sans-serif" font-size="18">Impermeable boundary: ψ = 0</text>

  <text x="806" y="513" fill="#176a96" font-family="sans-serif" font-size="16">ψ = 0.2</text>
  <text x="806" y="483" fill="#176a96" font-family="sans-serif" font-size="16">ψ = 0.4</text>
