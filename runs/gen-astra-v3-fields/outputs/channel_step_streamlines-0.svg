  <text x="500" y="270" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="18">Flow direction</text>
  <line x1="410" y1="292" x2="590" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

