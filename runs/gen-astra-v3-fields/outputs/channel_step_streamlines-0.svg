  <rect x="706" y="758" width="38" height="24" fill="#ffffff"/>
  <text x="275" y="776" text-anchor="middle" fill="#52616f" font-family="sans-serif" font-size="17">1.5</text>
  <text x="725" y="776" text-anchor="middle" fill="#52616f" font-family="sans-serif" font-size="17">1.5</text>
  <text x="50" y="813" text-anchor="middle" fill="#52616f" font-family="sans-serif" font-size="16">0</text>
  <text x="500" y="813" text-anchor="middle" fill="#52616f" font-family="sans-serif" font-size="16">1.5</text>
  <text x="950" y="813" text-anchor="middle" fill="#52616f" font-family="sans-serif" font-size="16">3</text>

  <text x="50" y="866" fill="#334155" font-family="sans-serif" font-size="18">Inlet: ψ = y</text>
  <text x="500" y="866" fill="#334155" font-family="sans-serif" font-size="18">Outlet: ψ = 2(y − 0.5)</text>
  <text x="50" y="902" fill="#52616f" font-family="sans-serif" font-size="16">Equal stream-function increments Δψ = 0.2; streamline crowding indicates acceleration.</text>
  <text x="50" y="932" fill="#52616f" font-family="sans-serif" font-size="16">Coordinates: X = 50 + 300x, Y = 700 − 300y. Dimensions are in channel-coordinate units.</text>
</svg>