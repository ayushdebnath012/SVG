         C 106.667 316.389 53.333 318.608 0 318.608
         C -53.333 318.608 -106.667 316.389 -160 305.102
         C -192.921 298.134 -225.842 291.684 -258.763 258.763
         C -291.684 225.842 -298.134 192.921 -305.102 160
         C -316.389 106.667 -318.608 53.333 -318.608 0
         C -318.608 -53.333 -316.389 -106.667 -305.102 -160
         C -298.134 -192.921 -291.684 -225.842 -258.763 -258.763
         C -225.842 -291.684 -192.921 -298.134 -160 -305.102
         C -106.667 -316.389 -53.333 -318.608 0 -318.608 Z"
      fill="none" stroke="#26788f" stroke-width="2.5"/>

    <path data-level="60" transform="translate(500 500)"
      d="M 0 -264.374
         C 42.667 -264.374 85.333 -260.838 128 -247.604
         C 153.409 -239.723 178.817 -229.635 204.226 -204.226
         C 229.635 -178.817 239.723 -153.409 247.604 -128
         C 260.838 -85.333 264.374 -42.667 264.374 0
