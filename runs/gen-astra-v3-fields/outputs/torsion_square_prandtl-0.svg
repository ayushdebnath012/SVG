         C -123.023 -158.047 -105.512 -167.505 -88 -174.532
         C -58.667 -186.304 -29.333 -190.330 0 -190.330 Z"
      fill="none" stroke="#183f66" stroke-width="2.5"/>

    <text x="500" y="130" text-anchor="middle" font-size="17" fill="#438da8">20%</text>
    <text x="500" y="174" text-anchor="middle" font-size="17" fill="#26788f">40%</text>
    <text x="500" y="228" text-anchor="middle" font-size="17" fill="#155c78">60%</text>
    <text x="500" y="302" text-anchor="middle" font-size="17" fill="#183f66">80%</text>

    <!-- Maximum stress-function value and zero shear at the centre. -->
    <text x="500" y="467" text-anchor="middle" font-size="22" font-weight="bold" fill="#17212b">φmax ≈ 0.147343</text>
    <line x1="488" y1="500" x2="512" y2="500" stroke="#244d91" stroke-width="1.5"/>
    <line x1="500" y1="488" x2="500" y2="512" stroke="#244d91" stroke-width="1.5"/>
    <circle cx="500" cy="500" r="5" fill="#ffffff" stroke="#244d91" stroke-width="2.5"/>
    <text x="500" y="537" text-anchor="middle" font-size="19" fill="#244d91">τ = 0</text>
    <text x="500" y="562" text-anchor="middle" font-size="16" fill="#536170">(x, y) = (½, ½)</text>

    <!-- Greatest shear occurs at all four side midpoints. -->
    <circle cx="500" cy="100" r="6" fill="#c44932" stroke="#c44932" stroke-width="2"/>
    <circle cx="900" cy="500" r="6" fill="#c44932" stroke="#c44932" stroke-width="2"/>
    <circle cx="500" cy="900" r="6" fill="#c44932" stroke="#c44932" stroke-width="2"/>
    <circle cx="100" cy="500" r="6" fill="#c44932" stroke="#c44932" stroke-width="2"/>
    <text x="500" y="885" text-anchor="middle" font-size="17" fill="#c44932">max |τ|</text>
    <text x="939" y="500" transform="rotate(-90 939 500)" text-anchor="middle" font-size="19" fill="#c44932">max |τ| / (Gθa) ≈ 0.675314</text>
    <text x="964" y="500" transform="rotate(-90 964 500)" text-anchor="middle" font-size="16" fill="#c44932">at the four side midpoints</text>

    <!-- Zero shear at the four corners. -->
    <circle cx="100" cy="100" r="5.5" fill="#ffffff" stroke="#244d91" stroke-width="2.5"/>
    <circle cx="900" cy="100" r="5.5" fill="#ffffff" stroke="#244d91" stroke-width="2.5"/>
    <circle cx="900" cy="900" r="5.5" fill="#ffffff" stroke="#244d91" stroke-width="2.5"/>
    <circle cx="100" cy="900" r="5.5" fill="#ffffff" stroke="#244d91" stroke-width="2.5"/>
    <path d="M 105 894 L 119 876 L 132 876" fill="none" stroke="#244d91" stroke-width="1.3"/>
    <text x="139" y="882" font-size="17" fill="#244d91">τ = 0 at all corners</text>

    <!-- Side dimension. -->
    <line x1="45" y1="100" x2="88" y2="100" stroke="#374151" stroke-width="1.2"/>
    <line x1="45" y1="900" x2="88" y2="900" stroke="#374151" stroke-width="1.2"/>
    <line x1="57" y1="102" x2="57" y2="898" stroke="#374151" stroke-width="1.2" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <text x="38" y="500" transform="rotate(-90 38 500)" text-anchor="middle" font-size="21" fill="#17212b">a = 1</text>

    <text x="500" y="933" text-anchor="middle" font-size="16" fill="#536170">Contours: φ / φmax  ·  Shear magnitude: |τ| = |∇φ|</text>
    <text x="500" y="964" text-anchor="middle" font-size="23" font-weight="bold" fill="#17212b">Square torsion constant: J/a⁴ ≈ 0.140577</text>
    <text x="500" y="989" text-anchor="middle" font-size="15" fill="#536170">J = 2∫∫ φ dA for Gθ = 1</text>
  </g>
</svg>