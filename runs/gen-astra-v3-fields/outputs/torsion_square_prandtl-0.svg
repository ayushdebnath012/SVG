<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <marker id="dimension-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 4 L 0 8 Z" fill="#374151" stroke="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="500" y="32" text-anchor="middle" font-size="25" font-weight="bold" fill="#17212b">Saint-Venant torsion — solid square shaft</text>
    <text x="500" y="59" text-anchor="middle" font-size="18" fill="#374151">∇²φ = −2  ·  a = 1  ·  Gθ = 1</text>
    <text x="500" y="85" text-anchor="middle" font-size="17" fill="#374151">φ = 0 on all four sides</text>

    <!-- Section: X = 100 + 800x; Y = 900 - 800y. -->
    <rect x="100" y="100" width="800" height="800" fill="#ffffff" stroke="#17212b" stroke-width="3"/>

    <!-- Closed, positive-value contours, wholly inside the zero-value boundary. -->
    <path data-level="20" transform="translate(500 500)"
      d="M 0 -362.564
         C 66.667 -362.564 133.333 -361.738 200 -353.557
         C 221.333 -350.939 242.667 -347.604 264 -340.945
         C 280.455 -335.809 296.911 -329.821 313.366 -313.366
         C 329.821 -296.911 335.809 -280.455 340.945 -264
         C 347.604 -242.667 350.939 -221.333 353.557 -200
         C 361.738 -133.333 362.564 -66.667 362.564 0
         C 362.564 66.667 361.738 133.333 353.557 200
         C 350.939 221.333 347.604 242.667 340.945 264
         C 335.809 280.455 329.821 296.911 313.366 313.366
         C 296.911 329.821 280.455 335.809 264 340.945
         C 242.667 347.604 221.333 350.939 200 353.557
         C 133.333 361.738 66.667 362.564 0 362.564
         C -66.667 362.564 -133.333 361.738 -200 353.557
         C -221.333 350.939 -242.667 347.604 -264 340.945
         C -280.455 335.809 -296.911 329.821 -313.366 313.366
         C -329.821 296.911 -335.809 280.455 -340.945 264
         C -347.604 242.667 -350.939 221.333 -353.557 200
         C -361.738 133.333 -362.564 66.667 -362.564 0
         C -362.564 -66.667 -361.738 -133.333 -353.557 -200
         C -350.939 -221.333 -347.604 -242.667 -340.945 -264
         C -335.809 -280.455 -329.821 -296.911 -313.366 -313.366
         C -296.911 -329.821 -280.455 -335.809 -264 -340.945
         C -242.667 -347.604 -221.333 -350.939 -200 -353.557
         C -133.333 -361.738 -66.667 -362.564 0 -362.564 Z"
      fill="none" stroke="#438da8" stroke-width="2.5"/>

    <path data-level="40" transform="translate(500 500)"
      d="M 0 -318.608
         C 53.333 -318.608 106.667 -316.389 160 -305.102
         C 192.921 -298.134 225.842 -291.684 258.763 -258.763
         C 291.684 -225.842 298.134 -192.921 305.102 -160
         C 316.389 -106.667 318.608 -53.333 318.608 0
         C 318.608 53.333 316.389 106.667 305.102 160
         C 298.134 192.921 291.684 225.842 258.763 258.763
