         C -178.817 -229.635 -153.409 -239.723 -128 -247.604
         C -85.333 -260.838 -42.667 -264.374 0 -264.374 Z"
      fill="none" stroke="#155c78" stroke-width="2.5"/>

    <path data-level="80" transform="translate(500 500)"
      d="M 0 -190.330
         C 29.333 -190.330 58.667 -186.304 88 -174.532
         C 105.512 -167.505 123.023 -158.047 140.535 -140.535
         C 158.047 -123.023 167.505 -105.512 174.532 -88
         C 186.304 -58.667 190.330 -29.333 190.330 0
