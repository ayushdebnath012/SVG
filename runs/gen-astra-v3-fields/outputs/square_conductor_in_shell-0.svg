<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 8,4 L 0,0 L 0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff"/>

  <text x="500" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#172a3a">Grounded circular shell · 0 V</text>
  <line x1="500" y1="70" x2="500" y2="100" stroke="#475569" stroke-width="1.5"/>

  <!-- Boundary: x² + y² = 1; X = 500 + 400x, Y = 500 - 400y. -->
  <path data-level="0"
        d="M 900,500 A 400,400 0 1 0 100,500 A 400,400 0 1 0 900,500 Z"
        fill="#f8fbfd" stroke="#172a3a" stroke-width="3"/>

  <!-- Smooth approximations of the square-in-circle Laplace level sets. -->
  <path data-level="20"
        d="M 500,176.6
           C 588.1,176.6 671.4,209.6 730.9,269.1
           C 790.4,328.6 823.4,411.9 823.4,500
           C 823.4,588.1 790.4,671.4 730.9,730.9
           C 671.4,790.4 588.1,823.4 500,823.4
           C 411.9,823.4 328.6,790.4 269.1,730.9
           C 209.6,671.4 176.6,588.1 176.6,500
           C 176.6,411.9 209.6,328.6 269.1,269.1
           C 328.6,209.6 411.9,176.6 500,176.6 Z"
        fill="none" stroke="#377fa8" stroke-width="2.5"/>

  <path data-level="40"
        d="M 500,239.4
           C 573.1,239.4 642.2,263.8 689.2,310.8
           C 736.2,357.8 760.6,426.9 760.6,500
           C 760.6,573.1 736.2,642.2 689.2,689.2
           C 642.2,736.2 573.1,760.6 500,760.6
           C 426.9,760.6 357.8,736.2 310.8,689.2
           C 263.8,642.2 239.4,573.1 239.4,500
           C 239.4,426.9 263.8,357.8 310.8,310.8
           C 357.8,263.8 426.9,239.4 500,239.4 Z"
        fill="none" stroke="#286d99" stroke-width="2.5"/>

  <path data-level="60"
        d="M 500,292.1
           C 562,292.1 621.3,308.1 656.6,343.4
           C 691.9,378.7 707.9,438 707.9,500
           C 707.9,562 691.9,621.3 656.6,656.6
           C 621.3,691.9 562,707.9 500,707.9
           C 438,707.9 378.7,691.9 343.4,656.6
           C 308.1,621.3 292.1,562 292.1,500
           C 292.1,438 308.1,378.7 343.4,343.4
           C 378.7,308.1 438,292.1 500,292.1 Z"
        fill="none" stroke="#205b88" stroke-width="2.5"/>

  <path data-level="80"
        d="M 500,337.8
           C 553.4,337.8 610.7,345.3 632.7,367.3
           C 654.7,389.3 662.2,446.6 662.2,500
           C 662.2,553.4 654.7,610.7 632.7,632.7
           C 610.7,654.7 553.4,662.2 500,662.2
           C 446.6,662.2 389.3,654.7 367.3,632.7
           C 345.3,610.7 337.8,553.4 337.8,500
           C 337.8,446.6 345.3,389.3 367.3,367.3
           C 389.3,345.3 446.6,337.8 500,337.8 Z"
        fill="none" stroke="#174775" stroke-width="2.5"/>

  <text x="500" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#377fa8">20 V</text>
  <text x="500" y="228" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#286d99">40 V</text>
  <text x="500" y="281" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#205b88">60 V</text>
  <text x="500" y="327" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#174775">80 V</text>

  <!-- Exact square boundary: [-0.3,0.3] × [-0.3,0.3]. -->
  <path data-level="100"
        d="M 380,380 H 620 V 620 H 380 Z"
        fill="#f0e6dc" stroke="#854b2b" stroke-width="3"/>
  <text x="500" y="460" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#65391f">Square conductor</text>
  <text x="500" y="501" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#65391f">100 V</text>
  <text x="500" y="531" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#65391f">centre (0, 0)</text>

  <!-- Side dimension, measured between the exact square faces. -->
  <line x1="380" y1="567" x2="380" y2="603" stroke="#475569" stroke-width="1.3"/>
  <line x1="620" y1="567" x2="620" y2="603" stroke="#475569" stroke-width="1.3"/>
  <line x1="385" y1="592" x2="615" y2="592" stroke="#475569" stroke-width="1.3"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="500" y="583" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">0.6</text>

  <path d="M 782.843,782.843 L 824,820 H 892"
        fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="782.843" cy="782.843" r="3" fill="#475569"/>
  <text x="854" y="809" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#172a3a">R = 1</text>

  <text x="500" y="949" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#172a3a">2-D Laplace equipotentials</text>
  <text x="500" y="979" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">∇²V = 0 in the gap · contour interval 20 V</text>
</svg>