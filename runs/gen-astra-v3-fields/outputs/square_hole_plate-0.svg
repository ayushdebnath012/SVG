<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#202830">Steady two-dimensional heat conduction</text>
  <text x="500" y="63" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#46515b">∇²T = 0 · Unit square plate with concentric square hole</text>
  <text x="500" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#202830">Outer boundary: T = 0 °C</text>

  <!-- Plate: X = 100 + 800x; Y = 900 - 800y. -->
  <rect x="100" y="100" width="800" height="800" fill="#ffffff" stroke="#202830" stroke-width="3"/>

  <!-- Each closed isotherm is a separate, explicitly level-tagged path. -->
  <path data-level="20"
        d="M 500,190.45
           C 576,190.45 672.35,206.13 733.11,266.89
           C 793.87,327.65 809.55,424 809.55,500
           C 809.55,576 793.87,672.35 733.11,733.11
           C 672.35,793.87 576,809.55 500,809.55
           C 424,809.55 327.65,793.87 266.89,733.11
           C 206.13,672.35 190.45,576 190.45,500
           C 190.45,424 206.13,327.65 266.89,266.89
           C 327.65,206.13 424,190.45 500,190.45 Z"
        fill="none" stroke="#2166ac" stroke-width="2.6"/>

  <path data-level="40"
        d="M 500,268.04
           C 561.94,268.04 624.26,287.48 668.39,331.61
           C 712.52,375.74 731.96,438.06 731.96,500
           C 731.96,561.94 712.52,624.26 668.39,668.39
           C 624.26,712.52 561.94,731.96 500,731.96
           C 438.06,731.96 375.74,712.52 331.61,668.39
           C 287.48,624.26 268.04,561.94 268.04,500
           C 268.04,438.06 287.48,375.74 331.61,331.61
           C 375.74,287.48 438.06,268.04 500,268.04 Z"
        fill="none" stroke="#187b83" stroke-width="2.6"/>

  <path data-level="60"
        d="M 500,329.56
           C 547.89,329.56 593.73,344.23 624.75,375.25
           C 655.77,406.27 670.44,452.11 670.44,500
           C 670.44,547.89 655.77,593.73 624.75,624.75
           C 593.73,655.77 547.89,670.44 500,670.44
           C 452.11,670.44 406.27,655.77 375.25,624.75
           C 344.23,593.73 329.56,547.89 329.56,500
           C 329.56,452.11 344.23,406.27 375.25,375.25
           C 406.27,344.23 452.11,329.56 500,329.56 Z"
        fill="none" stroke="#aa7010" stroke-width="2.6"/>

  <path data-level="80"
        d="M 500,378.28
           C 538.18,378.28 576.04,385.68 595.18,404.82
           C 614.32,423.96 621.72,461.82 621.72,500
           C 621.72,538.18 614.32,576.04 595.18,595.18
           C 576.04,614.32 538.18,621.72 500,621.72
           C 461.82,621.72 423.96,614.32 404.82,595.18
           C 385.68,576.04 378.28,538.18 378.28,500
           C 378.28,461.82 385.68,423.96 404.82,404.82
           C 423.96,385.68 461.82,378.28 500,378.28 Z"
        fill="none" stroke="#b73b36" stroke-width="2.6"/>

  <!-- Hole: [0.4,0.6] × [0.4,0.6], excluded from the conducting plate. -->
  <rect x="420" y="420" width="160" height="160" fill="#f0f1f3" stroke="#202830" stroke-width="3"/>
  <text x="500" y="467" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#202830">Square hole</text>
  <text x="500" y="495" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#202830">Boundary:</text>
  <text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b73b36">T = 100 °C</text>
  <text x="500" y="549" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#46515b">0.2 × 0.2</text>

  <!-- Inline contour labels. -->
  <text x="500" y="197" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2166ac" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">20 °C</text>
  <text x="500" y="275" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#187b83" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">40 °C</text>
  <text x="500" y="336" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#aa7010" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">60 °C</text>
  <text x="500" y="385" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#b73b36" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">80 °C</text>

  <!-- Overall dimensions, in plate-coordinate units. -->
  <line x1="100" y1="908" x2="100" y2="964" stroke="#69737c" stroke-width="1.2"/>
  <line x1="900" y1="908" x2="900" y2="964" stroke="#69737c" stroke-width="1.2"/>
  <line x1="100" y1="950" x2="464" y2="950" stroke="#46515b" stroke-width="1.4"/>
  <line x1="536" y1="950" x2="900" y2="950" stroke="#46515b" stroke-width="1.4"/>
  <path d="M 100,950 L 112,945 L 112,955 Z M 900,950 L 888,945 L 888,955 Z" fill="#46515b"/>
  <text x="500" y="957" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#202830">1.0</text>
  <text x="113" y="927" font-family="sans-serif" font-size="15" fill="#46515b">x = 0</text>
  <text x="887" y="927" text-anchor="end" font-family="sans-serif" font-size="15" fill="#46515b">x = 1</text>

  <line x1="92" y1="100" x2="36" y2="100" stroke="#69737c" stroke-width="1.2"/>
  <line x1="92" y1="900" x2="36" y2="900" stroke="#69737c" stroke-width="1.2"/>
  <line x1="50" y1="100" x2="50" y2="464" stroke="#46515b" stroke-width="1.4"/>
  <line x1="50" y1="536" x2="50" y2="900" stroke="#46515b" stroke-width="1.4"/>
  <path d="M 50,100 L 45,112 L 55,112 Z M 50,900 L 45,888 L 55,888 Z" fill="#46515b"/>
  <text x="50" y="500" text-anchor="middle" transform="rotate(-90 50 500)" font-family="sans-serif" font-size="19" fill="#202830">1.0</text>

  <text x="500" y="988" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#46515b">Hole extent: 0.4 ≤ x ≤ 0.6, 0.4 ≤ y ≤ 0.6 · Dimensions in plate-coordinate units</text>
</svg>