<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="0" viewBox="-10 -4 10 8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L -10,-3.5 L -10,3.5 Z" fill="#111111" stroke="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="650" fill="#ffffff" stroke="none"/>

  <g fill="#111111" stroke="none" font-family="sans-serif">
    <text x="340" y="48" text-anchor="middle" font-size="24">CIRCULAR PIPE FLANGE</text>
    <text x="340" y="76" text-anchor="middle" font-size="15">TOP VIEW — ALL DIMENSIONS IN mm</text>
  </g>

  <!-- Flange outlines; drawing scale: 2 SVG units per mm. -->
  <g fill="none" stroke="#111111" stroke-width="2.4">
    <circle cx="340" cy="330" r="200"/>
    <circle cx="340" cy="330" r="100"/>
  </g>

  <!-- Pitch circle and orthogonal centerlines. -->
  <g fill="none" stroke="#526778" stroke-width="1.1" stroke-dasharray="18 5 3 5">
    <circle cx="340" cy="330" r="160"/>
    <line x1="110" y1="330" x2="570" y2="330"/>
    <line x1="340" y1="100" x2="340" y2="560"/>
  </g>

  <!-- Eight equally spaced Ø18 holes on Ø160 PCD. -->
  <g fill="#ffffff" stroke="#111111" stroke-width="2">
    <circle cx="500" cy="330" r="18"/>
    <circle cx="453.137085" cy="216.862915" r="18"/>
    <circle cx="340" cy="170" r="18"/>
    <circle cx="226.862915" cy="216.862915" r="18"/>
    <circle cx="180" cy="330" r="18"/>
    <circle cx="226.862915" cy="443.137085" r="18"/>
    <circle cx="340" cy="490" r="18"/>
    <circle cx="453.137085" cy="443.137085" r="18"/>
  </g>

  <!-- Hole center marks. -->
  <g fill="none" stroke="#526778" stroke-width="0.9">
    <path d="M 493,330 H 507 M 500,323 V 337"/>
    <path d="M 446.137085,216.862915 H 460.137085 M 453.137085,209.862915 V 223.862915"/>
    <path d="M 333,170 H 347 M 340,163 V 177"/>
    <path d="M 219.862915,216.862915 H 233.862915 M 226.862915,209.862915 V 223.862915"/>
    <path d="M 173,330 H 187 M 180,323 V 337"/>
    <path d="M 219.862915,443.137085 H 233.862915 M 226.862915,436.137085 V 450.137085"/>
    <path d="M 333,490 H 347 M 340,483 V 497"/>
    <path d="M 446.137085,443.137085 H 460.137085 M 453.137085,436.137085 V 450.137085"/>
  </g>

  <!-- Dimension leaders terminate exactly on the referenced geometry. -->
  <g fill="none" stroke="#111111" stroke-width="1.3">
    <polyline points="465.865007,204.134993 585,112 650,112" marker-start="url(#arrow)"/>
    <polyline points="513.205081,230 595,205 650,205" marker-start="url(#arrow)"/>
    <polyline points="435.105652,299.098301 585,280 650,280" marker-start="url(#arrow)"/>
    <polyline points="478.564065,410 585,465 650,465" marker-start="url(#arrow)"/>
  </g>

  <g fill="#111111" stroke="none" font-family="sans-serif" font-size="20">
    <text x="662" y="118">8 × Ø18 HOLES</text>
    <text x="662" y="143" font-size="14">EQUALLY SPACED</text>
    <text x="662" y="211">Ø200 OD</text>
    <text x="662" y="286">Ø100 BORE</text>
    <text x="662" y="471">Ø160 PCD</text>
  </g>

  <text x="340" y="606" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526778" stroke="none">Dash-dot lines indicate flange axes and bolt pitch circle</text>
</svg>