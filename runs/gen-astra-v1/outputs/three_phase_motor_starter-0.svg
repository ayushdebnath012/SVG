<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080">
  <rect x="0" y="0" width="800" height="1080" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, sans-serif" fill="#111111" stroke="none">
    <text x="400" y="38" text-anchor="middle" font-size="23" font-weight="bold">THREE-PHASE DIRECT-ON-LINE STARTER</text>
    <text x="400" y="64" text-anchor="middle" font-size="14">Power circuit · IEC symbols · contacts shown open</text>
    <text x="340" y="105" text-anchor="middle" font-size="20">L1</text>
    <text x="440" y="105" text-anchor="middle" font-size="20">L2</text>
    <text x="540" y="105" text-anchor="middle" font-size="20">L3</text>
  </g>

  <!-- Three parallel phase conductors -->
  <g fill="none" stroke="#111111" stroke-width="2.4">
    <path d="M340 120 V180 M440 120 V180 M540 120 V180"/>
    <path d="M340 250 V330 M440 250 V330 M540 250 V330"/>
    <path d="M340 395 V475 M440 395 V475 M540 395 V475"/>
    <path d="M340 550 V635 M440 550 V635 M540 550 V635"/>
    <path d="M340 705 V845 M440 705 V795 M540 705 V845"/>
  </g>

  <!-- QS1: three mechanically linked isolating switch poles -->
  <g fill="none" stroke="#111111" stroke-width="2.4">
    <path d="M340 250 L365 190 M440 250 L465 190 M540 250 L565 190"/>
    <circle cx="340" cy="180" r="4" fill="#ffffff"/>
    <circle cx="440" cy="180" r="4" fill="#ffffff"/>
    <circle cx="540" cy="180" r="4" fill="#ffffff"/>
    <circle cx="340" cy="250" r="4" fill="#ffffff"/>
    <circle cx="440" cy="250" r="4" fill="#ffffff"/>
    <circle cx="540" cy="250" r="4" fill="#ffffff"/>
    <path d="M285 214 H555" stroke-width="1.4" stroke-dasharray="7 5"/>
    <path d="M285 200 V228 M277 200 H293"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111111" stroke="none">
    <text x="75" y="208" font-size="21" font-weight="bold">QS1</text>
    <text x="75" y="232" font-size="15">3-pole isolator</text>
    <text x="327" y="169" text-anchor="end" font-size="14">1/L1</text>
    <text x="427" y="169" text-anchor="end" font-size="14">3/L2</text>
    <text x="527" y="169" text-anchor="end" font-size="14">5/L3</text>
    <text x="327" y="275" text-anchor="end" font-size="14">2/T1</text>
    <text x="427" y="275" text-anchor="end" font-size="14">4/T2</text>
    <text x="527" y="275" text-anchor="end" font-size="14">6/T3</text>
  </g>

  <!-- IEC fuse symbols -->
  <g fill="#ffffff" stroke="#111111" stroke-width="2.2">
    <rect x="327" y="330" width="26" height="65"/>
    <rect x="427" y="330" width="26" height="65"/>
    <rect x="527" y="330" width="26" height="65"/>
  </g>
  <g fill="none" stroke="#111111" stroke-width="2">
    <path d="M340 330 V395 M440 330 V395 M540 330 V395"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111111" stroke="none">
    <text x="75" y="357" font-size="21" font-weight="bold">FU1–FU3</text>
    <text x="75" y="381" font-size="15">Phase fuses</text>
    <text x="340" y="314" text-anchor="middle" font-size="16">FU1</text>
    <text x="440" y="314" text-anchor="middle" font-size="16">FU2</text>
    <text x="540" y="314" text-anchor="middle" font-size="16">FU3</text>
    <text x="316" y="341" text-anchor="end" font-size="14">1</text>
    <text x="416" y="341" text-anchor="end" font-size="14">1</text>
    <text x="516" y="341" text-anchor="end" font-size="14">1</text>
    <text x="316" y="395" text-anchor="end" font-size="14">2</text>
    <text x="416" y="395" text-anchor="end" font-size="14">2</text>
    <text x="516" y="395" text-anchor="end" font-size="14">2</text>
  </g>

  <!-- KM1: normally open main contactor contacts -->
  <g fill="none" stroke="#111111" stroke-width="2.4">
    <path d="M330 475 H350 M430 475 H450 M530 475 H550"/>
    <path d="M340 550 L365 490 M440 550 L465 490 M540 550 L565 490"/>
    <circle cx="340" cy="550" r="3.5" fill="#ffffff"/>
    <circle cx="440" cy="550" r="3.5" fill="#ffffff"/>
    <circle cx="540" cy="550" r="3.5" fill="#ffffff"/>
    <path d="M352.5 520 H552.5" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111111" stroke="none">
    <text x="75" y="511" font-size="21" font-weight="bold">KM1</text>
    <text x="75" y="535" font-size="15">3-pole contactor</text>
    <text x="327" y="462" text-anchor="end" font-size="14">1/L1</text>
    <text x="427" y="462" text-anchor="end" font-size="14">3/L2</text>
    <text x="527" y="462" text-anchor="end" font-size="14">5/L3</text>
    <text x="327" y="576" text-anchor="end" font-size="14">2/T1</text>
    <text x="427" y="576" text-anchor="end" font-size="14">4/T2</text>
    <text x="527" y="576" text-anchor="end" font-size="14">6/T3</text>
  </g>

  <!-- F1: three thermal overload sensing elements in one relay -->
  <rect x="294" y="605" width="292" height="132" fill="none" stroke="#555555" stroke-width="1.2" stroke-dasharray="9 4 2 4"/>
  <g fill="#ffffff" stroke="#111111" stroke-width="2.2">
    <rect x="323" y="635" width="34" height="70"/>
    <rect x="423" y="635" width="34" height="70"/>
    <rect x="523" y="635" width="34" height="70"/>
  </g>
  <g fill="none" stroke="#111111" stroke-width="2.2">
    <path d="M340 635 V651 H332 V683 H348 V693 H340 V705"/>
    <path d="M440 635 V651 H432 V683 H448 V693 H440 V705"/>
    <path d="M540 635 V651 H532 V683 H548 V693 H540 V705"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111111" stroke="none">
    <text x="75" y="661" font-size="21" font-weight="bold">F1</text>
    <text x="75" y="685" font-size="15">Thermal overload relay</text>
    <text x="327" y="626" text-anchor="end" font-size="14">1/L1</text>
    <text x="427" y="626" text-anchor="end" font-size="14">3/L2</text>
    <text x="527" y="626" text-anchor="end" font-size="14">5/L3</text>
    <text x="327" y="726" text-anchor="end" font-size="14">2/T1</text>
    <text x="427" y="726" text-anchor="end" font-size="14">4/T2</text>
    <text x="527" y="726" text-anchor="end" font-size="14">6/T3</text>
  </g>

  <!-- Motor terminals and three-phase motor -->
  <g fill="#ffffff" stroke="#111111" stroke-width="2">
    <circle cx="340" cy="770" r="4"/>
    <circle cx="440" cy="770" r="4"/>
    <circle cx="540" cy="770" r="4"/>
  </g>
  <circle cx="440" cy="920" r="125" fill="none" stroke="#111111" stroke-width="2.6"/>
  <g font-family="Arial, sans-serif" fill="#111111" stroke="none">
    <text x="325" y="775" text-anchor="end" font-size="16">U1</text>
    <text x="425" y="775" text-anchor="end" font-size="16">V1</text>
    <text x="525" y="775" text-anchor="end" font-size="16">W1</text>
    <text x="440" y="929" text-anchor="middle" font-size="52">M~</text>
    <text x="440" y="966" text-anchor="middle" font-size="25">3~</text>
    <text x="610" y="908" font-size="23" font-weight="bold">M1</text>
    <text x="610" y="936" font-size="16">Three-phase</text>
    <text x="610" y="959" font-size="16">motor</text>
    <text x="75" y="1058" font-size="12">Dashed links indicate mechanical coupling. Control circuit and protective earth not shown.</text>
  </g>
</svg>