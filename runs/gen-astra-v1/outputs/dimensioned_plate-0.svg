<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65 -40 250 225" width="1000" height="900">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#222222" stroke="none"/>
    </marker>
  </defs>

  <!-- Plate geometry; drawing coordinates are millimetres. -->
  <rect x="0" y="0" width="150" height="100" rx="10" fill="#f5f7f8" stroke="#111111" stroke-width="0.65"/>
  <g fill="#ffffff" stroke="#111111" stroke-width="0.5">
    <circle cx="12" cy="12" r="3.25"/>
    <circle cx="138" cy="12" r="3.25"/>
    <circle cx="12" cy="88" r="3.25"/>
    <circle cx="138" cy="88" r="3.25"/>
    <rect x="60" y="40" width="30" height="20" rx="10"/>
  </g>

  <!-- Centre lines and hole centre marks. -->
  <g fill="none" stroke="#587080" stroke-width="0.22" stroke-dasharray="5 1.5 1 1.5">
    <line x1="53" y1="50" x2="97" y2="50"/>
    <line x1="75" y1="34" x2="75" y2="66"/>
    <line x1="6" y1="12" x2="18" y2="12"/>
    <line x1="12" y1="6" x2="12" y2="18"/>
    <line x1="132" y1="12" x2="144" y2="12"/>
    <line x1="138" y1="6" x2="138" y2="18"/>
    <line x1="6" y1="88" x2="18" y2="88"/>
    <line x1="12" y1="82" x2="12" y2="94"/>
    <line x1="132" y1="88" x2="144" y2="88"/>
    <line x1="138" y1="82" x2="138" y2="94"/>
  </g>

  <!-- Theoretical lower-left datum: intersection of straight edge extensions. -->
  <g fill="none" stroke="#587080" stroke-width="0.25" stroke-dasharray="4 1 1 1">
    <line x1="0" y1="84" x2="0" y2="108"/>
    <line x1="-6" y1="100" x2="17" y2="100"/>
  </g>
  <circle cx="0" cy="100" r="1.1" fill="#111111" stroke="none"/>
  <path d="M1.5,101.5 L7,107 L28,107" fill="none" stroke="#222222" stroke-width="0.25"/>
  <text x="8" y="105.5" font-family="sans-serif" font-size="3" fill="#222222" stroke="none">DATUM (0,0)</text>

  <!-- X baseline extension lines. -->
  <g fill="none" stroke="#555555" stroke-width="0.2">
    <line x1="0" y1="110" x2="0" y2="156"/>
    <line x1="12" y1="95" x2="12" y2="120"/>
    <line x1="75" y1="68" x2="75" y2="132"/>
    <line x1="138" y1="95" x2="138" y2="144"/>
    <line x1="150" y1="92" x2="150" y2="156"/>
  </g>
  <g fill="none" stroke="#222222" stroke-width="0.25" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="0" y1="117" x2="12" y2="117"/>
    <line x1="0" y1="129" x2="75" y2="129"/>
    <line x1="0" y1="141" x2="138" y2="141"/>
    <line x1="0" y1="153" x2="150" y2="153"/>
  </g>
  <g font-family="sans-serif" font-size="3.5" text-anchor="middle" fill="#222222" stroke="none">
    <text x="6" y="115">12</text>
    <text x="37.5" y="127">75</text>
    <text x="69" y="139">138</text>
    <text x="75" y="151">150</text>
  </g>

  <!-- Y baseline extension lines. -->
  <g fill="none" stroke="#555555" stroke-width="0.2">
    <line x1="-8" y1="100" x2="-51" y2="100"/>
    <line x1="5" y1="88" x2="-15" y2="88"/>
    <line x1="51" y1="50" x2="-27" y2="50"/>
    <line x1="5" y1="12" x2="-39" y2="12"/>
    <line x1="8" y1="0" x2="-51" y2="0"/>
  </g>
  <g fill="none" stroke="#222222" stroke-width="0.25" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="-12" y1="100" x2="-12" y2="88"/>
    <line x1="-24" y1="100" x2="-24" y2="50"/>
    <line x1="-36" y1="100" x2="-36" y2="12"/>
    <line x1="-48" y1="100" x2="-48" y2="0"/>
  </g>
  <g font-family="sans-serif" font-size="3.5" text-anchor="middle" fill="#222222" stroke="none">
    <text transform="translate(-14,94) rotate(-90)">12</text>
    <text transform="translate(-26,75) rotate(-90)">50</text>
    <text transform="translate(-38,56) rotate(-90)">88</text>
    <text transform="translate(-50,50) rotate(-90)">100</text>
  </g>

  <!-- Slot dimensions: overall length and full-radius width. -->
  <g fill="none" stroke="#555555" stroke-width="0.2">
    <line x1="60" y1="48" x2="60" y2="29"/>
    <line x1="90" y1="48" x2="90" y2="29"/>
    <line x1="82" y1="40" x2="104" y2="40"/>
    <line x1="82" y1="60" x2="104" y2="60"/>
  </g>
  <g fill="none" stroke="#222222" stroke-width="0.25" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="60" y1="32" x2="90" y2="32"/>
    <line x1="101" y1="40" x2="101" y2="60"/>
  </g>
  <g font-family="sans-serif" font-size="3.5" fill="#222222" stroke="none">
    <text x="75" y="30" text-anchor="middle">30</text>
    <text transform="translate(105,50) rotate(-90)" text-anchor="middle">20</text>
  </g>
  <path d="M98,74 L91,74 L86.5,57.6" fill="none" stroke="#222222" stroke-width="0.25" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" font-size="3.2" fill="#222222" stroke="none">
    <text x="99" y="73">CENTRAL SLOT</text>
    <text x="99" y="78">2 × R10 FULL ENDS</text>
  </g>

  <!-- Hole and outside corner callouts. -->
  <path d="M20,-18 L5,-18 L5,2 L9.7,9.7" fill="none" stroke="#222222" stroke-width="0.25" marker-end="url(#arrow)"/>
  <text x="21" y="-16.5" font-family="sans-serif" font-size="4" fill="#222222" stroke="none">4 × ⌀6.5 THRU</text>
  <path d="M116,-12 L156,-12 L147.071,2.929" fill="none" stroke="#222222" stroke-width="0.25" marker-end="url(#arrow)"/>
  <text x="116" y="-14" font-family="sans-serif" font-size="3.5" fill="#222222" stroke="none">4 × R10 CORNERS</text>

  <!-- Drawing identification and datum convention. -->
  <g font-family="sans-serif" fill="#222222" stroke="none">
    <text x="-48" y="-29" font-size="5" font-weight="bold">MOUNTING PLATE</text>
    <text x="-48" y="166" font-size="3.5">ALL DIMENSIONS IN mm • PLAN VIEW</text>
    <text x="-48" y="173" font-size="3.2">Baseline origin: theoretical lower-left corner; +X right, +Y up.</text>
    <text x="-48" y="179" font-size="3.2">Hole and slot locations dimensioned to centres. Slot length is overall.</text>
  </g>
</svg>