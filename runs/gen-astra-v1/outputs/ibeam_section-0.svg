<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 780" width="820" height="780">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10">
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" fill="none" stroke="#64748b" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#263445" stroke="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="780" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172534" stroke="none" text-anchor="middle">
    <text x="410" y="35" font-size="23" font-weight="bold">W250×33 STEEL I-BEAM</text>
    <text x="410" y="59" font-size="14">Cross-section · Dimensions in millimetres</text>
  </g>

  <!-- Section: 2 drawing units per millimetre; square-corner nominal geometry. -->
  <path d="M254 132 H546 V150.2 H406.1 V629.8 H546 V648 H254 V629.8 H393.9 V150.2 H254 Z"
        fill="#f8fafc" stroke="none"/>
  <!-- Pattern fill confines every section line to the section boundary. -->
  <path d="M254 132 H546 V150.2 H406.1 V629.8 H546 V648 H254 V629.8 H393.9 V150.2 H254 Z"
        fill="url(#hatch)" stroke="#172534" stroke-width="2" stroke-linejoin="miter"/>

  <!-- Centroidal axes -->
  <g fill="none" stroke="#356780" stroke-width="1.2" stroke-dasharray="16 5 3 5">
    <line x1="215" y1="390" x2="588" y2="390"/>
    <line x1="400" y1="112" x2="400" y2="686"/>
  </g>
  <g fill="#356780" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic">
    <text x="596" y="395">x</text>
    <text x="410" y="682">y</text>
    <text x="412" y="379" font-size="13">C</text>
  </g>

  <!-- Overall flange width -->
  <g fill="none" stroke="#263445" stroke-width="1">
    <line x1="254" y1="124" x2="254" y2="80"/>
    <line x1="546" y1="124" x2="546" y2="80"/>
    <line x1="254" y1="91" x2="546" y2="91" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="400" y="83" fill="#172534" stroke="none" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">146</text>

  <!-- Overall depth -->
  <g fill="none" stroke="#263445" stroke-width="1">
    <line x1="246" y1="132" x2="163" y2="132"/>
    <line x1="246" y1="648" x2="163" y2="648"/>
    <line x1="175" y1="132" x2="175" y2="648" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="160" y="390" transform="rotate(-90 160 390)" fill="#172534" stroke="none" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">258</text>

  <!-- Flange thickness: external arrows for the narrow dimension -->
  <g fill="none" stroke="#263445" stroke-width="1">
    <line x1="554" y1="132" x2="622" y2="132"/>
    <line x1="554" y1="150.2" x2="622" y2="150.2"/>
    <line x1="610" y1="101" x2="610" y2="132" marker-end="url(#arrow)"/>
    <line x1="610" y1="183" x2="610" y2="150.2" marker-end="url(#arrow)"/>
    <line x1="610" y1="132" x2="610" y2="150.2"/>
  </g>
  <g fill="#172534" stroke="none" font-family="Arial, Helvetica, sans-serif">
    <text x="633" y="147" font-size="16">9.1</text>
    <text x="633" y="169" font-size="13">Flange thickness</text>
  </g>

  <!-- Web thickness: external arrows terminating at each web face -->
  <g fill="none" stroke="#263445" stroke-width="1">
    <line x1="340" y1="471" x2="393.9" y2="471" marker-end="url(#arrow)"/>
    <line x1="479" y1="471" x2="406.1" y2="471" marker-end="url(#arrow)"/>
    <line x1="393.9" y1="471" x2="406.1" y2="471"/>
  </g>
  <g fill="#172534" stroke="none" font-family="Arial, Helvetica, sans-serif">
    <text x="490" y="476" font-size="16">6.1</text>
    <text x="490" y="498" font-size="13">Web thickness</text>
  </g>

  <g fill="#475569" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="410" y="723">C: centroid · x–x and y–y: centroidal axes</text>
    <text x="410" y="745">Nominal square-corner profile; root fillets omitted.</text>
  </g>
</svg>