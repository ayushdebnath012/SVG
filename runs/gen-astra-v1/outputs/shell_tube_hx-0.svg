<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <marker id="hot-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#ba392d" stroke="#ba392d"/>
    </marker>
    <marker id="cold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#176f9b" stroke="#176f9b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#202c36" stroke="none">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="bold">SHELL-AND-TUBE HEAT EXCHANGER</text>
    <text x="500" y="69" text-anchor="middle" font-size="14">Single-pass tube side · Countercurrent overall flow · Schematic, not to scale</text>
  </g>

  <!-- Pressure boundary, with openings at the four nozzles -->
  <g fill="#f4f8fa" stroke="#263746" stroke-width="2.5" stroke-linejoin="round">
    <path d="M220 240 H297 V173 H323 V240 H780
             C813 240 837 272 840 317
             H884 V343 H840
             C837 388 813 420 780 420
             H703 V487 H677 V420 H220
             C187 420 163 388 160 343
             H116 V317 H160
             C163 272 187 240 220 240 Z"/>
  </g>

  <!-- Nozzle flange faces -->
  <g fill="none" stroke="#263746" stroke-width="3">
    <line x1="291" y1="173" x2="329" y2="173"/>
    <line x1="671" y1="487" x2="709" y2="487"/>
    <line x1="116" y1="311" x2="116" y2="349"/>
    <line x1="884" y1="311" x2="884" y2="349"/>
  </g>

  <!-- Tube sheets -->
  <g fill="#d5dee4" stroke="#263746" stroke-width="2">
    <rect x="216" y="242" width="10" height="176"/>
    <rect x="774" y="242" width="10" height="176"/>
  </g>

  <!-- Parallel tubes -->
  <g fill="none" stroke="#ba392d" stroke-width="2">
    <line x1="226" y1="270" x2="774" y2="270"/>
    <line x1="226" y1="290" x2="774" y2="290"/>
    <line x1="226" y1="310" x2="774" y2="310"/>
    <line x1="226" y1="330" x2="774" y2="330"/>
    <line x1="226" y1="350" x2="774" y2="350"/>
    <line x1="226" y1="370" x2="774" y2="370"/>
    <line x1="226" y1="390" x2="774" y2="390"/>
  </g>

  <!-- Alternating segmental baffles -->
  <g fill="none" stroke="#526574" stroke-width="5">
    <line x1="350" y1="242" x2="350" y2="374"/>
    <line x1="450" y1="286" x2="450" y2="418"/>
    <line x1="550" y1="242" x2="550" y2="374"/>
    <line x1="650" y1="286" x2="650" y2="418"/>
  </g>

  <!-- Tube-side flow -->
  <g fill="none" stroke="#ba392d" stroke-width="2.5" marker-end="url(#hot-arrow)">
    <line x1="35" y1="330" x2="199" y2="330"/>
    <line x1="473" y1="330" x2="527" y2="330"/>
    <line x1="802" y1="330" x2="965" y2="330"/>
  </g>

  <!-- Shell-side flow -->
  <g fill="none" stroke="#176f9b" stroke-width="2.5" marker-end="url(#cold-arrow)">
    <line x1="310" y1="227" x2="310" y2="113"/>
    <line x1="690" y1="545" x2="690" y2="438"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" stroke="none">
    <text x="35" y="273" fill="#ba392d" font-size="18" font-weight="bold">Hot in</text>
    <text x="35" y="297" fill="#ba392d" font-size="17">120 °C</text>
    <text x="35" y="377" fill="#526574" font-size="13">Tube side</text>

    <text x="965" y="273" text-anchor="end" fill="#ba392d" font-size="18" font-weight="bold">Hot out</text>
    <text x="965" y="297" text-anchor="end" fill="#ba392d" font-size="17">80 °C</text>
    <text x="965" y="377" text-anchor="end" fill="#526574" font-size="13">Tube side</text>

    <text x="285" y="119" text-anchor="end" fill="#176f9b" font-size="18" font-weight="bold">Cold out</text>
    <text x="285" y="143" text-anchor="end" fill="#176f9b" font-size="17">40 °C</text>
    <text x="285" y="164" text-anchor="end" fill="#526574" font-size="13">Shell side</text>

    <text x="726" y="494" fill="#176f9b" font-size="18" font-weight="bold">Cold in</text>
    <text x="726" y="518" fill="#176f9b" font-size="17">20 °C</text>
    <text x="726" y="539" fill="#526574" font-size="13">Shell side</text>
  </g>

  <!-- Part identification leaders -->
  <g fill="none" stroke="#526574" stroke-width="1.3">
    <polyline points="492,148 521,148 550,254"/>
    <polyline points="664,189 707,189 735,240"/>
    <polyline points="147,211 170,211 187,260"/>
    <polyline points="258,474 238,474 221,403"/>
    <polyline points="474,488 498,488 514,370"/>
  </g>
  <g fill="#526574" stroke="none">
    <circle cx="550" cy="254" r="3"/>
    <circle cx="735" cy="240" r="3"/>
    <circle cx="187" cy="260" r="3"/>
    <circle cx="221" cy="403" r="3"/>
    <circle cx="514" cy="370" r="3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#202c36" stroke="none" font-size="15">
    <text x="484" y="144" text-anchor="end">Segmental baffles</text>
    <text x="656" y="185" text-anchor="end">Shell</text>
    <text x="139" y="207" text-anchor="end">End head</text>
    <text x="266" y="479">Tube sheet</text>
    <text x="466" y="493" text-anchor="end">Tube bundle</text>
    <text x="500" y="579" text-anchor="middle" font-size="13" fill="#526574">Illustrative stream temperatures · Fluids remain separated by tube walls</text>
  </g>
</svg>