<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 8,1 L 0,4 L 8,7" fill="none" stroke="#566574" stroke-width="1.2"/>
    </marker>
    <marker id="northArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1 L 10,6 L 0,11 Z" fill="#172b3a" stroke="#172b3a" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="750" fill="#ffffff" stroke="none"/>
  <text x="45" y="45" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172b3a" stroke="none">4-INCH PIPING ISOMETRIC</text>
  <text x="45" y="70" font-family="sans-serif" font-size="12" fill="#566574" stroke="none">Single-line convention · 30° plan axes · Dimensions in metres</text>

  <!-- Main line: 120 drawing units per metre. -->
  <path d="M 170,620 L 481.77,440 L 481.77,260 L 329.32,172
           M 294.68,152 L 273.92,140"
        fill="none" stroke="#172b3a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="butt"/>

  <!-- Gate valve, aligned with the +Y run. -->
  <path d="M 334.32,163.34 L 324.32,180.66 L 289.68,160.66
           L 299.68,143.34 Z"
        fill="#ffffff" stroke="#172b3a" stroke-width="2.4"/>
  <path d="M 334.32,163.34 L 312,162 L 324.32,180.66
           M 299.68,143.34 L 312,162 L 289.68,160.66"
        fill="none" stroke="#172b3a" stroke-width="2"/>
  <line x1="312" y1="162" x2="330" y2="130.82" stroke="#172b3a" stroke-width="2"/>
  <ellipse cx="332" cy="127.36" rx="12" ry="4" transform="rotate(30 332 127.36)" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>

  <!-- Paired perpendicular flange ticks. -->
  <path d="M 350.18,168.74 L 337.18,191.26
           M 344.98,165.74 L 331.98,188.26
           M 292.52,135.45 L 279.52,157.97
           M 287.32,132.45 L 274.32,154.97"
        fill="none" stroke="#172b3a" stroke-width="2.2"/>

  <!-- +X dimension. -->
  <g fill="none" stroke="#566574" stroke-width="1">
    <line x1="170" y1="620" x2="207" y2="684.09"/>
    <line x1="481.77" y1="440" x2="518.77" y2="504.09"/>
    <line x1="200" y1="671.96" x2="511.77" y2="491.96" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  </g>
  <text x="347" y="566" transform="rotate(-30 347 566)" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#344b5b" stroke="none">3 m · +X</text>
  <text x="288" y="532" transform="rotate(-30 288 532)" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172b3a" stroke="none">4″ LINE</text>

  <!-- Vertical dimension. -->
  <g fill="none" stroke="#566574" stroke-width="1">
    <line x1="493" y1="440" x2="580" y2="440"/>
    <line x1="493" y1="260" x2="580" y2="260"/>
    <line x1="565" y1="440" x2="565" y2="260" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  </g>
  <text x="591" y="350" transform="rotate(-90 591 350)" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#344b5b" stroke="none">1.5 m · VERTICAL</text>

  <!-- +Y dimension to the terminal valve flange face. -->
  <g fill="none" stroke="#566574" stroke-width="1">
    <line x1="481.77" y1="260" x2="516.77" y2="199.38"/>
    <line x1="273.92" y1="140" x2="308.92" y2="79.38"/>
    <line x1="509.77" y1="211.5" x2="301.92" y2="91.5" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  </g>
  <text x="410" y="139" transform="rotate(30 410 139)" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#344b5b" stroke="none">2 m · +Y</text>

  <!-- Valve callout. -->
  <path d="M 296,171 L 243,229 L 80,229" fill="none" stroke="#566574" stroke-width="1.2"/>
  <circle cx="296" cy="171" r="2.5" fill="#566574" stroke="none"/>
  <text x="80" y="207" font-family="sans-serif" font-size="16" font-weight="bold" fill="#172b3a" stroke="none">FLANGED GATE VALVE</text>
  <text x="80" y="223" font-family="sans-serif" font-size="12" fill="#566574" stroke="none">4″ · terminal fitting</text>

  <!-- North aligned with the +Y plan axis. -->
  <line x1="795" y1="168" x2="717.06" y2="123" stroke="#172b3a" stroke-width="2" marker-end="url(#northArrow)"/>
  <text x="697" y="116" font-family="sans-serif" font-size="21" font-weight="bold" fill="#172b3a" stroke="none">N</text>
  <text x="713" y="194" font-family="sans-serif" font-size="12" fill="#566574" stroke="none">NORTH = +Y</text>

  <text x="45" y="710" font-family="sans-serif" font-size="12" fill="#566574" stroke="none">Dimensions follow pipe centreline; final run terminates at the valve end face.</text>
  <text x="855" y="710" text-anchor="end" font-family="sans-serif" font-size="12" fill="#566574" stroke="none">SCHEMATIC · NTS</text>
</svg>