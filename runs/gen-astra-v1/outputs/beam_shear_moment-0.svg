<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#243746" stroke="none"/>
    </marker>
    <marker id="loadArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#b83232" stroke="none"/>
    </marker>
    <marker id="dimArrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 7 0 L 0 3.5 L 7 7" fill="none" stroke="#657580" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="850" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#243746" stroke="none">
    <text x="40" y="30" font-size="21" font-weight="bold">Simply supported beam — point load</text>
    <text x="40" y="142" font-size="16" font-weight="bold">Loading</text>
  </g>

  <!-- Dimension lines: common horizontal scale, 110 SVG units per metre. -->
  <g fill="none" stroke="#657580" stroke-width="1">
    <line x1="120" y1="48" x2="120" y2="170"/>
    <line x1="340" y1="83" x2="340" y2="119"/>
    <line x1="780" y1="48" x2="780" y2="170"/>
    <line x1="120" y1="60" x2="780" y2="60" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <line x1="120" y1="97" x2="340" y2="97" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <line x1="340" y1="97" x2="780" y2="97" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#243746" stroke="none">
    <text x="450" y="53">6 m</text>
    <text x="230" y="90">2 m</text>
    <text x="560" y="90">4 m</text>
  </g>

  <!-- Beam and supports. -->
  <line x1="120" y1="200" x2="780" y2="200" stroke="#243746" stroke-width="6" fill="none"/>
  <g stroke="#243746" stroke-width="1.8" fill="#ffffff">
    <polygon points="120,204 100,229 140,229"/>
    <polygon points="780,204 760,226 800,226"/>
    <circle cx="768" cy="233" r="6"/>
    <circle cx="792" cy="233" r="6"/>
  </g>
  <g stroke="#657580" stroke-width="1.3" fill="none">
    <line x1="94" y1="234" x2="146" y2="234"/>
    <path d="M 98 234 l -6 7 M 110 234 l -6 7 M 122 234 l -6 7 M 134 234 l -6 7 M 146 234 l -6 7"/>
    <line x1="752" y1="241" x2="808" y2="241"/>
    <path d="M 758 241 l -6 7 M 770 241 l -6 7 M 782 241 l -6 7 M 794 241 l -6 7 M 806 241 l -6 7"/>
  </g>

  <line x1="340" y1="132" x2="340" y2="194" stroke="#b83232" stroke-width="2.8" fill="none" marker-end="url(#loadArrow)"/>
  <text x="358" y="151" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#b83232" stroke="none">12 kN</text>

  <g stroke="#243746" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="300" x2="120" y2="249"/>
    <line x1="780" y1="300" x2="780" y2="257"/>
    <line x1="798" y1="200" x2="842" y2="200" stroke-width="1.2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243746" stroke="none">
    <text x="143" y="283">RA = 8 kN ↑</text>
    <text x="633" y="283">RB = 4 kN ↑</text>
    <text x="91" y="190">A</text>
    <text x="790" y="190">B</text>
    <text x="815" y="224">x (m)</text>
  </g>

  <!-- Alignment guides at supports and point load. -->
  <g stroke="#c9d1d7" stroke-width="1" stroke-dasharray="4 5" fill="none">
    <line x1="120" y1="320" x2="120" y2="779"/>
    <line x1="340" y1="320" x2="340" y2="779"/>
    <line x1="780" y1="320" x2="780" y2="779"/>
  </g>

  <!-- Shear force diagram: +8 kN to x=2 m, then -4 kN to x=6 m. -->
  <text x="40" y="333" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#243746" stroke="none">Shear force diagram</text>
  <path d="M 120 460 L 120 380 L 340 380 L 340 460 Z" fill="#dcecf6" stroke="none"/>
  <path d="M 340 460 L 340 500 L 780 500 L 780 460 Z" fill="#f8e3df" stroke="none"/>
  <g stroke="#243746" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="101" y1="460" x2="843" y2="460"/>
    <line x1="120" y1="515" x2="120" y2="349"/>
  </g>
  <path d="M 120 460 L 120 380 L 340 380 L 340 500 L 780 500 L 780 460" fill="none" stroke="#21618c" stroke-width="2.8"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243746" stroke="none">
    <text x="48" y="361">V (kN)</text>
    <text x="83" y="385">+8</text>
    <text x="91" y="455">0</text>
    <text x="84" y="505">−4</text>
    <text x="220" y="418" font-size="23" fill="#21618c">+</text>
    <text x="551" y="486" font-size="23" fill="#a34b3a">−</text>
    <text x="805" y="486">x (m)</text>
    <text x="120" y="534" text-anchor="middle">0</text>
    <text x="340" y="534" text-anchor="middle">2</text>
    <text x="780" y="534" text-anchor="middle">6</text>
  </g>

  <!-- Bending moment diagram: positive sagging, maximum 16 kN·m. -->
  <text x="40" y="571" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#243746" stroke="none">Bending moment diagram</text>
  <path d="M 120 755 L 340 595 L 780 755 Z" fill="#e0eee7" stroke="none"/>
  <g stroke="#243746" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="101" y1="755" x2="843" y2="755"/>
    <line x1="120" y1="770" x2="120" y2="590"/>
  </g>
  <line x1="120" y1="595" x2="340" y2="595" stroke="#8aa697" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <path d="M 120 755 L 340 595 L 780 755" fill="none" stroke="#28734f" stroke-width="2.8"/>
  <circle cx="340" cy="595" r="4" fill="#28734f" stroke="#28734f"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243746" stroke="none">
    <text x="24" y="620">M (kN·m)</text>
    <text x="75" y="600">+16</text>
    <text x="91" y="750">0</text>
    <text x="360" y="611" font-weight="bold" fill="#28734f">Mmax = +16 kN·m</text>
    <text x="360" y="634" fill="#28734f">at x = 2 m</text>
    <text x="420" y="705" font-size="23" fill="#28734f">+</text>
    <text x="805" y="781">x (m)</text>
    <text x="120" y="782" text-anchor="middle">0</text>
    <text x="340" y="782" text-anchor="middle">2</text>
    <text x="780" y="782" text-anchor="middle">6</text>
    <text x="120" y="819" font-size="14" fill="#526570">Positive moment = sagging. Moment is zero at both supports.</text>
  </g>
</svg>