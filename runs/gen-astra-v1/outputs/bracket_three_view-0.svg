<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#222222" stroke="#222222" stroke-width="0.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="820" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, sans-serif" fill="#222222" stroke="none">
    <text x="60" y="42" font-size="23" font-weight="bold">L-SHAPED STEEL BRACKET</text>
    <text x="60" y="70" font-size="15">THIRD-ANGLE ORTHOGRAPHIC PROJECTION · ALL DIMENSIONS IN mm</text>
    <text x="320" y="120" text-anchor="middle" font-size="17" font-weight="bold">TOP</text>
    <text x="320" y="740" text-anchor="middle" font-size="17" font-weight="bold">FRONT</text>
    <text x="680" y="740" text-anchor="middle" font-size="17" font-weight="bold">RIGHT SIDE</text>
  </g>

  <!-- Top: rear flange occupies the upper 8 mm of the 40 mm depth. -->
  <g fill="none" stroke="#111111" stroke-width="2.2" stroke-linejoin="miter">
    <rect x="160" y="150" width="320" height="160"/>
    <line x1="160" y1="182" x2="480" y2="182"/>
    <circle cx="240" cy="230" r="18"/>
    <circle cx="400" cy="230" r="18"/>
  </g>

  <!-- Front: 80 mm wide by 60 mm high, with an 8 mm base. -->
  <g fill="none" stroke="#111111" stroke-width="2.2">
    <rect x="160" y="390" width="320" height="240"/>
    <line x1="160" y1="598" x2="480" y2="598"/>
  </g>

  <!-- Right side: front at left, rear upright at right. -->
  <path d="M 600 630 L 760 630 L 760 390 L 728 390 L 728 598 L 600 598 Z"
        fill="none" stroke="#111111" stroke-width="2.2" stroke-linejoin="miter"/>

  <!-- Hidden outlines of the through-holes. The two holes overlap in side projection. -->
  <g fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 4">
    <line x1="222" y1="598" x2="222" y2="630"/>
    <line x1="258" y1="598" x2="258" y2="630"/>
    <line x1="382" y1="598" x2="382" y2="630"/>
    <line x1="418" y1="598" x2="418" y2="630"/>
    <line x1="662" y1="598" x2="662" y2="630"/>
    <line x1="698" y1="598" x2="698" y2="630"/>
  </g>

  <!-- Hole centerlines. -->
  <g fill="none" stroke="#536574" stroke-width="1" stroke-dasharray="16 4 3 4">
    <line x1="209" y1="230" x2="271" y2="230"/>
    <line x1="240" y1="199" x2="240" y2="261"/>
    <line x1="369" y1="230" x2="431" y2="230"/>
    <line x1="400" y1="199" x2="400" y2="261"/>
    <line x1="240" y1="586" x2="240" y2="642"/>
    <line x1="400" y1="586" x2="400" y2="642"/>
    <line x1="680" y1="586" x2="680" y2="642"/>
  </g>

  <!-- Dimension extension lines. -->
  <g fill="none" stroke="#444444" stroke-width="1">
    <line x1="160" y1="638" x2="160" y2="701"/>
    <line x1="480" y1="638" x2="480" y2="701"/>
    <line x1="152" y1="390" x2="89" y2="390"/>
    <line x1="152" y1="630" x2="89" y2="630"/>
    <line x1="600" y1="638" x2="600" y2="701"/>
    <line x1="760" y1="638" x2="760" y2="701"/>
    <line x1="728" y1="382" x2="728" y2="340"/>
    <line x1="760" y1="382" x2="760" y2="340"/>
    <line x1="766" y1="598" x2="832" y2="598"/>
    <line x1="768" y1="630" x2="832" y2="630"/>
  </g>

  <!-- Overall and thickness dimensions. -->
  <g fill="none" stroke="#222222" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="160" y1="690" x2="480" y2="690"/>
    <line x1="100" y1="390" x2="100" y2="630"/>
    <line x1="600" y1="690" x2="760" y2="690"/>
    <line x1="728" y1="352" x2="760" y2="352"/>
    <line x1="820" y1="598" x2="820" y2="630"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" fill="#222222" stroke="none">
    <text x="320" y="680" text-anchor="middle">80</text>
    <text x="85" y="510" text-anchor="middle" transform="rotate(-90 85 510)">60</text>
    <text x="680" y="680" text-anchor="middle">40</text>
    <text x="744" y="337" text-anchor="middle">8</text>
    <text x="837" y="620">8</text>
  </g>

  <!-- Hole callout and material/feature labels. -->
  <g fill="none" stroke="#222222" stroke-width="1.2">
    <polyline points="590,207 531,207 413,217" marker-end="url(#arrow)"/>
    <polyline points="832,459 793,459 746,473" marker-end="url(#arrow)"/>
    <polyline points="843,548 798,548 709,610" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#222222" stroke="none">
    <text x="600" y="211" font-size="18">2 × ⌀9 THRU</text>
    <text x="600" y="240" font-size="14">Base flange holes</text>
    <text x="600" y="264" font-size="14">Centers 20 from each width end</text>
    <text x="600" y="284" font-size="14">and 20 from the front edge</text>
    <text x="843" y="463" font-size="14">Upright</text>
    <text x="851" y="544" font-size="14">Base</text>
    <text x="851" y="562" font-size="14">flange</text>
    <text x="60" y="784" font-size="14">MATERIAL: STEEL · UNIFORM THICKNESS: 8 · SHARP-CORNER GEOMETRY SHOWN</text>
  </g>
</svg>