<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222222" stroke="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="490" fill="#ffffff" stroke="none"/>

  <g font-family="sans-serif" fill="#222222" stroke="none">
    <text x="30" y="30" font-size="19">12-TOOTH SPUR GEAR</text>
    <text x="30" y="51" font-size="12">AXIAL VIEW · TRAPEZOIDAL TOOTH PROFILE · DIMENSIONS IN mm</text>
  </g>

  <!-- Continuous closed tooth outline; drawing scale: 2 SVG units/mm. -->
  <path transform="translate(230 215)"
        d="M92.924 -19.752
           L139.233 -14.634 L139.233 14.634 L92.924 19.752
           L90.350 29.357 L127.896 56.943 L113.262 82.290 L70.599 63.568
           L63.568 70.599 L82.290 113.262 L56.943 127.896 L29.357 90.350
           L19.752 92.924 L14.634 139.233 L-14.634 139.233 L-19.752 92.924
           L-29.357 90.350 L-56.943 127.896 L-82.290 113.262 L-63.568 70.599
           L-70.599 63.568 L-113.262 82.290 L-127.896 56.943 L-90.350 29.357
           L-92.924 19.752 L-139.233 14.634 L-139.233 -14.634 L-92.924 -19.752
           L-90.350 -29.357 L-127.896 -56.943 L-113.262 -82.290 L-70.599 -63.568
           L-63.568 -70.599 L-82.290 -113.262 L-56.943 -127.896 L-29.357 -90.350
           L-19.752 -92.924 L-14.634 -139.233 L14.634 -139.233 L19.752 -92.924
           L29.357 -90.350 L56.943 -127.896 L82.290 -113.262 L63.568 -70.599
           L70.599 -63.568 L113.262 -82.290 L127.896 -56.943 L90.350 -29.357 Z"
        fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="miter"/>

  <circle cx="230" cy="215" r="120" fill="none" stroke="#39728b" stroke-width="1.3" stroke-dasharray="8 5"/>

  <!-- Bore and 6 mm wide keyway form one continuous opening. -->
  <path d="M224 195.921
           A20 20 0 1 0 236 195.921
           L236 187 L224 187 Z"
        fill="#ffffff" stroke="#222222" stroke-width="1.8"/>

  <g fill="none" stroke="#888888" stroke-width="0.8" stroke-dasharray="12 4 2 4">
    <line x1="75" y1="215" x2="385" y2="215"/>
    <line x1="230" y1="65" x2="230" y2="370"/>
  </g>

  <!-- Pitch diameter dimension. -->
  <g fill="none" stroke="#555555" stroke-width="0.8">
    <line x1="110" y1="219" x2="110" y2="432"/>
    <line x1="350" y1="219" x2="350" y2="432"/>
  </g>
  <line x1="110" y1="420" x2="350" y2="420" stroke="#222222" stroke-width="1"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="165" y="408" width="130" height="23" fill="#ffffff" stroke="none"/>
  <text x="230" y="425" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" stroke="none">Ø120 PITCH</text>

  <!-- Bore diameter dimension and identification. -->
  <line x1="210" y1="215" x2="250" y2="215" stroke="#222222" stroke-width="1"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <polyline points="250,215 284,180 390,180" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="397" y="184" font-family="sans-serif" font-size="15" fill="#222222" stroke="none">Ø20 BORE</text>

  <!-- Keyway width dimension, enlarged by outward-facing dimension arrows. -->
  <g fill="none" stroke="#555555" stroke-width="0.8">
    <line x1="224" y1="184" x2="224" y2="157"/>
    <line x1="236" y1="184" x2="236" y2="157"/>
  </g>
  <g fill="none" stroke="#222222" stroke-width="1">
    <line x1="202" y1="164" x2="224" y2="164" marker-end="url(#arrow)"/>
    <line x1="258" y1="164" x2="236" y2="164" marker-end="url(#arrow)"/>
    <polyline points="258,164 285,139 390,139"/>
  </g>
  <text x="397" y="143" font-family="sans-serif" font-size="15" fill="#222222" stroke="none">6 KEYWAY</text>

  <line x1="395" y1="300" x2="430" y2="300" stroke="#39728b" stroke-width="1.3" stroke-dasharray="8 5"/>
  <text x="440" y="304" font-family="sans-serif" font-size="12" fill="#39728b" stroke="none">Pitch circle</text>

  <text x="30" y="466" font-family="sans-serif" font-size="12" fill="#555555" stroke="none">Schematic tooth form — not an involute manufacturing profile.</text>
</svg>