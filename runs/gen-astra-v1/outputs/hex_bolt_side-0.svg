<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#222222" stroke="none"/>
    </marker>
    <pattern id="threads" x="360" y="174" width="12" height="72" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="72" stroke="#222222" stroke-width="1.5"/>
      <line x1="8" y1="8" x2="8" y2="64" stroke="#222222" stroke-width="0.65"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="720" height="410" fill="#ffffff" stroke="none"/>

  <g font-family="Arial, sans-serif" fill="#222222" stroke="none" text-anchor="middle">
    <text x="360" y="30" font-size="20">M12 × 60 HEX HEAD BOLT</text>
    <text x="360" y="389" font-size="12">SIDE ELEVATION · ALL DIMENSIONS IN mm</text>
  </g>

  <!-- Head: 8 mm axial height, three visible rectangular facets. -->
  <rect x="132" y="153" width="48" height="114" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <line x1="132" y1="177" x2="180" y2="177" stroke="#222222" stroke-width="1.4"/>
  <line x1="132" y1="243" x2="180" y2="243" stroke="#222222" stroke-width="1.4"/>

  <!-- 12 mm shank; 60 mm from bearing face to tip. -->
  <path d="M 180 174 H 532 L 540 182 V 238 L 532 246 H 180 Z"
        fill="#ffffff" stroke="#222222" stroke-width="2"/>

  <!-- 30 mm threaded portion: alternating full and thin lines. -->
  <rect x="360" y="174" width="168" height="72" fill="url(#threads)" stroke="none"/>
  <line x1="360" y1="182" x2="538" y2="182" stroke="#222222" stroke-width="0.75"/>
  <line x1="360" y1="238" x2="538" y2="238" stroke="#222222" stroke-width="0.75"/>
  <line x1="360" y1="174" x2="360" y2="246" stroke="#222222" stroke-width="1.5"/>
  <line x1="530" y1="176" x2="530" y2="244" stroke="#222222" stroke-width="1.5"/>

  <!-- Axis. -->
  <line x1="110" y1="210" x2="563" y2="210" stroke="#777777" stroke-width="0.7" stroke-dasharray="18 4 3 4"/>

  <!-- Part labels. -->
  <g fill="none" stroke="#444444" stroke-width="0.9">
    <polyline points="107,66 120,66 149,151"/>
    <polyline points="278,66 289,66 306,170"/>
    <polyline points="426,66 441,66 456,170"/>
    <polyline points="596,265 568,265 537,242"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#222222" stroke="none">
    <text x="49" y="63">Hex head</text>
    <text x="239" y="61">Ø12 shank</text>
    <text x="399" y="61">M12 thread</text>
    <text x="580" y="283">Chamfered tip</text>
  </g>

  <!-- Under-head length dimension. -->
  <g fill="none" stroke="#444444" stroke-width="0.8">
    <line x1="180" y1="147" x2="180" y2="101"/>
    <line x1="540" y1="176" x2="540" y2="101"/>
    <line x1="180" y1="111" x2="540" y2="111" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="360" y="103" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222" stroke="none">60</text>

  <!-- Head height dimension. -->
  <g fill="none" stroke="#444444" stroke-width="0.8">
    <line x1="132" y1="273" x2="132" y2="307"/>
    <line x1="180" y1="273" x2="180" y2="307"/>
    <line x1="132" y1="297" x2="180" y2="297" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#222222" stroke="none">
    <text x="156" y="289" font-size="15">8</text>
    <text x="156" y="324" font-size="12">Head height</text>
  </g>

  <!-- Thread length dimension. -->
  <g fill="none" stroke="#444444" stroke-width="0.8">
    <line x1="360" y1="252" x2="360" y2="345"/>
    <line x1="540" y1="248" x2="540" y2="345"/>
    <line x1="360" y1="335" x2="540" y2="335" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#222222" stroke="none">
    <text x="450" y="327" font-size="15">30</text>
    <text x="450" y="358" font-size="12">Thread length</text>
  </g>
</svg>