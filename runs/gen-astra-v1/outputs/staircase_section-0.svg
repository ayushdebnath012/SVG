<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960">
  <defs>
    <pattern id="concrete" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M-3 3 L3-3 M0 12 L12 0 M9 15 L15 9" fill="none" stroke="#9aa1a8" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M10 0 L0 5 L10 10 Z" fill="#263746" stroke="#263746" stroke-width="0.5"/>
    </marker>
  </defs>

  <text x="65" y="45" fill="#17232d" font-family="sans-serif" font-size="24" font-weight="bold">STRAIGHT STAIR — SECTION</text>
  <text x="65" y="74" fill="#465460" font-family="sans-serif" font-size="15">14 risers × 180 mm • 13 treads × 260 mm • All dimensions in mm</text>

  <!-- Floor slabs: 200 mm thick at the same drawing scale as the stair. -->
  <path d="M75 760 H240 V800 H75 Z" fill="url(#concrete)" stroke="#17232d" stroke-width="2"/>
  <path d="M916 256 H1015 V296 H916 Z" fill="url(#concrete)" stroke="#17232d" stroke-width="2"/>

  <!-- Sawtooth stringer: fourteen 36-unit rises and thirteen 52-unit goings. -->
  <path d="M240 800
           V760 V724 H292
           V688 H344
           V652 H396
           V616 H448
           V580 H500
           V544 H552
           V508 H604
           V472 H656
           V436 H708
           V400 H760
           V364 H812
           V328 H864
           V292 H916
           V256
           L916 332
           Z"
        fill="#e5e9ec" stroke="#17232d" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- Nosing reference and handrail, separated vertically by 900 mm. -->
  <line x1="240" y1="724" x2="916" y2="256" stroke="#748593" stroke-width="1.1" stroke-dasharray="7 5"/>
  <g fill="none" stroke="#354653" stroke-width="3">
    <line x1="292" y1="688" x2="292" y2="508"/>
    <line x1="500" y1="544" x2="500" y2="364"/>
    <line x1="708" y1="400" x2="708" y2="220"/>
    <line x1="916" y1="256" x2="916" y2="76"/>
  </g>
  <line x1="215" y1="561.31" x2="941" y2="58.69" stroke="#17232d" stroke-width="7" stroke-linecap="round"/>

  <!-- Part labels. -->
  <g font-family="sans-serif" font-size="16" fill="#263746">
    <text x="415" y="139">HANDRAIL</text>
    <text x="415" y="161" font-size="14">900 above nosing line</text>
    <path d="M545 155 H578 L640 447.08" fill="none" stroke="#536674" stroke-width="1.2" visibility="hidden"/>
    <path d="M540 155 H570 L630 274" fill="none" stroke="#536674" stroke-width="1.2"/>
    <circle cx="630" cy="274" r="3" fill="#536674" stroke="#536674"/>

    <text x="704" y="647">STRINGER PROFILE</text>
    <path d="M697 641 H645 L586 542" fill="none" stroke="#536674" stroke-width="1.2"/>
    <circle cx="586" cy="542" r="3" fill="#536674" stroke="#536674"/>

    <text x="835" y="468">NOSING LINE</text>
    <path d="M830 456 H808 L778 351.54" fill="none" stroke="#536674" stroke-width="1.2"/>

    <text x="78" y="699" font-size="14">BOTTOM SLAB</text>
    <text x="78" y="720" font-size="14">200 thick</text>
    <path d="M140 726 V775" fill="none" stroke="#536674" stroke-width="1.2"/>

    <text x="954" y="177" font-size="14">TOP SLAB</text>
    <text x="954" y="198" font-size="14">200 thick</text>
    <path d="M981 205 V276" fill="none" stroke="#536674" stroke-width="1.2"/>
  </g>

  <!-- Handrail height, measured vertically from the nosing reference. -->
  <g stroke="#263746" stroke-width="1" fill="none">
    <line x1="745" y1="194.38" x2="745" y2="374.38" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="735" y1="194.38" x2="755" y2="194.38"/>
    <line x1="735" y1="374.38" x2="755" y2="374.38"/>
  </g>
  <text x="767" y="285" transform="rotate(-90 767 285)" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="15">900</text>

  <!-- One tread and one riser. -->
  <g stroke="#263746" stroke-width="1" fill="none">
    <line x1="240" y1="716" x2="240" y2="665"/>
    <line x1="292" y1="680" x2="292" y2="665"/>
    <line x1="240" y1="673" x2="292" y2="673" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="232" y1="724" x2="195" y2="724"/>
    <line x1="232" y1="760" x2="195" y2="760"/>
    <line x1="203" y1="724" x2="203" y2="760" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="266" y="657" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="16">260</text>
  <text x="187" y="742" transform="rotate(-90 187 742)" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="15">180</text>

  <!-- Overall rise: upper finished floor to lower finished floor. -->
  <g stroke="#263746" stroke-width="1" fill="none">
    <line x1="1023" y1="256" x2="1102" y2="256"/>
    <line x1="250" y1="760" x2="1102" y2="760" stroke="#89959f" stroke-dasharray="5 5"/>
    <line x1="1090" y1="256" x2="1090" y2="760" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="1117" y="508" transform="rotate(-90 1117 508)" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="18">TOTAL RISE 2520</text>

  <!-- Overall going: first riser face to upper landing riser face. -->
  <g stroke="#263746" stroke-width="1" fill="none">
    <line x1="240" y1="810" x2="240" y2="877"/>
    <line x1="916" y1="342" x2="916" y2="877" stroke="#89959f" stroke-dasharray="5 5"/>
    <line x1="240" y1="865" x2="916" y2="865" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="578" y="850" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="18">TOTAL GOING 3380</text>
  <text x="578" y="903" text-anchor="middle" fill="#465460" font-family="sans-serif" font-size="15">Upper floor forms the final tread / landing.</text>
</svg>