<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96">
  <defs>
    <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 H 0 V 1" fill="none" stroke="#dce3e9" stroke-width="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="2" markerHeight="2" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#243746" stroke="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="120" height="96" fill="#ffffff" stroke="none"/>
  <text x="60" y="6" text-anchor="middle" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#172b3a">SOIC-8 PCB LAND PATTERN</text>
  <text x="60" y="10" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#455967">Top view · all dimensions in mm · grid: 0.1 mm</text>

  <rect x="19" y="13" width="83" height="62" fill="url(#grid)" stroke="#c6d0d8" stroke-width="0.12"/>

  <!-- Coordinate scale: 10 SVG units = 1 mm.
       Pad row centers: x=33,87. Pad pitch: 12.7 units. -->
  <rect x="22.75" y="16" width="74.5" height="56" fill="none" stroke="#87539b" stroke-width="0.2" stroke-dasharray="1.5 1"/>

  <!-- Silkscreen body outline and pin-1 mark. -->
  <rect x="42" y="19" width="36" height="50" rx="0.4" fill="none" stroke="#166b66" stroke-width="0.15"/>
  <circle cx="45.5" cy="23" r="0.85" fill="#166b66" stroke="none"/>
  <text x="60" y="43" text-anchor="middle" font-family="sans-serif" font-size="3" fill="#166b66">SOIC-8</text>
  <text x="60" y="47" text-anchor="middle" font-family="sans-serif" font-size="2" fill="#166b66">BODY SILK</text>

  <!-- Copper pad boundaries are defined by fill only: 1.55 × 0.60 mm. -->
  <g fill="#c88a25" stroke="none">
    <rect x="25.25" y="21.95" width="15.5" height="6"/>
    <rect x="25.25" y="34.65" width="15.5" height="6"/>
    <rect x="25.25" y="47.35" width="15.5" height="6"/>
    <rect x="25.25" y="60.05" width="15.5" height="6"/>
    <rect x="79.25" y="60.05" width="15.5" height="6"/>
    <rect x="79.25" y="47.35" width="15.5" height="6"/>
    <rect x="79.25" y="34.65" width="15.5" height="6"/>
    <rect x="79.25" y="21.95" width="15.5" height="6"/>
  </g>

  <g font-family="sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#172b3a" stroke="none">
    <text x="33" y="25.95">1</text>
    <text x="33" y="38.65">2</text>
    <text x="33" y="51.35">3</text>
    <text x="33" y="64.05">4</text>
    <text x="87" y="64.05">5</text>
    <text x="87" y="51.35">6</text>
    <text x="87" y="38.65">7</text>
    <text x="87" y="25.95">8</text>
  </g>

  <!-- Pitch dimension: adjacent pad centerlines. -->
  <g fill="none" stroke="#243746" stroke-width="0.15">
    <line x1="24.25" y1="24.95" x2="13.5" y2="24.95"/>
    <line x1="24.25" y1="37.65" x2="13.5" y2="37.65"/>
    <line x1="15" y1="24.95" x2="15" y2="37.65" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="11.5" y="31.3" transform="rotate(-90 11.5 31.3)" text-anchor="middle" font-family="sans-serif" font-size="2.5" fill="#243746">1.27 pitch</text>

  <!-- Row spacing dimension: center-to-center. -->
  <g fill="none" stroke="#243746" stroke-width="0.15">
    <line x1="33" y1="67.05" x2="33" y2="83"/>
    <line x1="87" y1="67.05" x2="87" y2="83"/>
    <line x1="33" y1="81" x2="87" y2="81" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="60" y="79.5" text-anchor="middle" font-family="sans-serif" font-size="2.5" fill="#243746">5.40 row spacing (C–C)</text>

  <rect x="20" y="87" width="4" height="2" fill="#c88a25" stroke="none"/>
  <text x="26" y="89" font-family="sans-serif" font-size="2.3" fill="#243746">8× copper pads: 1.55 × 0.60</text>
  <line x1="72" y1="88" x2="79" y2="88" stroke="#87539b" stroke-width="0.2" stroke-dasharray="1.5 1"/>
  <text x="81" y="89" font-family="sans-serif" font-size="2.3" fill="#87539b">Courtyard</text>
  <circle cx="22" cy="93" r="0.65" fill="#166b66" stroke="none"/>
  <text x="26" y="93.8" font-family="sans-serif" font-size="2.1" fill="#166b66">Pin-1 indicator · green outline: silkscreen</text>
</svg>