<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>

  <text x="360" y=" fifty" fill="#17212b" font-family="sans-serif" font-size="22" text-anchor="middle"> </text>
  <text x="360" y="52" fill="#17212b" font-family="sans-serif" font-size="22" text-anchor="middle">HALF ADDER</text>

  <!-- Input wires and fan-out. The bridge denotes a nonconnected crossing. -->
  <g fill="none" stroke="#17212b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 140 H315"/>
    <path d="M85 200 H315"/>
    <path d="M160 140 V340 H300"/>
    <path d="M220 200 V330 C234 330 234 350 220 350 V400 H300"/>

    <!-- XOR: curved input face and separate exclusive-OR arc. -->
    <path d="M300 110
             C370 110 420 130 450 170
             C420 210 370 230 300 230
             Q340 170 300 110 Z" fill="#ffffff"/>
    <path d="M285 110 Q325 170 285 230"/>

    <!-- AND: flat input face and semicircular output face. -->
    <path d="M300 310 H370
             A60 60 0 0 1 370 430
             H300 Z" fill="#ffffff"/>

    <!-- Output wires. -->
    <path d="M450 170 H555"/>
    <path d="M430 370 H555"/>
  </g>

  <circle cx="160" cy="140" r="4.5" fill="#17212b"/>
  <circle cx="220" cy="200" r="4.5" fill="#17212b"/>

  <g fill="#17212b" font-family="sans-serif" font-size="21">
    <text x="58" y="147" text-anchor="middle">A</text>
    <text x="58" y="207" text-anchor="middle">B</text>
    <text x="573" y="177">SUM</text>
    <text x="573" y="377">CARRY</text>
  </g>

  <g fill="#475569" font-family="sans-serif" font-size="15" text-anchor="middle">
    <text x="365" y="262">XOR</text>
    <text x="365" y="458">AND</text>
  </g>
</svg>