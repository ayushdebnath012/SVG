<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660">
  <defs>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#172b3a" stroke="#172b3a" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff" stroke="none"/>
  <text x="50" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#172b3a" stroke="none">P&amp;ID — SIMPLE PUMPED RECIRCULATION LOOP</text>
  <text x="50" y="76" font-family="sans-serif" font-size="14" fill="#536471" stroke="none">Process flow: T-101 → P-101 → V-1 → V-2 → FI-101 → FCV-101 → T-101</text>

  <!-- Storage tank and liquid level -->
  <path d="M 80 320 L 80 190 Q 170 150 260 190 L 260 450 Q 170 490 80 450 Z"
        fill="#ffffff" stroke="#172b3a" stroke-width="3"/>
  <path d="M 95 325 L 245 325" fill="none" stroke="#7696aa" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="170" y="248" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#172b3a" stroke="none">T-101</text>
  <text x="170" y="277" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172b3a" stroke="none">Storage tank</text>
  <text x="170" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">Atmospheric</text>
  <path d="M 170 170 L 170 126 L 192 126" fill="none" stroke="#172b3a" stroke-width="3"/>
  <text x="202" y="131" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">Open vent</text>

  <!-- Suction, pump discharge, and return piping -->
  <path d="M 260 410 L 340 410" fill="none" stroke="#172b3a" stroke-width="3"/>
  <path d="M 420 410 L 452 410 L 452 350 L 479 350" fill="none" stroke="#172b3a" stroke-width="3"/>
  <path d="M 521 350 L 599 350" fill="none" stroke="#172b3a" stroke-width="3"/>
  <path d="M 641 350 L 739 350" fill="none" stroke="#172b3a" stroke-width="3"/>
  <path d="M 801 350 L 919 350" fill="none" stroke="#172b3a" stroke-width="3"/>
  <path d="M 961 350 L 1100 350 L 1100 205 L 260 205" fill="none" stroke="#172b3a" stroke-width="3"/>

  <!-- Direction arrows -->
  <path d="M 284 410 L 320 410" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 548 350 L 578 350" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 676 350 L 711 350" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 837 350 L 876 350" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 1010 350 L 1050 350" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 1100 290 L 1100 245" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 660 205 L 607 205" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 335 205 L 283 205" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#flow)"/>
  <text x="660" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#536471" stroke="none">Return to tank</text>
  <text x="296" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">Suction</text>
  <text x="503" y="450" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">Discharge</text>

  <!-- Centrifugal pump -->
  <circle cx="380" cy="410" r="40" fill="#ffffff" stroke="#172b3a" stroke-width="3"/>
  <polygon points="356,386 356,434 406,410" fill="none" stroke="#172b3a" stroke-width="2.5"/>
  <path d="M 359 445 L 351 465 L 409 465 L 401 445" fill="none" stroke="#172b3a" stroke-width="2"/>
  <text x="380" y="498" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#172b3a" stroke="none">P-101</text>
  <text x="380" y="522" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#172b3a" stroke="none">Centrifugal pump</text>

  <!-- Manual gate valve -->
  <polygon points="479,334 500,350 479,366" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <polygon points="521,334 500,350 521,366" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <line x1="500" y1="350" x2="500" y2="318" stroke="#172b3a" stroke-width="2"/>
  <line x1="486" y1="318" x2="514" y2="318" stroke="#172b3a" stroke-width="2.5"/>
  <text x="500" y="284" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172b3a" stroke="none">V-1</text>
  <text x="500" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a" stroke="none">Gate valve</text>

  <!-- Check valve: directional triangle and downstream seat -->
  <polygon points="599,333 633,350 599,367" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <line x1="637" y1="331" x2="637" y2="369" stroke="#172b3a" stroke-width="3"/>
  <line x1="637" y1="350" x2="641" y2="350" stroke="#172b3a" stroke-width="3"/>
  <text x="620" y="284" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172b3a" stroke="none">V-2</text>
  <text x="620" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a" stroke="none">Check valve</text>
  <text x="620" y="394" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#536471" stroke="none">Forward flow →</text>

  <!-- Local flow indicator bubble -->
  <circle cx="770" cy="350" r="31" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <text x="770" y="345" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172b3a" stroke="none">FI</text>
  <text x="770" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#172b3a" stroke="none">101</text>
  <text x="770" y="284" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172b3a" stroke="none">FI-101</text>
  <text x="770" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a" stroke="none">Flow indicator</text>

  <!-- Diaphragm-actuated control valve -->
  <polygon points="919,334 940,350 919,366" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <polygon points="961,334 940,350 961,366" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <line x1="940" y1="350" x2="940" y2="306" stroke="#172b3a" stroke-width="2"/>
  <path d="M 916 306 A 24 19 0 0 1 964 306 Z" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
  <text x="940" y="251" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172b3a" stroke="none">FCV-101</text>
  <text x="940" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a" stroke="none">Flow control valve</text>
  <text x="940" y="394" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#536471" stroke="none">Diaphragm actuator</text>

  <line x1="50" y1="565" x2="1150" y2="565" stroke="#c5cdd3" stroke-width="1"/>
  <text x="50" y="593" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">Solid lines: process piping    •    Arrows: normal flow direction    •    Instrument bubble: local indication</text>
  <text x="50" y="618" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">Schematic — not to scale. Control signal, controller, utilities, and ancillary fittings are not shown.</text>
  <text x="1150" y="618" text-anchor="end" font-family="sans-serif" font-size="13" fill="#536471" stroke="none">PID-001 / REV 0</text>
</svg>