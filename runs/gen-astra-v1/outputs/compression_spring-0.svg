  </g>
  <text x="330" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#111111">OD ⌀40</text>

  <!-- Free length, measured between ground bearing planes -->
  <g fill="none" stroke="#222222" stroke-width="1">
    <line x1="222" y1="140" x2="128" y2="140"/>
    <line x1="222" y1="640" x2="128" y2="640"/>
    <line x1="142" y1="140" x2="142" y2="640" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="126" y="390" transform="rotate(-90 126 390)" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111111">100 FREE LENGTH</text>

  <!-- Wire diameter across the straight closed end -->
  <g fill="none" stroke="#222222" stroke-width="1">
    <line x1="355" y1="140" x2="525" y2="140"/>
    <line x1="355" y1="160" x2="525" y2="160"/>
    <line x1="508" y1="115" x2="508" y2="140" marker-end="url(#arrow)"/>
    <line x1="508" y1="185" x2="508" y2="160" marker-end="url(#arrow)"/>
    <line x1="508" y1="140" x2="508" y2="160"/>
  </g>
  <text x="538" y="155" font-family="sans-serif" font-size="15" fill="#111111">⌀4 WIRE</text>

  <!-- Part labels -->
  <path d="M480 358 H532 V330" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="480" y="312" font-family="sans-serif" font-size="15" fill="#111111">8 ACTIVE COILS</text>
  <line x1="480" y1="358" x2="421" y2="334" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M477 594 H530 V628 H397" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/>
