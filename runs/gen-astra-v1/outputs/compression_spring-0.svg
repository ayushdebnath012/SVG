  <path d="M230 150 H420
           Q420 155 420 160
           C420 169.583 240 179.167 240 188.75
           C240 198.333 420 207.917 420 217.5
           C420 227.083 240 236.667 240 246.25
           C240 255.833 420 265.417 420 275
           C420 284.583 240 294.167 240 303.75
           C240 313.333 420 322.917 420 332.5
           C420 342.083 240 351.667 240 361.25
           C240 370.833 420 380.417 420 390
           C420 399.583 240 409.167 240 418.75
           C240 428.333 420 437.917 420 447.5
