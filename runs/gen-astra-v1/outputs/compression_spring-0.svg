           C240 485.833 420 495.417 420 505
           C420 514.583 240 524.167 240 533.75
           C240 543.333 420 552.917 420 562.5
           C420 572.083 240 581.667 240 591.25
           C240 600.833 420 610.417 420 620
           Q420 625 420 630 H230"
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round"/>
  <line x1="230" y1="140" x2="230" y2="160" stroke="#111111" stroke-width="2"/>
  <line x1="230" y1="620" x2="230" y2="640" stroke="#111111" stroke-width="2"/>

  <!-- Outer diameter -->
  <g fill="none" stroke="#222222" stroke-width="1">
    <line x1="230" y1="132" x2="230" y2="83"/>
    <line x1="430" y1="151" x2="430" y2="83"/>
