<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  
  <g fill="none" stroke="#18212b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input source and series path -->
    <line x1="130" y1="150" x2="270" y2="150"/>
    <line x1="130" y1="150" x2="130" y2="220"/>
    <circle cx="130" cy="255" r="35"/>
    <line x1="130" y1="290" x2="130" y2="350"/>
    
    <!-- Source polarity -->
    <line x1="122" y1="241" x2="138" y2="241"/>
    <line x1="130" y1="233" x2="130" y2="249"/>
    <line x1="122" y1="272" x2="138" y2="272"/>
    
    <!-- Zigzag resistor -->
    <polyline points="270,150 280,150 290,134 310,166 330,134 350,166 370,134 390,166 400,150 410,150"/>
    <line x1="410" y1="150" x2="690" y2="150"/>
    
    <!-- Shunt capacitor -->
    <line x1="520" y1="150" x2="520" y2="242"/>
    <line x1="487" y1="242" x2="553" y2="242"/>
    <line x1="487" y1="258" x2="553" y2="258"/>
    <line x1="520" y1="258" x2="520" y2="350"/>
    
    <!-- Common return -->
    <line x1="130" y1="350" x2="520" y2="350"/>
    <line x1="520" y1="350" x2="520" y2="373"/>
    
    <!-- Ground -->
    <line x1="496" y1="373" x2="544" y2="373"/>
    <line x1="504" y1="383" x2="536" y2="383"/>
    <line x1="512" y1="393" x2="528" y2="393"/>
  </g>
  
  <g fill="#18212b" stroke="#18212b" stroke-width="1">
    <circle cx="130" cy="150" r="4"/>
    <circle cx="520" cy="150" r="4"/>
    <circle cx="520" cy="350" r="4"/>
    <circle cx="690" cy="150" r="4"/>
  </g>
  
  <g fill="#18212b" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <text x="400" y="55" text-anchor="middle" font-size="25">First-order RC low-pass filter</text>
    <text x="76" y="262" text-anchor="end">Vin</text>
    <text x="340" y="94" text-anchor="middle">R1</text>
    <text x="340" y="122" text-anchor="middle">10 kΩ</text>
    <text x="578" y="244">C1</text>
    <text x="578" y="274">100 nF</text>
    <text x="690" y="124" text-anchor="middle">Vout</text>
  </g>
</svg>