<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 860">
  <defs>
    <pattern id="showerTile" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <path d="M20 0H0V20" fill="none" stroke="#d1d5db" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="820" height="860" fill="#ffffff"/>

  <!-- Overall dimensions; drawing scale is 80 SVG units per metre. -->
  <g fill="none" stroke="#475569" stroke-width="1">
    <path d="M160 94V40 M640 94V40 M160 60H640"/>
    <path d="M155 65L165 55 M635 65L645 55"/>
    <path d="M154 100H80 M154 740H80 M100 100V740"/>
    <path d="M95 105L105 95 M95 745L105 735"/>
  </g>
  <g fill="#334155" font-family="sans-serif" font-size="15" text-anchor="middle">
    <text x="400" y="49">6 000</text>
    <text x="86" y="420" transform="rotate(-90 86 420)">8 000</text>
  </g>

  <!-- Exterior walls: 200 mm thick, with continuous inner and outer outlines. -->
  <g fill="#e2e8f0" stroke="#17202a" stroke-width="2" stroke-linejoin="miter">
    <path d="M248 100H160V740H216V724H176V116H248Z"/>
    <path d="M408 100H640V420H624V116H408Z"/>
    <path d="M640 580V740H288V724H624V580Z"/>
  </g>

  <!-- Two glazed openings. -->
  <g fill="none" stroke="#256078" stroke-width="1.4">
    <rect x="248" y="100" width="160" height="16"/>
    <path d="M248 106H408 M248 110H408 M328 100V116"/>
    <rect x="624" y="420" width="16" height="160"/>
    <path d="M630 420V580 M634 420V580 M624 500H640"/>
  </g>
  <g fill="#256078" font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="328" y="137">WINDOW 1</text>
    <text x="663" y="500" transform="rotate(90 663 500)">WINDOW 2</text>
  </g>

  <!-- Bathroom: clear interior 2 000 x 2 400 mm, 150 mm partitions. -->
  <g fill="#e2e8f0" stroke="#17202a" stroke-width="1.8">
    <path d="M452 116H464V236H452Z"/>
    <path d="M452 300H464V308H624V320H452Z"/>
  </g>

  <!-- Bathroom inward-opening 800 mm door. -->
  <g fill="none" stroke="#334155">
    <path d="M464 236H528" stroke-width="2"/>
    <path d="M464 300A64 64 0 0 0 528 236" stroke-width="1"/>
  </g>

  <!-- Shower tray. -->
  <rect x="544" y="116" width="80" height="80" fill="url(#showerTile)" stroke="#475569" stroke-width="1.5"/>
  <path d="M550 122H618V190H550Z" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="602" cy="138" r="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <path d="M598 138H606 M602 134V142" fill="none" stroke="#475569" stroke-width="0.8"/>
  <text x="584" y="174" fill="#334155" font-family="sans-serif" font-size="10" text-anchor="middle">SHOWER</text>

  <!-- Toilet, facing into bathroom. -->
  <rect x="480" y="124" width="36" height="17" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <path d="M484 141H512V160C512 181 484 181 484 160Z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <ellipse cx="498" cy="157" rx="10" ry="14" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="498" y="192" fill="#334155" font-family="sans-serif" font-size="10" text-anchor="middle">WC</text>

  <!-- Basin against bathroom's lower wall. -->
  <rect x="563" y="270" width="49" height="38" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
  <ellipse cx="587.5" cy="286" rx="18" ry="11" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <path d="M587.5 303V294" fill="none" stroke="#475569" stroke-width="2"/>
  <circle cx="587.5" cy="286" r="2" fill="#64748b"/>
  <text x="587" y="262" fill="#334155" font-family="sans-serif" font-size="10" text-anchor="middle">BASIN</text>

  <g fill="#17202a" font-family="sans-serif" text-anchor="middle">
    <text x="544" y="216" font-size="13">BATHROOM</text>
    <text x="544" y="232" font-size="11">2.0 × 2.4 m clear</text>
  </g>

  <!-- Kitchenette, 600 mm deep counter along the west wall. -->
  <rect x="176" y="156" width="48" height="240" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <g fill="none" stroke="#64748b" stroke-width="1">
    <path d="M176 228H224 M176 300H224 M176 348H224"/>
    <rect x="182" y="166" width="36" height="48" rx="3"/>
    <rect x="186" y="171" width="28" height="33" rx="5"/>
    <path d="M180 188H190"/>
    <rect x="182" y="246" width="36" height="42"/>
    <circle cx="191" cy="257" r="6"/>
    <circle cx="209" cy="277" r="6"/>
    <path d="M218 357V386"/>
  </g>
  <g fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">
    <text x="200" y="331">PREP</text>
    <text x="200" y="376">FR</text>
    <text x="245" y="276" font-size="13" transform="rotate(-90 245 276)">KITCHENETTE</text>
  </g>

  <!-- Main entrance: 900 mm opening and inward swing. -->
  <g fill="none" stroke="#334155">
    <path d="M216 724V652" stroke-width="2"/>
    <path d="M288 724A72 72 0 0 0 216 652" stroke-width="1"/>
  </g>
  <text x="302" y="697" fill="#334155" font-family="sans-serif" font-size="12">ENTRY</text>
  <text x="252" y="760" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">900</text>

  <g fill="#334155" font-family="sans-serif" text-anchor="middle">
    <text x="420" y="488" font-size="18">LIVING / SLEEPING</text>
    <text x="420" y="511" font-size="12">OPEN STUDIO</text>
  </g>

  <!-- Wall thickness callout. -->
  <path d="M632 650H696V676" fill="none" stroke="#64748b" stroke-width="1"/>
  <circle cx="632" cy="650" r="2.5" fill="#64748b"/>
  <g fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">
    <text x="699" y="691">200 mm</text>
    <text x="699" y="707">EXTERIOR WALL</text>
  </g>

  <g fill="#17202a" font-family="sans-serif" text-anchor="middle">
    <text x="400" y="802" font-size="20">STUDIO APARTMENT — FLOOR PLAN</text>
    <text x="400" y="824" font-size="12">6.0 × 8.0 m overall • Dimensions in mm unless noted</text>
  </g>
</svg>