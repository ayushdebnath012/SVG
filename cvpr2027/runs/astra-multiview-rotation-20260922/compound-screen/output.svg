<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="1500" height="1080" fill="white" /><g font-family="sans-serif" font-size="16"><text id="e7cb8726097" x="35" y="30" fill="#172b3a">MACHINED FIXTURE PLATE | mm | orthographic projections</text><text id="e9ca7c9e169" x="35" y="55" fill="#172b3a">Plate 180 x 100 x 18. Datum X=0 at left, Y=0 at bottom of TOP; Z=0 at upper surface.</text><text id="eba3983af85" x="35" y="80" fill="#172b3a">TOP: right=+X, up=+Y. FRONT: right=+X, down=depth. RIGHT: right=-Y, down=depth.</text><text id="ec55109090a" x="35" y="105" fill="#172b3a">Hole IDs A/B/C identify individual features. All holes are normal to TOP. Dashed edges are hidden.</text><text id="e2c13e6b274" x="587.884573" y="296" fill="#172b3a" font-size="12">B1</text><line id="ee92b8cbb73" x1="585.884573" y1="300" x2="551.243557" y2="320" stroke="#172b3a" stroke-width=".7" /><text id="e2550d79c1d" x="522" y="230.115427" fill="#172b3a" font-size="12">B2</text><line id="e23a6f6d606" x1="520" y1="234.115427" x2="500" y2="268.756443" stroke="#172b3a" stroke-width=".7" /><text id="e0e50837840" x="421" y="206" fill="#172b3a" font-size="12">B3</text><line id="eb7ad0016a6" x1="430" y1="210" x2="430" y2="250" stroke="#172b3a" stroke-width=".7" /><text id="e92835be9a3" x="320" y="230.115427" fill="#172b3a" font-size="12">B4</text><line id="ea60f431faf" x1="340" y1="234.115427" x2="360" y2="268.756443" stroke="#172b3a" stroke-width=".7" /><text id="e913f880c01" x="254.115427" y="296" fill="#172b3a" font-size="12">B5</text><line id="ea2680b3ca1" x1="274.115427" y1="300" x2="308.756443" y2="320" stroke="#172b3a" stroke-width=".7" /><text id="e498b3e41be" x="230" y="386" fill="#172b3a" font-size="12">B6</text><line id="e04d58f19a5" x1="250" y1="390" x2="290" y2="390" stroke="#172b3a" stroke-width=".7" /><text id="ecb96faf234" x="254.115427" y="484" fill="#172b3a" font-size="12">B7</text><line id="ec3f52dbe52" x1="274.115427" y1="480" x2="3