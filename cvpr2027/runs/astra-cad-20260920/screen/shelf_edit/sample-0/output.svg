<text x="35" y="40" font-size="23">Cranked wall-mounted display shelf frame</text>
<text x="35" y="66" font-size="14">Edited structural elevation — centreline dimensions in mm; sections b × h in mm</text>
<rect x="35" y="88" width="1030" height="155" fill="#f5f8fb" stroke="#b6c2ce" stroke-width="1"/>
<text x="50" y="111" font-size="14">E = 200000 N/mm² throughout · Solid rectangular sections · Rigid joints · A fully clamped</text>
<text x="50" y="135" font-size="13">Linear elastic, small-displacement 2D frame: axial and Euler–Bernoulli bending; no shear deformation.</text>
<text x="50" y="159" font-size="13">Calculated by equilibrium and virtual work. Displacement signs: +x right, +y up.</text>
<text data-result="ux_mm" x="50" y="188" font-size="17">ux(E) = -0.837915 mm</text>
<text data-result="uy_mm" x="375" y="188" font-size="17">uy(E) = -35.5110 mm</text>
<text data-result="peak_stress_mpa" x="730" y="188" font-size="17">Peak stress = 141.797 MPa</text>
<text x="50" y="214" font-size="13">Probe: node E</text>
<text x="375" y="214" font-size="13" fill="#a12828">|uy| = 35.5110 &gt; 8.0 mm — FAIL</text>
<text x="730" y="214" font-size="13" fill="#27623f">141.797 &lt; 180.0 MPa — PASS</text>
<text x="50" y="234" font-size="12">Checks apply only to their named limits; they do not establish overall product or building safety.</text>
</g>

