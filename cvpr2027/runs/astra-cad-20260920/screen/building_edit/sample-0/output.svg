<text x="35" y="730" font-size="13">MODEL: 2D linear elasticity; small displacements; rigid joints; axial + Euler–Bernoulli bending.</text>
<text x="35" y="752" font-size="13">Nodal loads only. No shear deformation, self-weight, buckling, out-of-plane effects or connection flexibility.</text>
<text x="35" y="774" font-size="13">Stress measure: max over member ends of |N|/A + |M|(h/2)/I.</text>
<text x="35" y="796" font-size="12">Results are hand stiffness estimates with axial-compatibility corrections, not a numerical solver result.</text>
<text x="35" y="819" font-size="12">Named checks apply only to this idealised frame; no claim of complete building or product safety.</text>
