    <line x1="900" y1="630" x2="938" y2="630"/>
  </g>

  <!-- Dimensions in plate-coordinate units. -->
  <g fill="none" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="712" x2="100" y2="817"/>
    <line x1="900" y1="712" x2="900" y2="817"/>
    <line x1="88" y1="300" x2="37" y2="300"/>
    <line x1="88" y1="700" x2="37" y2="700"/>
