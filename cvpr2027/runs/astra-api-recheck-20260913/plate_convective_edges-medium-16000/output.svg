<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <marker id="dimension-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 8 1 L 0 4 L 8 7" fill="none" stroke="#475569" stroke-width="1.3"/>
    </marker>
    <marker id="heat-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#b56322" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff" stroke="none"/>

  <g font-family="sans-serif">
    <text x="100" y="92" fill="#172b3a" font-size="28" font-weight="600">Steady two-dimensional heat conduction</text>
    <text x="100" y="132" fill="#475569" font-size="20">Rectangular plate · 0 ≤ x ≤ 2, 0 ≤ y ≤ 1</text>
    <text x="100" y="179" fill="#172b3a" font-size="20">Ambient T∞ = 0 °C     h/k = 5 per unit length</text>
    <text x="100" y="211" fill="#475569" font-size="18">Convective edges: ∂T/∂n = −5T, with n directed outward</text>
  </g>

  <!-- Plate: X = 100 + 400x, Y = 700 - 400y. -->
  <rect x="100" y="300" width="800" height="400" fill="#fbfdff" stroke="none"/>

