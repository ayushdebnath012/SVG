  <g fill="none" stroke="#475569" stroke-width="1.3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)">
    <line x1="100" y1="798" x2="900" y2="798"/>
    <line x1="45" y1="300" x2="45" y2="700"/>
  </g>
  <rect x="480" y="784" width="40" height="28" fill="#ffffff" stroke="none"/>
  <rect x="31" y="484" width="28" height="32" fill="#ffffff" stroke="none"/>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#334155">
    <text x="500" y="805">2</text>
    <text x="45" y="507">1</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#64748b">
    <text x="100" y="839">x = 0</text>
    <text x="900" y="839" text-anchor="end">x = 2</text>
    <text x="115" y="727">y = 0</text>
    <text x="115" y="281">y = 1</text>
  </g>

  <line x1="100" y1="894" x2="149" y2="894" stroke="#1676a3" stroke-width="2.4"/>
  <text x="165" y="900" font-family="sans-serif" font-size="18" fill="#334155">Isotherms: 10, 20, 40, 60 and 80 °C</text>
  <text x="100" y="936" font-family="sans-serif" font-size="17" fill="#64748b">All five contours terminate obliquely on the horizontal convective edges.</text>
</svg>