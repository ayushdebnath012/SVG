  <!-- Boundary lines drawn over the contour endpoints. -->
  <path d="M 100 300 H 900 V 700 H 100" fill="none" stroke="#b56322" stroke-width="3"/>
  <line x1="100" y1="300" x2="100" y2="700" stroke="#b33333" stroke-width="5"/>

  <g font-family="sans-serif" font-size="16" fill="#12648b">
    <text x="159" y="496">80 °C</text>
    <text x="220" y="496">60 °C</text>
    <text x="297" y="496">40 °C</text>
    <text x="421" y="496">20 °C</text>
    <text x="542" y="496">10 °C</text>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <text x="730" y="487" fill="#475569" font-size="20">Conductivity k</text>
    <text x="730" y="521" fill="#475569" font-size="22">∇²T = 0</text>
    <text x="79" y="500" transform="rotate(-90 79 500)" fill="#b33333" font-size="19">T = 100 °C</text>
    <text x="650" y="263" fill="#94501b" font-size="18">Convection · ∂T/∂n = −5T</text>
    <text x="650" y="747" fill="#94501b" font-size="18">Convection · ∂T/∂n = −5T</text>
    <text x="971" y="500" transform="rotate(90 971 500)" fill="#94501b" font-size="18">Convection · ∂T/∂n = −5T</text>
  </g>

  <g fill="none" stroke="#b56322" stroke-width="1.6" marker-end="url(#heat-arrow)">
    <line x1="600" y1="300" x2="600" y2="278"/>
    <line x1="750" y1="300" x2="750" y2="278"/>
