<g font-size="13">
<text x="35" y="733">Rigid joints; linear elasticity and small displacements; axial and Euler–Bernoulli bending deformation only.</text>
<text x="35" y="756">No shear deformation, self-weight, buckling, out-of-plane effects or connection flexibility. Loads act only at listed nodes.</text>
<text x="35" y="779">This drawing addresses only the stated 2D frame, not complete product or building validation. Load arrows are not to scale.</text>
