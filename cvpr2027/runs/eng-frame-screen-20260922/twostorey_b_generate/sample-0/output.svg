<text x="838" y="479" font-size="13">ux:</text><text data-result="ux_mm" x="890" y="479" font-size="14">+1.67 mm</text>
<text x="838" y="505" font-size="13">uy:</text><text data-result="uy_mm" x="890" y="505" font-size="14">−0.0684 mm</text>
<text x="838" y="536" font-size="12">Peak |N|/A + |M|(h/2)/I:</text>
<text data-result="peak_stress_mpa" x="838" y="559" font-size="16" font-weight="bold">13.3 MPa</text>
<text x="838" y="585" font-size="12">|uy| ≤ 12.0 mm: estimated pass</text>
<text x="838" y="606" font-size="12">Stress ≤ 180 MPa: estimated pass</text>
<text x="838" y="632" font-size="11">Named checks only; not overall safety.</text>
<text x="30" y="689" font-size="14" font-weight="bold">MODEL AND RESULT QUALIFICATIONS</text>
<text x="30" y="713" font-size="12">All three bases: ux = uy = rotation = 0. Supports are ideal clamps, not freely resting feet.</text>
<text x="30" y="735" font-size="12">Linear elastic, small-displacement 2D frame; rigid joints; axial and Euler–Bernoulli bending response; nodal loads only.</text>
<text x="30" y="757" font-size="12">Omitted: shear deformation, self-weight, buckling, out-of-plane response and connection flexibility.</text>
<text x="30" y="779" font-size="12">Results are hand stiffness estimates, not solver-verified. Beam axial drift differences are neglected in the estimate.</text>
<text x="30" y="801" font-size="12">Peak estimated stress occurs at the clamped end of col_2_0. Dimensions are physical centreline lengths.</text>
<text x="30" y="827" font-size="12" font-weight="bold">This drawing addresses only the stated frame and the two named limits, not complete product/building validation.</text>
