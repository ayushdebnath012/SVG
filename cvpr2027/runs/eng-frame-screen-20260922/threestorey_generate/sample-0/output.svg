<text x="480" y="388" font-size="17" font-weight="bold">RESPONSE — ESTIMATED</text>
<text x="480" y="412" font-size="12">Hand-evaluated linear-frame equilibrium; rounded estimates.</text>
<text x="480" y="443" font-size="14">N1_3 · signed horizontal displacement</text>
<text data-result="ux_mm" x="860" y="443" font-size="16" font-weight="bold">+8.02 mm</text>
<text x="480" y="475" font-size="14">N1_3 · signed vertical displacement</text>
<text data-result="uy_mm" x="860" y="475" font-size="16" font-weight="bold">−0.186 mm</text>
<text x="480" y="507" font-size="14">Peak member-end extreme-fibre stress</text>
<text data-result="peak_stress_mpa" x="860" y="507" font-size="16" font-weight="bold">33.6 MPa</text>
<text x="480" y="534" font-size="12">max [|N|/A + |M|(h/2)/I]; governing end: col_1_0 at N1_0.</text>
<text x="480" y="568" font-size="14" fill="#276347">Vertical check: |uy| ≈ 0.186 mm ≤ 12.0 mm — PASS*</text>
<text x="480" y="593" font-size="14" fill="#276347">Stress check: peak ≈ 33.6 MPa ≤ 180.0 MPa — PASS*</text>
<text x="480" y="618" font-size="12">*For these named checks only, using the estimated response.</text>
<text x="480" y="655" font-size="15" font-weight="bold">ANALYSIS SCOPE</text>
<g font-size="12">
<text x="480" y="679">Linear elasticity; small displacements; rigid joints.</text>
<text x="480" y="699">Axial and Euler–Bernoulli bending response; nodal loads only.</text>
<text x="480" y="719">No shear deformation, self-weight, buckling, out-of-plane</text>
<text x="480" y="739">behaviour or connection flexibility included.</text>
<text x="480" y="767">This 2D idealisation is not complete building validation.</text>
</g>
