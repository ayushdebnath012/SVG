2 M342.0625 614 l-8 12 M352.0625 614 l-8 12 M362.0625 614 l-8 12 M561.125 614 l-8 12 M571.125 614 l-8 12 M581.125 614 l-8 12 M591.125 614 l-8 12 M601.125 614 l-8 12"/></g><g font-family="Arial, sans-serif" font-size="12" fill="#18232e"><text x="100" y="647" text-anchor="middle">N0_0</text><text x="339.0625" y="647" text-anchor="middle">N1_0</text><text x="578.125" y="647" text-anchor="middle">N2_0</text><text x="109" y="427">N0_1</text><text x="348" y="427">N1_1</text><text x="588" y="427">N2_1</text><text x="110" y="188">N0_2</text><text x="349" y="188">N1_2 · probe</text><text x="339" y="678" text-anchor="middle">All three bases: ux = uy = θ = 0 (ideal clamps)</text></g><g stroke="#b63c2d" stroke-width="2" fill="none"><path d="M18 202.1875 H92 M18 406.09375 H92 M100 113 V194 M339.0625 113 V194 M100 321 V398 M578.125 321 V398"/></g><g fill="#b63c2d"><path d="M96 202.1875 L85 197.1875 L85 207.1875 Z M96 406.09375 L85 401.09375 L85 411.09375 Z M100 198 L95 187 L105 187 Z M339.0625 198 L334.0625 187 L344.0625 187 Z M100 402 L95 391 L105 391 Z M578.125 402 L573.125 391 L583.125 391 Z"/></g><g font-family="Arial, sans-serif" font-size="12" fill="#a33024"><text x="18" y="176">12000 N →</text><text x="18" y="379">10500 N →</text><text x="110" y="128">34000 N ↓</text><text x="350" y="128">48000 N ↓</text><text x="111" y="340">30000 N ↓</text><text x="589" y="340">43000 N ↓</text></g><path d="M686 96 V795" stroke="#c6cdd4" stroke-width="1" fill="none"/><g font-family="Arial, sans-serif" fill="#18232e"><text x="710" y="114" font-size="16" font-weight="bold">SECTIONS / MATERIAL</text><text x="710" y="143" font-size="13">Solid rectangles; dimensions b × h in mm</text><text x="710" y="165" font-size="13">b out of plane; h in frame plane</text><text x="710" y="198" font-size="13">col_0_0, col_1_0, col_2_0: 160 × 200</text><text x="710" y="223" font-size="13">col_0_1, col_1_1: 140 × 180</text><text x="710" y="248" font-size="13">beam_0_1, beam_1_1: 140 × 260</text><text x="710" y="273" font-size="13">beam_0_2: 140 × 240</text><text x="710" y="302" font-size="13">E = 200000 N/mm² for every member</text><text x="710" y="349" font-size="16" font-weight="bold">RESPONSE — ESTIMATED</text><text x="710" y="374" font-size="13">Probe N1_2; +x right, +y up</text><text x="710" y="404" font-size="14" data-result="ux_mm">ux = +2.36 mm</text><text x="710" y="433" font-size="14" data-result="uy_mm">uy = -0.0556 mm</text><text x="710" y="462" font-size="14" data-result="peak_stress_mpa">Peak normal stress = 14.9 MPa</text><text x="710" y="488" font-size="12">Governing end: col_1_1 at N1_1</text><text x="710" y="525" font-size="14" font-weight="bold">NAMED LIMIT CHECKS</text><text x="710" y="553" font-size="13">|uy| = 0.0556 ≤ 12.0 mm: PASS*</text><text x="710" y="580" font-size="13">Peak stress = 14.9 ≤ 180.0 MPa: PASS*</text><text x="710" y="608" font-size="12">*Based on estimated response only.</text><text x="710" y="630" font-size="12">No whole-frame or building safety claim.</text><text x="710" y="674" font-size="14" font-weight="bold">IDEALISED 2D MODEL</text><text x="710" y="699" font-size="12">Linear elastic; small displacement; rigid joints.</text><text x="710" y="721" font-size="12">Axial + Euler–Bernoulli bending only.</text><text x="710" y="743" font-size="12">No shear deformation, self-weight or buckling.</text><text x="710" y="765" font-size="12">No out-of-plane or connection flexibility.</text><text x="710" y="787" font-size="12">Loads applied only at the specified nodes.</text><text x="40" y="724" font-size="14" font-weight="bold">DRAWING / ANALYSIS NOTES</text><text x="40" y="750" font-size="12">Each dark member line is its physical centreline; no deformed shape is shown.</text><text x="40" y="772" font-size="12">Hand-evaluated stiffness estimate with finite axial-displacement corrections; no solver run.</text><text x="40" y="794" font-size="12">Stress envelope: max over all member ends of |N|/A + |M|(h/2)/I.</text><text x="40" y="822" font-size="11" fill="#526577">Coordinate map: X = 100 + 0.0703125x; Y = 610 − 0.0703125y.</text></g></svg>