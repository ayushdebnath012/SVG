<text x="35" y="760" font-size="12">Hand reduced-stiffness estimate: common horizontal floor translations, with beam-chord corrections from column axial shortening.</text>
<text x="35" y="780" font-size="12">Peak stress estimated over member ends using |N|/A + |M|(h/2)/I; A = bh, I = bh³/12. A full frame solution was not performed.</text>
