<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" overflow="hidden">
  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff" stroke="none"/>

  <!-- Exact Apollonius circles:
       x_c = 0.5 coth(V/20), R = 0.5 / |sinh(V/20)|.
       Mapping: X = 500 + 300x, Y = 500 - 300y.
       The viewport crops the contours; its edges are not potential boundaries. -->

  <g font-family="sans-serif" text-anchor="middle">
    <text x="500" y="32" font-size="22" fill="#17212b">Equal and opposite infinite line charges</text>
    <text x="500" y="60" font-size="18" fill="#17212b">V = 20 ln(r₋ / r₊) volts</text>
  </g>

  <line x1="0" y1="500" x2="1000" y2="500" stroke="#c5cbd1" stroke-width="1"/>
  <text x="973" y="488" font-family="sans-serif" font-size="16" fill="#66717c">x</text>

  <g data-field="V" data-status="solved" fill="none" stroke-width="2.5">
    <path data-level="-40"
      d="M 385.760876606635,500
         A 41.358084715767,41.358084715767 0 1 0 303.044707175101,500
         A 41.358084715767,41.358084715767 0 1 0 385.760876606635,500 Z"
      stroke="#245da8"/>
    <path data-level="-20"
      d="M 430.682426410998,500
         A 127.637719235898,127.637719235898 0 1 0 175.406987939202,500
         A 127.637719235898,127.637719235898 0 1 0 430.682426410998,500 Z"
      stroke="#245da8"/>
    <path data-level="-10"
      d="M 463.262200639443,500
         A 287.855212700242,287.855212700242 0 1 0 -112.448224761041,500
         A 287.855212700242,287.855212700242 0 1 0 463.262200639443,500 Z"
      stroke="#245da8"/>
    <path data-level="-5"
      d="M 481.347049734260,500
         A 593.795274495280,593.795274495280 0 1 0 -706.243499256300,500
         A 593.795274495280,593.795274495280 0 1 0 481.347049734260,500 Z"
      stroke="#245da8"/>

    <path data-level="0" d="M 500,0 L 500,1000"
      stroke="#7b858e" stroke-width="1.5" stroke-dasharray="7 7"/>

    <path data-level="5"
      d="M 518.652950265740,500
         A 593.795274495280,593.795274495280 0 1 0 1706.243499256300,500
         A 593.795274495280,593.795274495280 0 1 0 518.652950265740,500 Z"
      stroke="#b83b32"/>
    <path data-level="10"
      d="M 536.737799360557,500
         A 287.855212700242,287.855212700242 0 1 0 1112.448224761041,500
         A 287.855212700242,287.855212700242 0 1 0 536.737799360557,500 Z"
      stroke="#b83b32"/>
    <path data-level="20"
      d="M 569.317573589002,500
         A 127.637719235898,127.637719235898 0 1 0 824.593012060798,500
         A 127.637719235898,127.637719235898 0 1 0 569.317573589002,500 Z"
      stroke="#b83b32"/>
    <path data-level="40"
      d="M 614.239123393365,500
         A 41.358084715767,41.358084715767 0 1 0 696.955292824899,500
         A 41.358084715767,41.358084715767 0 1 0 614.239123393365,500 Z"
      stroke="#b83b32"/>

    <g font-family="sans-serif" font-size="19" text-anchor="middle" stroke="none">
      <text x="344" y="446" fill="#245da8">−40 V</text>
      <text x="303" y="359" fill="#245da8">−20 V</text>
      <text x="175" y="198" fill="#245da8">−10 V</text>
      <text x="266" y="88" fill="#245da8">−5 V</text>
      <text x="734" y="88" fill="#b83b32">5 V</text>
      <text x="825" y="198" fill="#b83b32">10 V</text>
      <text x="697" y="359" fill="#b83b32">20 V</text>
      <text x="656" y="446" fill="#b83b32">40 V</text>
      <text x="516" y="824" text-anchor="start" fill="#626d77">0 V: x = 0</text>
    </g>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="350" cy="500" r="12" fill="#245da8" stroke="#ffffff" stroke-width="2"/>
    <line x1="344" y1="500" x2="356" y2="500" stroke="#ffffff" stroke-width="2"/>
    <text x="350" y="543" font-size="19" fill="#245da8">−λ</text>
    <text x="350" y="567" font-size="16" fill="#17212b">(−0.5, 0)</text>

    <circle cx="650" cy="500" r="12" fill="#b83b32" stroke="#ffffff" stroke-width="2"/>
    <line x1="644" y1="500" x2="656" y2="500" stroke="#ffffff" stroke-width="2"/>
    <line x1="650" y1="494" x2="650" y2="506" stroke="#ffffff" stroke-width="2"/>
    <text x="650" y="543" font-size="19" fill="#b83b32">+λ</text>
    <text x="650" y="567" font-size="16" fill="#17212b">(0.5, 0)</text>
  </g>

  <g font-family="sans-serif" font-size="16" fill="#46515c">
    <text x="18" y="26">y = 5/3</text>
    <text x="18" y="978">x = −5/3</text>
    <text x="982" y="978" text-anchor="end">x = 5/3</text>
    <text x="18" y="950">y = −5/3</text>
    <text x="500" y="919" text-anchor="middle">Unbounded free space: V → 0 at infinity</text>
    <text x="500" y="945" text-anchor="middle">Frame is a viewing window, not a boundary</text>
    <text x="500" y="976" text-anchor="middle">X = 500 + 300x; Y = 500 − 300y</text>
  </g>

  <rect x="0" y="0" width="1000" height="1000" fill="none" stroke="#17212b" stroke-width="2"/>
</svg>