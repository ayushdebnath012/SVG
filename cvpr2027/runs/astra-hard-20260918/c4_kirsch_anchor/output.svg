  <line x1="40" y1="866" x2="960" y2="866" stroke="#c4cdd3" stroke-width="1"/>
  <text x="40" y="890" font-family="sans-serif" font-size="14" fill="#263746">Exact Kirsch stresses, divided by σ∞; u = a²/r², θ measured from +x:</text>
  <text x="40" y="914" font-family="sans-serif" font-size="14" fill="#52616b">σrr / σ∞ = ½(1 − u) + ½(1 − 4u + 3u²) cos(2θ)</text>
  <text x="40" y="938" font-family="sans-serif" font-size="14" fill="#52616b">σθθ / σ∞ = ½(1 + u) − ½(1 + 3u²) cos(2θ)</text>
  <text x="40" y="962" font-family="sans-serif" font-size="14" fill="#52616b">τrθ / σ∞ = −½(1 + 2u − 3u²) sin(2θ)</text>
  <text x="570" y="914" font-family="sans-serif" font-size="14" fill="#52616b">σvm = √(σrr² − σrrσθθ + σθθ² + 3τrθ²)</text>
  <text x="570" y="938" font-family="sans-serif" font-size="14" fill="#52616b">At infinity: σxx → σ∞; σyy, τxy → 0</text>
  <text x="570" y="962" font-family="sans-serif" font-size="14" fill="#52616b">Frame: −2.5 ≤ x, y ≤ 2.5 · 200 drawing units / unit</text>
  <text x="500" y="986" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#687985">Frame is an observation window, not a loaded finite boundary. Arrows indicate remote loading.</text>
</svg>