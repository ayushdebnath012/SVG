<g font-size="13">
<text x="35" y="746">Linear elasticity; small displacements; rigid joints; axial and Euler–Bernoulli bending response.</text>
<text x="35" y="769">Loads act only at G, H and F. Peak stress = max over member ends of |N|/A + |M|(h/2)/I.</text>
