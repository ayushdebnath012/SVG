<text x="550" y="108" font-size="13">Upper columns: solid b × h = 140 × 180 mm</text>
<text x="35" y="130" font-size="13">Level 1 beams: solid b × h = 140 × 260 mm</text>
<text x="550" y="130" font-size="13">Roof beams: solid b × h = 140 × 240 mm</text>
<text x="35" y="151" font-size="12">E = 200000 N/mm² throughout; h is in-plane, b out-of-plane. Loads occur only at labelled nodes.</text>
</g>
