<g font-family="Arial, sans-serif" fill="#172632">
<text x="510" y="132" font-size="17" font-weight="bold">SECTION SCHEDULE</text>
<text x="510" y="171" font-size="12">Solid rectangles; b out of plane, h in plane. Sizes b × h, mm.</text>
<text x="510" y="189" font-size="11">i = column line 0, 1, 2; j = bay 0, 1. E = 200000 N/mm² throughout.</text>
<text x="510" y="218" font-size="13">Storey 1</text><text x="610" y="218" font-size="13">col_i_0: 160 × 200</text><text x="835" y="218" font-size="13">beam_j_1: 140 × 260</text>
<text x="510" y="253" font-size="13">Storey 2</text><text x="610" y="253" font-size="13">col_i_1: 140 × 180</text><text x="835" y="253" font-size="13">beam_j_2: 140 × 240</text>
<text x="510" y="288" font-size="13">Storey 3</text><text x="610" y="288" font-size="13">col_i_2: 140 × 160</text><text x="835" y="288" font-size="13">beam_j_3: 140 × 220</text>
<text x="510" y="323" font-size="13">Storey 4</text><text x="610" y="323" font-size="13">col_i_3: 140 × 140</text><text x="835" y="323" font-size="13">beam_j_4: 140 × 200</text>
<text x="510" y="358" font-size="12">A = bh; I = bh³/12; extreme-fibre distance = h/2.</text>
<text x="510" y="379" font-size="12">12 columns: 2800 mm each. 8 beams: 3500 mm each.</text>
<text x="510" y="400" font-size="12">Dimensions measure node-to-node centreline lengths.</text>
<text x="510" y="440" font-size="17" font-weight="bold">RESPONSE / LIMIT CHECKS</text>
<text x="510" y="464" font-size="12">Probe: N2_4, physical coordinate (7000, 11200) mm.</text>
<text x="510" y="491" font-size="13">Signed horizontal displacement:</text>
<text x="825" y="491" font-size="13" data-result="ux_mm">unavailable</text>
<text x="510" y="517" font-size="13">Signed vertical displacement:</text>
<text x="825" y="517" font-size="13" data-result="uy_mm">unavailable</text>
<text x="510" y="543" font-size="13">Peak extreme-fibre normal stress:</text>
<text x="825" y="543" font-size="13" data-result="peak_stress_mpa">unavailable</text>
<text x="510" y="569" font-size="12">Stress definition: max over all ends [|N|/A + |M|(h/2)/I].</text>
<text x="510" y="589" font-size="12">|uy| ≤ 12.0 mm: not evaluated. Peak stress ≤ 180.0 MPa: not evaluated.</text>
<text x="510" y="609" font-size="12" fill="#925a17">No numerical frame solution performed; no pass/fail finding.</text>
<text x="510" y="646" font-size="17" font-weight="bold">MODEL AND SCOPE</text>
<text x="510" y="672" font-size="12">Linear elasticity, small displacements, rigid joints;</text>
<text x="510" y="692" font-size="12">axial deformation and Euler–Bernoulli bending only.</text>
<text x="510" y="712" font-size="12">At N0_0, N1_0, N2_0: ux = uy = rotation = 0.</text>
<text x="510" y="732" font-size="12">Loads act only at shown nodes; no applied nodal moments.</text>
<text x="510" y="752" font-size="12">Omitted: shear deformation, self-weight, buckling,</text>
<text x="510" y="772" font-size="12">out-of-plane behaviour and connection flexibility.</text>
<text x="510" y="792" font-size="12">This 2D model is not complete building or product validation.</text>
<text x="30" y="677" font-size="12">Fixed supports are idealised restraints, not floor contact.</text>
<text x="30" y="699" font-size="12">Member and node IDs are retained from the physical model.</text>
<text x="160" y="748" font-size="11">Global axes; signed displacements follow these directions.</text>
<text x="160" y="770" font-size="11">X = 100 + 0.038135593220339 x</text>
<text x="160" y="790" font-size="11">Y = 610 − 0.038135593220339 y</text>
<text x="30" y="829" font-size="11">Only the named displacement and stress limits apply; no overall safety claim is made.</text>
</g>
