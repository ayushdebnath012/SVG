<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850">
<title>Two-bay four-storey frame — dimensioned structural elevation</title>
<desc>Twenty straight centreline members with rigid joints and three clamped bases. All twenty member lengths are dimensioned in millimetres. Loads are shown at their specified nodes. Numerical displacement and stress results are unavailable.</desc>
