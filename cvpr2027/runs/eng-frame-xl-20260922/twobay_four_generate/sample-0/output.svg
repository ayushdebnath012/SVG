<text x="30" y="59" font-size="14">Structural elevation • undeformed member centrelines • dimensions in mm</text>
<text x="30" y="82" font-size="12">Rigid joints; all three bases clamped. Blue arrows denote applied nodal forces in N.</text>
</g>
