roke-width="1"/><g font-family="Arial, sans-serif" fill="#182b3a"><text x="28" y="680" font-size="12">Solid sections, b × h: lower columns 160 × 200; upper columns 140 × 180; level-1 beams 140 × 260; roof beams 140 × 240 mm.</text><text x="28" y="700" font-size="12">h in frame plane; b out of plane. E = 200000 N/mm² for every member. Drawing shows undeformed centrelines.</text><text x="28" y="729" font-size="14" font-weight="bold">ESTIMATED RESULTS — N3_2:</text><text data-result="ux_mm" x="315" y="729" font-size="14">ux = +1.40 mm</text><text data-result="uy_mm" x="503" y="729" font-size="14">uy = −0.0730 mm</text><text data-result="peak_stress_mpa" x="719" y="729" font-size="14">Peak end stress = 10.7 MPa</text><text x="28" y="752" font-size="12">Estimated checks: |uy| = 0.0730 ≤ 12.0 mm; peak stress = 10.7 ≤ 180.0 MPa. Both named checks provisionally pass.</text><text x="28" y="774" font-size="12">Reduced-frame hand estimates, not a full stiffness solution; three-digit display does not imply three-digit accuracy.</text><text x="28" y="796" font-size="12">Linear elastic, small-displacement 2D frame; axial + Euler–Bernoulli bending. Nodal loads only; rigid joints.</text><text x="28" y="817" font-size="11">Excluded: shear deformation, self-weight, buckling, out-of-plane response and connection flexibility. No overall safety or building-validation claim.</text></g></svg>