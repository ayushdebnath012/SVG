<text x="35" y="715" font-size="13" font-weight="bold">MODEL AND DRAWING NOTES</text>
<g font-size="12">
<text x="35" y="737">Rigid joints; linear elasticity and small displacements; axial and Euler–Bernoulli bending only. Loads act at the indicated nodes only.</text>
<text x="35" y="759">Omitted: shear deformation, self-weight, buckling, out-of-plane behaviour and connection flexibility. Applied nodal moments are zero.</text>
<text x="35" y="781">Dimensions are physical centreline lengths in mm. Load arrows are schematic, not force-scaled. All other nodes, sections and loads are unchanged.</text>
<text x="35" y="803">Coordinate map: X = 100 + (3/56)x; Y = 610 − (3/56)y. Physical x and y in mm; drawing coordinates in SVG units.</text>
<text x="35" y="825">Only the stated 2D frame is represented. Any future pass applies only to its named check, not to complete object or building safety.</text>
