<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
<rect id="background" width="1000" height="700" fill="white"/>
<text id="title" x="40" y="45" font-size="24" font-weight="bold">DC series circuit</text>
<g id="battery" stroke="#172b4d" stroke-width="4">
<line id="battery-long" x1="120" y1="250" x2="120" y2="390"/>
<line id="battery-short" x1="145" y1="275" x2="145" y2="365"/>
</g>
<line id="wire-left" x1="120" y1="250" x2="210" y2="250" stroke="#172b4d" stroke-width="4"/>
<g id="resistor-1">
<rect id="resistor-1-body" x="210" y="225" width="100" height="50" rx="5" fill="#fff2cc" stroke="#172b4d" stroke-width="3"/>
<text id="resistor-1-label" x="260" y="210" font-size="16" text-anchor="middle">R1 35 Ω</text>
</g>
<line id="wire-1-2" x1="310" y1="250" x2="420" y2="250" stroke="#172b4d" stroke-width="4"/>
<g id="resistor-2">
<rect id="resistor-2-body" x="420" y="225" width="100" height="50" rx="5" fill="#fff2cc" stroke="#172b4d" stroke-width="3"/>
<text id="resistor-2-label" x="470" y="210" font-size="16" text-anchor="middle">R2 10 Ω</text>
</g>
<path id="wire-return" d="M520 250 H880 V470 H120 V390" fill="none" stroke="#172b4d" stroke-width="4"/>
<text id="voltage-note" x="95" y="325" font-size="17" text-anchor="end">36 V</text>
<text id="rating-note" x="500" y="540" font-size="15" text-anchor="middle">Each resistor rated 25 W</text>
</svg>