<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="1500" height="1080" fill="white" /><g font-family="sans-serif" font-size="16"><text id="e7cb8726097" x="35" y="30" fill="#172b3a">MACHINED FIXTURE PLATE | mm | orthographic projections</text><text id="e9ca7c9e169" x="35" y="55" fill="#172b3a">Plate 180 x 100 x 18. Datum X=0 at left, Y=0 at bottom of TOP; Z=0 at upper surface.</text><text id="eba3983af85" x="35" y="80" fill="#172b3a">TOP: right=+X, up=+Y. FRONT: right=+X, down=depth. RIGHT: right=-Y, down=depth.</text><text id="ec55109090a" x="35" y="105" fill="#172b3a">Hole IDs A/B/C identify individual features. All holes are normal to TOP. Dashed edges are hidden.</text><text id="e2c13e6b274" x="204" y="478" fill="#172b3a" font-size="12">B1</text><line id="ee92b8cbb73" x1="203" y1="482" x2="194" y2="498" stroke="#172b3a" stroke-width=".7" /><text id="e2550d79c1d" x="272" y="498" fill="#172b3a" font-size="12">C2</text><line id="e23a6f6d606" x1="271" y1="502" x2="262" y2="518" stroke="#172b3a" stroke-width=".7" /><text id="e0e50837840" x="408" y="458" fill="#172b3a" font-size="12">A3</text><line id="eb7ad0016a6" x1="407" y1="462" x2="398" y2="478" stroke="#172b3a" stroke-width=".7" /><text id="e92835be9a3" x="576" y="486" fill="#172b3a" font-size="12">B4</text><line id="ea60f431faf" x1="575" y1="490" x2="566" y2="506" stroke="#172b3a" stroke-width=".7" /><text id="e913f880c01" x="672" y="466" fill="#172b3a" font-size="12">C5</text><line id="ea2680b3ca1" x1="671" y1="470" x2="662" y2="486" stroke="#172b3a" stroke-width=".7" /><text id="e498b3e41be" x="180" y="270" fill="#172b3a" font-size="12">A6</text><line id="e04d58f19a5" x1="179" y1="274" x2="170" y2="290" stroke="#172b3a" stroke-width=".7" /><text id="ecb96faf234" x="356" y="294" fill="#172b3a" font-size="12">B7</text><line id="ec3f52dbe52" x1="355" y1="298" x2="346" y2="314" stroke="#172b3a" stroke-width=".7" /><text id="e4db61abcc1" x="428" y="254" fill="#172b3a" font-size="12">C8</text><line id="ee68b8a335b" x1="427" y1="258" x2="418" y2="274" stroke="#172b3a" stroke-width=".7" /><text id="e9c0a002d0f" x="600" y="282" fill="#172b3a" font-size="12">B9</text><line id="eb7e0b1aec6" x1="599" y1="286" x2="590" y2="302" stroke="#172b3a" stroke-width=".7" /><text id="eaaebe88d04" x="684" y="314" fill="#172b3a" font-size="12">A10</text><line id="e19f564db9d" x1="683" y1="318" x2="674" y2="334" stroke="#172b3a" stroke-width=".7" /><text id="ea1c1e3eda3" x="70" y="170" fill="#172b3a">TOP (X,Y)</text><text id="e29dcccdb24" x="70" y="673" fill="#172b3a">FRONT (X,depth)</text><text id="e1667d2b5db" x="990" y="673" fill="#172b3a">RIGHT (-Y,depth)</text><text id="ed4ea4c82a9" x="40" y="850" fill="#172b3a">A: DIA 6 THRU</text><text id="ef1d1e475d9" x="40" y="875" fill="#172b3a">B: DIA 14 THRU</text><text id="e5b38c35bbd" x="40" y="900" fill="#172b3a">C: DIA 6 THRU, COUNTERBORE DIA 14 DEPTH 4</text><text id="edab06528ed" x="40" y="925" fill="#172b3a">No countersinks, fillets or other features. All views are 4 page units per mm; RIGHT is reflected as labeled.</text></g><g transform="translate(70,590) scale(4,-4)" stroke="#172b3a" stroke-width=".25" fill="none"><rect id="ef3ba41d1bb" x="-0.0" y="0.0" width="180.0" height="100.0" /><circle id="ea2caaed1b1" cx="31" cy="23" r="7" /><circle id="e8d61a3a20e" cx="48" cy="18" r="3" /><circle id="e9b71d8dc69" cx="48" cy="18" r="7" /><circle id="e0651139d7a" cx="82" cy="28" r="3" /><circle id="eefb661225b" cx="124" cy="21" r="7" /><circle id="edd2f7de080" cx="148" cy="26" r="3" /><circle id="ebd46c16a74" cx="148" cy="26" r="7" /><circle id="e680363c9ca" cx="25" cy="75" r="3" /><circle id="ee27c31481c" cx="69" cy="69" r="7" /><circle id="e4d4222cffa" cx="87" cy="79" r="3" /><circle id="ec5ed40ae96" cx="87" cy="79" r="7" /><circle id="e682c1852c7" cx="130" cy="72" r="7" /><circle id="e3aadc5ce8e" cx="151" cy="64" r="3" /></g><g transform="translate(70,690) scale(4,4)" stroke="#172b3a" stroke-width