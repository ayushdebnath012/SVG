<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="1500" height="1080" fill="white" /><g font-family="sans-serif" font-size="16"><text id="e7cb8726097" x="35" y="30" fill="#172b3a">MACHINED FIXTURE PLATE | mm | orthographic projections</text><text id="e9ca7c9e169" x="35" y="55" fill="#172b3a">Plate 180 x 100 x 18. Datum X=0 at left, Y=0 at bottom of TOP; Z=0 at upper surface.</text><text id="eba3983af85" x="35" y="80" fill="#172b3a">TOP: right=+X, up=+Y. FRONT: right=+X, down=depth. RIGHT: right=-Y, down=depth.</text><text id="ec55109090a" x="35" y="105" fill="#172b3a">Hole IDs A/B/C identify individual features. All holes are normal to TOP. Dashed edges are hidden.</text><text id="e2c13e6b274" x="160" y="490" fill="#172b3a" font-size="12">A1</text><line id="ee92b8cbb73" x1="159" y1="494" x2="150" y2="510" stroke="#172b3a" stroke-width=".7" /><text id="e2550d79c1d" x="276" y="470" fill="#172b3a" font-size="12">B2</text><line id="e23a6f6d606" x1="275" y1="474" x2="266" y2="490" stroke="#172b3a" stroke-width=".7" /><text id="e0e50837840" x="408" y="498" fill="#172b3a" font-size="12">C3</text><line id="eb7ad0016a6" x1="407" y1="502" x2="398" y2="518" stroke="#172b3a" stroke-width=".7" /><text id="e92835be9a3" x="572" y="482" fill="#172b3a" font-size="12">B4</text><line id="ea60f431faf" x1="571" y1="486" x2="562" y2="502" stroke="#172b3a" stroke-width=".7" /><text id="e913f880c01" x="696" y="454" fill="#172b3a" font-size="12">A5</text><line id="ea2680b3ca1" x1="695" y1="458" x2="686" y2="474" stroke="#172b3a" stroke-width=".7" /><text id="e498b3e41be" x="192" y="282" fill="#172b3a" font-size="12">C6</text><line id="e04d58f19a5" x1="191" y1="286" x2="182" y2="302" stroke="#172b3a" stroke-width=".7" /><text id="ecb96faf234" x="316" y="302" fill="#172b3a" font-size="12">B7</text><line id="ec3f52dbe52" x1="315" y1="306" x2="306" y2="322" stroke="#172b3a" stroke-width=".7" /><text id="e4db61abcc1" x="444" y="258" fill="#172b3a" font-size="12">A8</text><line id="ee68b8a335b" x1="443" y1="262" x2="434" y2="278" stroke="#172b3a" stroke-width=".7" /><text id="e9c0a002d0f" x="564" y="286" fill="#172b3a" font-size="12">C9</text><line id="eb7e0b1aec6" x1="563" y1="290" x2="554" y2="306" stroke="#172b3a" stroke-width=".7" /><text id="eaaebe88d04" x="692" y="306" fill="#172b3a" font-size="12">B10</text><line id="e19f564db9d" x1="691" y1="310" x2="682" y2="326" stroke="#172b3a" stroke-width=".7" /><text id="ea1c1e3eda3" x="70" y="170" fill="#172b3a">TOP (X,Y)</text><text id="e29dcccdb24" x="70" y="673" fill="#172b3a">FRONT (X,depth)</text><text id="e1667d2b5db" x="990" y="673" fill="#172b3a">RIGHT (-Y,depth)</text><text id="ed4ea4c82a9" x="40" y="850" fill="#172b3a">A: DIA 6 THRU</text><text id="ef1d1e475d9" x="40" y="875" fill="#172b3a">B: DIA 8 BLIND DEPTH 7</text><text id="e5b38c35bbd" x="40" y="900" fill="#172b3a">C: DIA 6 THRU, COUNTERBORE DIA 14 DEPTH 4</text><text id="edab06528ed" x="40" y="925" fill="#172b3a">No countersinks, fillets or other features. All views are 4 page units per mm; RIGHT is reflected as labeled.</text></g><g transform="translate(70,590) scale(4,-4)" stroke="#172b3a" stroke-width=".25" fill="none"><rect id="ef3ba41d1bb" x="-0.0" y="0.0" width="180.0" height="100.0" /><circle id="ea2caaed1b1" cx="20" cy="20" r="3" /><circle id="e8d61a3a20e" cx="49" cy="25" r="4" /><circle id="e0651139d7a" cx="82" cy="18" r="3" /><circle id="e434f779146" cx="82" cy="18" r="7" /><circle id="eefb661225b" cx="123" cy="22" r="4" /><circle id="edd2f7de080" cx="154" cy="29" r="3" /><circle id="e680363c9ca" cx="28" cy="72" r="3" /><circle id="e13b739e7c1" cx="28" cy="72" r="7" /><circle id="ee27c31481c" cx="59" cy="67" r="4" /><circle id="e4d4222cffa" cx="91" cy="78" r="3" /><circle id="e682c1852c7" cx="121" cy="71" r="3" /><circle id="e66d0dbdd87" cx="121" cy="71" r="7" /><circle id="e3aadc5ce8e" cx="153" cy="66" r="4" /></g><g transform="translate(70,690) scale(4,4)" stroke="#172b3a" stro