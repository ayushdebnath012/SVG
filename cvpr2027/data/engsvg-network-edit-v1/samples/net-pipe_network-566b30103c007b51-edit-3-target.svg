<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
<rect id="background" width="1100" height="680" fill="white"/>
<text id="title" x="40" y="50" font-size="22" font-weight="bold" fill="#1f4e79">Water distribution network</text>
<g id="pipes" fill="none" stroke="#1f4e79" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<path id="P1" d="M150 180 L260 180"/>
<path id="P2" d="M260 180 L420 180 L420 330"/>
<path id="P4" d="M260 330 L420 330"/>
<path id="P5" d="M260 330 L260 480 L420 480 L420 330"/>
<path id="P6" d="M420 330 L580 330"/>
</g>
<g id="pipe-labels" font-size="12" fill="#1f4e79">
<text id="P1-label" x="205" y="168" text-anchor="middle">P1 270 m Ø250</text>
<text id="P2-label" x="340" y="168" text-anchor="middle">P2 430 m Ø125</text>
<text id="P4-label" x="340" y="318" text-anchor="middle">P4 600 m Ø125</text>
<text id="P5-label" x="340" y="468" text-anchor="middle">P5 730 m Ø80</text>
<text id="P6-label" x="500" y="318" text-anchor="middle">P6 800 m Ø125</text>
</g>
<g id="reservoirs" stroke="#1f4e79">
<g id="R1">
<rect id="R1-body" x="80" y="155" width="70" height="50" fill="#cfe8ff" stroke-width="2"/>
<line id="R1-level" x1="88" y1="168" x2="142" y2="168" stroke-width="1.5"/>
<text id="R1-label" x="115" y="144" font-size="13" text-anchor="middle" stroke="none" fill="#1f4e79">R1 H=38 m</text>
</g>
</g>
<g id="junctions" fill="#1f4e79">
<g id="J1">
<circle id="J1-dot" cx="260" cy="180" r="6"/>
<text id="J1-label" x="268" y="202" font-size="11">J1 q=15 L/s z=14 m</text>
</g>
<g id="J2">
<circle id="J2-dot" cx="260" cy="330" r="6"/>
<text id="J2-label" x="268" y="352" font-size="11">J2 q=10 L/s z=20 m</text>
</g>
<g id="J3">
<circle id="J3-dot" cx="420" cy="330" r="6"/>
<text id="J3-label" x="428" y="352" font-size="11">J3 q=8 L/s z=2 m</text>
</g>
<g id="J4">
<circle id="J4-dot" cx="580" cy="330" r="6"/>
<text id="J4-label" x="588" y="352" font-size="11">J4 q=2 L/s z=6 m</text>
</g>
</g>
<text id="roughness-note" x="40" y="590" font-size="14" fill="#1f4e79">Pipe roughness ε = 0.26 mm</text>
<text id="elbow-note" x="560" y="590" font-size="14" fill="#1f4e79">Minor loss: 90° elbow K = 0.9</text>
<text id="pressure-note" x="40" y="616" font-size="14" fill="#1f4e79">Minimum pressure head 20 m</text>
<text id="velocity-note" x="560" y="616" font-size="14" fill="#1f4e79">Maximum velocity 2.5 m/s</text>
</svg>